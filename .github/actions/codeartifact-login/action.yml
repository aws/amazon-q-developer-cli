name: CodeArtifact Login
description: Authenticate to CodeArtifact and write .npmrc for @kiro packages

inputs:
  restore-role-arn:
    description: Role ARN to re-assume after CodeArtifact login (for build jobs that need their original credentials back)
    required: false
    default: ""
  restore-region:
    description: AWS region for the restored role
    required: false
    default: ""
  restore-duration:
    description: Role duration in seconds for the restored role
    required: false
    default: "3600"

runs:
  using: composite
  steps:
    - name: Configure AWS credentials for CodeArtifact
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: arn:aws:iam::273221486557:role/kiro-agent-npm-packages-reader
        aws-region: us-west-2

    - name: Login to CodeArtifact
      shell: bash
      run: |
        REGISTRY="kiro-agent-273221486557.d.codeartifact.us-west-2.amazonaws.com/npm/npm-packages"
        for attempt in 1 2 3; do
          if TOKEN=$(aws codeartifact get-authorization-token --domain kiro-agent --domain-owner 273221486557 --query authorizationToken --output text --region us-west-2) && [ -n "$TOKEN" ] && [ "$TOKEN" != "None" ]; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          echo "CodeArtifact token request failed (attempt $attempt/3); retrying" >&2
          sleep $((attempt * 5))
        done
        echo "::add-mask::$TOKEN"
        printf '@kiro:registry=https://%s/\n@amzn:registry=https://%s/\n//%s/:always-auth=true\n//%s/:_authToken=%s\n' "$REGISTRY" "$REGISTRY" "$REGISTRY" "$REGISTRY" "$TOKEN" > .npmrc

    # The registry token now lives in .npmrc, so nothing downstream needs the role session.
    - name: Drop AWS session credentials
      if: inputs.restore-role-arn == ''
      shell: bash
      run: |
        {
          echo 'AWS_ACCESS_KEY_ID='
          echo 'AWS_SECRET_ACCESS_KEY='
          echo 'AWS_SESSION_TOKEN='
        } >> "$GITHUB_ENV"

    - name: Restore AWS credentials for build
      if: inputs.restore-role-arn != ''
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.restore-role-arn }}
        aws-region: ${{ inputs.restore-region }}
        role-duration-seconds: ${{ inputs.restore-duration }}
