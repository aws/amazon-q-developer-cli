name: 1.0.1 Generate Autodocs Embeddings

on:
  workflow_call:
    inputs:
      commit_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  generate-v1:
    name: Generate V1 Embeddings
    runs-on: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate V1 embeddings
        run: ./scripts/generate-embeddings.sh

      - name: Log V1 embeddings metadata
        run: |
          echo "=== V1 Autodocs Embeddings ==="
          echo "generated_at: $(python3 -c "import json; print(json.load(open('autodocs/meta/doc-index.json'))['generated_at'])")"
          echo "total_docs: $(python3 -c "import json; print(json.load(open('autodocs/meta/doc-index.json'))['total_docs'])")"
          echo "tar.gz size: $(du -h autodocs/meta/doc-search-index.tar.gz | cut -f1)"
          echo "tar.gz sha256: $(shasum -a 256 autodocs/meta/doc-search-index.tar.gz | cut -d' ' -f1)"

      - name: Upload V1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autodocs-embeddings-v1
          retention-days: 1
          path: autodocs/meta

  generate-v2:
    name: Generate V2 Embeddings
    runs-on: ubuntu-latest-8-cores
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate V2 embeddings
        run: ./scripts/generate-embeddings-v2.sh

      - name: Log V2 embeddings metadata
        run: |
          echo "=== V2 Autodocs Embeddings ==="
          echo "generated_at: $(python3 -c "import json; print(json.load(open('autodocs-v2/meta/doc-index.json'))['generated_at'])")"
          echo "total_docs: $(python3 -c "import json; print(json.load(open('autodocs-v2/meta/doc-index.json'))['total_docs'])")"
          echo "tar.gz size: $(du -h autodocs-v2/meta/doc-search-index.tar.gz | cut -f1)"
          echo "tar.gz sha256: $(shasum -a 256 autodocs-v2/meta/doc-search-index.tar.gz | cut -d' ' -f1)"

      - name: Upload V2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autodocs-embeddings-v2
          retention-days: 1
          path: autodocs-v2/meta
