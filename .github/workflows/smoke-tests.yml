name: Smoke Tests

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platforms to run on"
        type: choice
        required: true
        default: "all"
        options:
          - all
          - linux
          - macos
          - windows
      engine:
        description: "Agent engine to test"
        type: choice
        required: true
        default: "all"
        options:
          - all
          - rust
          - kas
      ui_mode:
        description: "UI mode to test"
        type: choice
        required: true
        default: "tui"
        options:
          - tui
          - lite
      reason:
        description: "Why are you running this?"
        required: false
        default: 'ad-hoc'
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      engine:
        type: string
        required: false
        default: 'all'

permissions:
  contents: read
  id-token: write

jobs:
  matrix:
    name: Resolve platforms
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.set.outputs.platforms }}
      engines: ${{ steps.set.outputs.engines }}
      ui_modes: ${{ steps.set.outputs.ui_modes }}
    steps:
      - id: set
        run: |
          case "${{ inputs.platform }}" in
            linux)   echo 'platforms=["ubuntu-latest"]' >> "$GITHUB_OUTPUT" ;;
            macos)   echo 'platforms=["macos-latest"]' >> "$GITHUB_OUTPUT" ;;
            windows) echo 'platforms=["windows-x64-latest-16-cores"]' >> "$GITHUB_OUTPUT" ;;
            *)       echo 'platforms=["ubuntu-latest","macos-latest","windows-x64-latest-16-cores"]' >> "$GITHUB_OUTPUT" ;;
          esac
          case "${{ inputs.engine }}" in
            rust) echo 'engines=["rust"]' >> "$GITHUB_OUTPUT" ;;
            kas)  echo 'engines=["kas"]' >> "$GITHUB_OUTPUT" ;;
            *)    echo 'engines=["rust","kas"]' >> "$GITHUB_OUTPUT" ;;
          esac
          case "${{ inputs.channel }}" in
            nightly) echo 'ui_modes=["tui","lite"]' >> "$GITHUB_OUTPUT" ;;
            *)
              case "${{ inputs.ui_mode }}" in
                lite) echo 'ui_modes=["lite"]' >> "$GITHUB_OUTPUT" ;;
                *)    echo 'ui_modes=["tui"]' >> "$GITHUB_OUTPUT" ;;
              esac
              ;;
          esac

  smoke:
    name: Smoke (${{ matrix.os }}/${{ matrix.engine }}/${{ matrix.ui_mode }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.matrix.outputs.platforms) }}
        engine: ${{ fromJSON(needs.matrix.outputs.engines) }}
        ui_mode: ${{ fromJSON(needs.matrix.outputs.ui_modes) }}
    env:
      RUN_ID: smoke-${{ github.run_id }}-${{ matrix.os }}-${{ matrix.engine }}-${{ matrix.ui_mode }}
      KIRO_CHAT_CLI_BIN: ${{ github.workspace }}/target/debug/chat_cli
      KIRO_AGENT_ENGINE: ${{ matrix.engine == 'kas' && 'kas' || '' }}
      KIRO_UI_MODE: ${{ matrix.ui_mode }}
      KIRO_LITE_ROLLOUT_ENABLED: ${{ matrix.ui_mode == 'lite' && '1' || '0' }}
      TERM: xterm-256color
      COLORTERM: truecolor
      FORCE_COLOR: '3'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-smoke-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Build chat_cli
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo build -p chat_cli --no-default-features
          else
            cargo build -p chat_cli
          fi

      - uses: ./.github/actions/codeartifact-login
        continue-on-error: true

      - run: bun install
      - run: bun run build
        working-directory: packages/twinki/packages/twinki
      - run: bun run build
        working-directory: packages/tui

      - name: Shim chat_cli onto PATH (unix)
        if: runner.os != 'Windows'
        run: |
          chmod +x target/debug/chat_cli
          mkdir -p "$HOME/.local/bin"
          ln -sf "$GITHUB_WORKSPACE/target/debug/chat_cli" "$HOME/.local/bin/kiro-cli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Shim chat_cli onto PATH (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "$env:USERPROFILE\.local\bin"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          Copy-Item "target\debug\chat_cli.exe" "$binDir\kiro-cli.exe"
          "$binDir" | Out-File -Append -FilePath $env:GITHUB_PATH

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::551670267384:role/KiroReviewerGitHubActionsRole
          aws-region: us-east-1

      - name: Start Knight Rider (Windows)
        if: runner.os == 'Windows'
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_REVIEW_PAT }}
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}/.smoke-frames
          SMOKE_ENGINE: ${{ matrix.engine }}
        shell: bash
        run: bash scripts/knight-rider.sh start

      - name: Run smoke scenarios
        timeout-minutes: 30
        continue-on-error: true
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_REVIEW_PAT }}
          SMOKE_OUTPUT_DIR: ${{ github.workspace }}/.smoke-frames
          SMOKE_ENGINE: ${{ matrix.engine }}
          SMOKE_KNIGHT_RIDER_PRESTARTED: ${{ runner.os == 'Windows' && '1' || '0' }}
        shell: bash
        run: |
          mkdir -p "$SMOKE_OUTPUT_DIR"
          prompt="Run all scenarios. Engine: ${{ matrix.engine }}. UI mode: ${{ matrix.ui_mode }}. On Windows, Knight Rider is already running; verify it and do not start or restart it. Follow the smoke prompt exactly."
          if [ "$RUNNER_OS" = "Windows" ]; then
            # A long-lived child can retain the workflow pipe on Windows after the agent finishes.
            kiro-cli chat --no-interactive --trust-all-tools --agent smoke-test \
              "$prompt" > "$SMOKE_OUTPUT_DIR/session.log" 2>&1 || true
            cat "$SMOKE_OUTPUT_DIR/session.log"
          else
            kiro-cli chat --no-interactive --trust-all-tools --agent smoke-test \
              "$prompt" 2>&1 | tee "$SMOKE_OUTPUT_DIR/session.log" || true
          fi

      - name: Stop Knight Rider (Windows)
        if: always() && runner.os == 'Windows'
        shell: bash
        run: bash scripts/knight-rider.sh stop || true

      - name: Collect evidence frames
        if: always()
        shell: bash
        run: |
          FRAMES_DIR="${{ github.workspace }}/.smoke-frames"
          KR_ROOT="${{ github.workspace }}/packages/tui/e2e_tests/test-outputs"
          mkdir -p "$FRAMES_DIR"
          # If agent didn't write to .smoke-frames, copy from Knight Rider's default output.
          if ! find "$FRAMES_DIR" -name '*.html' -print -quit 2>/dev/null | grep -q .; then
            KR_DIR=""
            if [ -d "$KR_ROOT" ]; then
              KR_DIR=$(find "$KR_ROOT" -maxdepth 1 -name 'knight-rider-*' -type d 2>/dev/null | sort -r | head -1 || true)
            fi
            if [ -n "$KR_DIR" ] && [ -d "$KR_DIR" ]; then
              echo "Copying frames from $KR_DIR to $FRAMES_DIR"
              cp -r "$KR_DIR"/. "$FRAMES_DIR"/ 2>/dev/null || true
            fi
          fi
          # Ensure _summary.md exists for dashboard rendering
          if [ -f "$FRAMES_DIR/summary-results.md" ]; then
            cp "$FRAMES_DIR/summary-results.md" "$FRAMES_DIR/_summary.md"
          fi
          frames=$(find "$FRAMES_DIR" -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
          echo "Frame count: $frames"

      - name: Sync evidence to S3
        if: always()
        shell: bash
        run: |
          aws s3 sync "${{ github.workspace }}/.smoke-frames/" "s3://kiro-reviewer-archive/evidence/${RUN_ID}/" || true

      - name: Generate summary
        if: always()
        shell: bash
        run: |
          FRAMES_DIR="${{ github.workspace }}/.smoke-frames"
          frames=$(find "$FRAMES_DIR" -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "## Smoke Tests — ${{ matrix.os }} / ${{ matrix.engine }} / ${{ matrix.ui_mode }}"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Frames captured** | $frames |"
            echo "| **Engine** | ${{ matrix.engine }} |"
            echo "| **UI mode** | ${{ matrix.ui_mode }} |"
            echo "| **Run ID** | \`${RUN_ID}\` |"
            echo "| **Reason** | ${{ inputs.reason }} |"
            echo ""
            if [ -f "$FRAMES_DIR/summary-results.md" ]; then
              cat "$FRAMES_DIR/summary-results.md"
            else
              echo "⚠️ Agent did not produce summary-results.md"
              echo ""
              echo "Frames captured: $frames"
              if [ -f "$FRAMES_DIR/session.log" ]; then
                echo ""
                echo "### Agent output (last 40 lines)"
                echo '```'
                tail -40 "$FRAMES_DIR/session.log"
                echo '```'
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-frames-${{ env.RUN_ID }}
          path: ${{ github.workspace }}/.smoke-frames
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Require captured frames
        if: always()
        shell: bash
        run: |
          frames=$(find "${{ github.workspace }}/.smoke-frames" -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
          if [ "$frames" -eq 0 ]; then
            echo "::error::Smoke leg captured zero evidence frames"
            exit 1
          fi

  cloud-smoke:
    # Deterministic cloud-session smoke: drives the built binary through the
    # scripted knight-rider cloud scenarios against the hermetic mock BFF
    # (packages/tui/e2e_tests/cloud/knight-rider-smoke.sh). Release-profile
    # binary ON PURPOSE: the dark-ship injected-row check is only meaningful
    # there (a debug build force-enables every rollout feature and the script
    # SKIPs it), and this is the only pipeline that runs it. The mock BFF is
    # the backend — no LLM, no prod credentials — so a failure is a CLI
    # regression, not backend weather; the only AWS touch is the
    # CodeArtifact login for the @kiro/agent install (essential: without it
    # there is no KAS server and every scenario fails at boot, hence no
    # continue-on-error on that step). Runs unconditionally on every
    # invocation (dispatch platform/engine inputs are for the LLM smoke
    # matrix; this job is single-platform by design).
    name: Cloud Smoke (mock BFF)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      KIRO_CHAT_CLI_BIN: ${{ github.workspace }}/target/release/chat_cli
      # A source-built binary has no embedded KAS/TUI bundle (packaging adds
      # those), so explicit paths are provided, mirroring the E2E harness:
      # the KAS server from node_modules, the TUI bundle from dist, and the
      # runner's node (>= 20) for the KAS process — without KIRO_KAS_NODE_PATH
      # the binary falls back to running KAS under bun, a test-only path.
      KIRO_KAS_SERVER_PATH: ${{ github.workspace }}/packages/tui/node_modules/@kiro/agent/dist/server/acp-server.js
      KIRO_KAS_NODE_PATH: node
      KIRO_TEST_TUI_JS_PATH: ${{ github.workspace }}/packages/tui/dist/tui.js
      TERM: xterm-256color
      COLORTERM: truecolor
      FORCE_COLOR: '3'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Read pinned bun version
        id: bun-ver
        shell: bash
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-cloud-smoke-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-cloud-smoke-${{ runner.os }}-

      # Release profile on purpose — see the dark-ship note above.
      - name: Build chat_cli (release)
        run: cargo build -p chat_cli --release

      - name: CodeArtifact login (@kiro/agent — required, see job comment)
        uses: ./.github/actions/codeartifact-login

      - name: Install JS dependencies
        run: bun install

      - name: Build twinki
        run: bun run build
        working-directory: packages/twinki/packages/twinki

      - name: Build TUI bundle
        run: bun run build
        working-directory: packages/tui

      # continue-on-error mirrors the sibling smoke job: build-and-release
      # treats smoke_tests as non-blocking, and a red job here would fail the
      # release run's check + fire the nightly failure Slack ping while the
      # judge report (which only reads smoke-frames-*) stayed silent about
      # why. The step summary below carries the verdict instead; failures
      # surface there and in the uploaded evidence.
      - name: Run cloud smoke (mock)
        id: cloud-smoke
        continue-on-error: true
        timeout-minutes: 35
        working-directory: packages/tui
        run: |
          set -o pipefail
          bash e2e_tests/cloud/knight-rider-smoke.sh mock 2>&1 | tee /tmp/cloud-smoke-run.log

      - name: Collect diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p packages/tui/e2e_tests/test-outputs/diagnostics
          cp /tmp/cloud-smoke-run.log /tmp/kr-cloud-smoke.log /tmp/mock-bff-smoke.log \
            packages/tui/e2e_tests/test-outputs/diagnostics/ 2>/dev/null || true

      - name: Write step summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Cloud Smoke (mock BFF, release binary)"
            echo ""
            if [ "${{ steps.cloud-smoke.outcome }}" = "success" ]; then
              echo "✅ ALL PASS"
            else
              echo "❌ FAILED — see cloud-smoke-frames artifact (diagnostics/ has the run + BFF logs)"
            fi
            echo ""
            echo '```'
            grep -E "^  (PASS|FAIL|SKIP|WARN)" /tmp/cloud-smoke-run.log 2>/dev/null || echo "no check lines captured"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload cloud smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-smoke-frames-${{ github.run_id }}
          path: packages/tui/e2e_tests/test-outputs/
          if-no-files-found: warn
          retention-days: 30

  judge:
    name: LLM Judge
    needs: [matrix, smoke]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha || github.sha }}

      - name: Download all smoke artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: smoke-frames-*
          path: ${{ github.workspace }}/evidence

      - name: Install kiro-cli
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          echo "$HOME/.kiro/bin" >> "$GITHUB_PATH"

      - name: Verify kiro-cli
        run: kiro-cli --version

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::551670267384:role/KiroReviewerGitHubActionsRole
          aws-region: us-east-1

      - name: Run LLM Judge
        id: run_judge
        timeout-minutes: 25
        continue-on-error: true
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_REVIEW_PAT }}
          SMOKE_EVIDENCE_DIR: ${{ github.workspace }}/evidence
          SMOKE_EXPECTED_PLATFORMS: ${{ needs.matrix.outputs.platforms }}
          SMOKE_EXPECTED_ENGINES: ${{ needs.matrix.outputs.engines }}
          SMOKE_EXPECTED_UI_MODES: ${{ needs.matrix.outputs.ui_modes }}
        shell: bash
        run: |
          kiro-cli chat --no-interactive --trust-all-tools --agent smoke-judge \
            "Evaluate the smoke test evidence in $SMOKE_EVIDENCE_DIR and render a verdict." \
            2>&1 | tee ${{ github.workspace }}/evidence/judge-session.log

      - name: Check verdict
        if: always()
        continue-on-error: true
        env:
          SMOKE_EXPECTED_PLATFORMS: ${{ needs.matrix.outputs.platforms }}
          SMOKE_EXPECTED_ENGINES: ${{ needs.matrix.outputs.engines }}
          SMOKE_EXPECTED_UI_MODES: ${{ needs.matrix.outputs.ui_modes }}
          JUDGE_STEP_OUTCOME: ${{ steps.run_judge.outcome }}
        shell: bash
        run: |
          VERDICT_FILE="${{ github.workspace }}/evidence/judge-verdict.json"
          write_fail_verdict() {
            local summary="$1"
            local reason="$2"
            local expected="${3:-[]}"
            local actual="${4:-[]}"
            jq \
              --arg summary "$summary" \
              --arg reason "$reason" \
              --argjson expected "$expected" \
              --argjson actual "$actual" \
              '.verdict = "fail"
               | .summary = $summary
               | .critical_failures = ((
                   if (.critical_failures | type) == "array"
                   then .critical_failures
                   else []
                   end
                 ) + [{
                   "reason": $reason,
                   "expected": $expected,
                   "actual": $actual
                 }])' \
              "$VERDICT_FILE" > "$VERDICT_FILE.tmp"
            mv "$VERDICT_FILE.tmp" "$VERDICT_FILE"
          }

          if [ ! -f "$VERDICT_FILE" ]; then
            SUMMARY="Judge did not produce a verdict file"
            jq -n \
              --arg summary "$SUMMARY" \
              '{verdict: "fail", summary: $summary, checks: {}, legs: [],
                critical_failures: [{reason: "missing-verdict-file"}],
                warnings: []}' > "$VERDICT_FILE"
            echo "## LLM Judge" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ $SUMMARY" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$SUMMARY"
            exit 1
          fi

          if ! jq -e 'type == "object"' "$VERDICT_FILE" > /dev/null; then
            SUMMARY="Judge produced malformed verdict JSON"
            jq -n \
              --arg summary "$SUMMARY" \
              '{verdict: "fail", summary: $summary, checks: {}, legs: [],
                critical_failures: [{reason: "malformed-verdict-json"}],
                warnings: []}' > "$VERDICT_FILE.tmp"
            mv "$VERDICT_FILE.tmp" "$VERDICT_FILE"
            echo "::error::$SUMMARY"
            exit 1
          fi

          if [ "$JUDGE_STEP_OUTCOME" != "success" ]; then
            SUMMARY="LLM judge step did not complete successfully"
            write_fail_verdict "$SUMMARY" "judge-step-$JUDGE_STEP_OUTCOME"
            echo "::error::$SUMMARY"
            exit 1
          fi

          if ! EXPECTED_LEGS=$(jq -cn \
            --argjson platforms "$SMOKE_EXPECTED_PLATFORMS" \
            --argjson engines "$SMOKE_EXPECTED_ENGINES" \
            --argjson ui_modes "$SMOKE_EXPECTED_UI_MODES" \
            '[$platforms[] as $os | $engines[] as $engine | $ui_modes[] as $ui_mode | "\($os)/\($engine)/\($ui_mode)"] | sort'); then
            SUMMARY="Smoke matrix outputs are missing or invalid"
            write_fail_verdict "$SUMMARY" "invalid-expected-matrix"
            echo "::error::$SUMMARY"
            exit 1
          fi

          DISCOVERED_LEGS=$(
            for artifact_dir in \
              "${{ github.workspace }}/evidence"/smoke-frames-smoke-"${{ github.run_id }}"-*; do
              [ -d "$artifact_dir" ] || continue
              identity="${artifact_dir##*/smoke-frames-smoke-${{ github.run_id }}-}"
              ui_mode="${identity##*-}"
              without_ui="${identity%-*}"
              engine="${without_ui##*-}"
              os="${without_ui%-*}"
              printf '%s/%s/%s\n' "$os" "$engine" "$ui_mode"
            done | jq -Rsc 'split("\n") | map(select(length > 0)) | sort'
          )
          if [ "$DISCOVERED_LEGS" != "$EXPECTED_LEGS" ]; then
            SUMMARY="Downloaded smoke artifact set does not match the expected matrix"
            write_fail_verdict \
              "$SUMMARY" "artifact-leg-mismatch" \
              "$EXPECTED_LEGS" "$DISCOVERED_LEGS"
            echo "::error::$SUMMARY"
            echo "Expected: $EXPECTED_LEGS"
            echo "Actual:   $DISCOVERED_LEGS"
            exit 1
          fi

          if ! jq -e \
            --arg artifact_prefix \
              "smoke-frames-smoke-${{ github.run_id }}-" '
            def checks_valid:
              if type != "object" then false
              else
                . as $checks
                | (
                [
                  $checks["process-alive"],
                  $checks["no-crash"],
                  $checks["command-recognized"],
                  $checks["panel-opened"],
                  $checks["prompt-ready"],
                  $checks["response-received"]
                ] | all(.[];
                  if type != "object" then false
                  else (.pass | type) == "boolean"
                  end
                ))
                and (
                  $checks["command-recognized"].failures | type
                ) == "array"
                and ($checks["panel-opened"].failures | type) == "array"
                and ($checks["prompt-ready"].failures | type) == "array"
                and (
                  $checks["response-received"].failures | type
                ) == "array"
                and $checks["command-recognized"].pass == (
                  ($checks["command-recognized"].failures | length) == 0
                )
                and $checks["panel-opened"].pass == (
                  ($checks["panel-opened"].failures | length) == 0
                )
                and $checks["prompt-ready"].pass == (
                  ($checks["prompt-ready"].failures | length) == 0
                )
                and $checks["response-received"].pass == (
                  ($checks["response-received"].failures | length) == 0
                )
              end;
            if (.legs | type) != "array" then false
            elif (.critical_failures | type) != "array" then false
            elif (.warnings | type) != "array" then false
            elif (.summary | type) != "string" then false
            elif (.checks | checks_valid | not) then false
            else
              all(.legs[];
                if type != "object" then false
                else
                  (.os | type) == "string"
                  and (.engine | type) == "string"
                  and (.ui_mode | type) == "string"
                  and (.artifact_directory | type) == "string"
                  and .artifact_directory == (
                    $artifact_prefix
                    + .os + "-" + .engine + "-" + .ui_mode
                  )
                  and .rendered_ui_verified == true
                  and (
                    .verdict == "pass"
                    or .verdict == "warn"
                    or .verdict == "fail"
                  )
                  and (.critical_failures | type) == "array"
                  and (.warnings | type) == "array"
                  and (.checks | checks_valid)
                end
              )
            end' \
            "$VERDICT_FILE" > /dev/null; then
            SUMMARY="Judge produced invalid or unverified leg results"
            write_fail_verdict "$SUMMARY" "invalid-leg-report"
            echo "::error::$SUMMARY"
            exit 1
          fi

          REPORTED_LEGS=$(jq -c \
            '[.legs[] | "\(.os)/\(.engine)/\(.ui_mode)"] | sort' \
            "$VERDICT_FILE")
          if [ "$REPORTED_LEGS" != "$EXPECTED_LEGS" ]; then
            SUMMARY="Judge-reported smoke leg set does not match the expected matrix"
            write_fail_verdict \
              "$SUMMARY" "reported-leg-mismatch" \
              "$EXPECTED_LEGS" "$REPORTED_LEGS"
            echo "::error::$SUMMARY"
            echo "Expected: $EXPECTED_LEGS"
            echo "Actual:   $REPORTED_LEGS"
            exit 1
          fi

          VERDICT=$(jq -r '.verdict' "$VERDICT_FILE")
          SUMMARY=$(jq -r '.summary' "$VERDICT_FILE")
          case "$VERDICT" in
            pass|warn|fail) ;;
            *)
              INVALID_VERDICT="$VERDICT"
              SUMMARY="Judge produced invalid verdict: $INVALID_VERDICT"
              write_fail_verdict "$SUMMARY" "invalid-verdict"
              echo "::error::$SUMMARY"
              exit 1
              ;;
          esac

          if ! jq -e '
            def check_values:
              [
                .checks["process-alive"].pass,
                .checks["no-crash"].pass,
                .checks["command-recognized"].pass,
                .checks["panel-opened"].pass,
                .checks["prompt-ready"].pass,
                .checks["response-received"].pass
              ];
            def hard_failure:
              .checks["process-alive"].pass == false
              or .checks["no-crash"].pass == false
              or (
                .checks["command-recognized"].failures | length
              ) >= 3
              or (.checks["panel-opened"].failures | length) >= 3
              or (.checks["prompt-ready"].failures | length) >= 3
              or (
                .checks["response-received"].failures | length
              ) >= 2;
            def blocking_legs:
              if any(.legs[]; .engine == "rust")
              then [.legs[] | select(.engine == "rust")]
              else .legs
              end;
            def leg_consistent:
              if .verdict == "pass" then
                all(check_values[]; . == true)
                and (.critical_failures | length) == 0
                and (.warnings | length) == 0
              elif .verdict == "warn" then
                (hard_failure | not)
                and (.critical_failures | length) == 0
                and (.warnings | length) > 0
              else
                .verdict == "fail"
                and (.critical_failures | length) > 0
              end;
            def aggregate_checks_match:
              . as $report
              | ($report | blocking_legs) as $blocking
              | [
                  "process-alive",
                  "no-crash",
                  "command-recognized",
                  "panel-opened",
                  "prompt-ready",
                  "response-received"
                ] as $names
              | all($names[];
                  . as $name
                  | $report.checks[$name].pass == (
                      [$blocking[].checks[$name].pass]
                      | all(.[]; . == true)
                    )
                );
            . as $report
            | ($report | blocking_legs) as $blocking
            | all(.legs[]; leg_consistent)
            and aggregate_checks_match
            and (
              if .verdict == "pass" then
                all(check_values[]; . == true)
                and all($blocking[]; .verdict == "pass")
                and (.critical_failures | length) == 0
                and (.warnings | length) == 0
              elif .verdict == "warn" then
                any($blocking[]; .verdict == "warn")
                and all($blocking[]; .verdict != "fail")
                and (.critical_failures | length) == 0
                and (.warnings | length) > 0
              else
                .verdict == "fail"
                and any($blocking[]; .verdict == "fail")
                and (.critical_failures | length) > 0
              end
            )' \
            "$VERDICT_FILE" > /dev/null; then
            SUMMARY="Judge verdict contradicts its per-leg results"
            write_fail_verdict "$SUMMARY" "inconsistent-aggregate-verdict"
            echo "::error::$SUMMARY"
            exit 1
          fi

          {
            echo "## LLM Judge Verdict"
            echo ""
            if [ -f "${{ github.workspace }}/evidence/judge-summary.md" ]; then
              cat "${{ github.workspace }}/evidence/judge-summary.md"
            else
              echo "**$VERDICT** — $SUMMARY"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$VERDICT" = "fail" ]; then
            echo "::error::Smoke test judge verdict: FAIL — $SUMMARY"
            exit 1
          fi

      - name: Upload judge artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-judge-verdict
          path: |
            ${{ github.workspace }}/evidence/judge-verdict.json
            ${{ github.workspace }}/evidence/judge-summary.md
            ${{ github.workspace }}/evidence/judge-session.log
          if-no-files-found: warn
          retention-days: 30

      - name: Post to Slack
        if: always()
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_REVIEWER_BOT_TOKEN }}
          RUN_REASON: ${{ inputs.reason || 'scheduled' }}
          VERDICT_FILE: ${{ github.workspace }}/evidence/judge-verdict.json
        run: bash scripts/smoke-slack-report.sh || true

      - name: Cut CTI ticket on failure
        if: always()
        shell: bash
        env:
          SMOKE_TICKETY_ENABLED: ${{ vars.SMOKE_TICKETY_ENABLED }}
          VERDICT_FILE: ${{ github.workspace }}/evidence/judge-verdict.json
        run: bash scripts/smoke-cut-ticket.sh || true
