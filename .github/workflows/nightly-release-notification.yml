name: Nightly Release Notification

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_timestamp:
        required: true
        type: string
      branch_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      build_timestamp:
        required: true
        type: string
      branch_name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare_message:
    name: Prepare Notification
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.build-message.outputs.message }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.branch_name }}

      - name: Get tag range
        id: tags
        run: |
          CURRENT_TAG=$(git tag -l 'v*-nightly.*' --sort=-version:refname | head -1)
          LAST_TAG=$(git tag -l 'v*-nightly.*' --sort=-version:refname | head -2 | tail -1)
          echo "current=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "last=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Tags: $LAST_TAG → $CURRENT_TAG"

      - name: Get changelog from fragments
        id: changelog
        run: |
          LAST_TAG="${{ steps.tags.outputs.last }}"
          CURRENT_TAG="${{ steps.tags.outputs.current }}"

          if [[ -z "$LAST_TAG" ]]; then
            # First nightly — show all fragments
            FRAGMENTS=$(find .changes -maxdepth 1 -name '*.json' 2>/dev/null)
          else
            # Fragments added between the two tags
            FRAGMENTS=$(git diff --name-only --diff-filter=A "$LAST_TAG".."$CURRENT_TAG" -- '.changes/*.json' || true)
          fi

          CHANGELOG=""
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            [[ ! -f "$f" ]] && continue
            TYPE=$(jq -r '.type // empty' "$f" 2>/dev/null)
            DESC=$(jq -r '.description // empty' "$f" 2>/dev/null)
            [[ -z "$DESC" ]] && continue
            CHANGELOG="${CHANGELOG}• [${TYPE}] ${DESC}\n"
          done <<< "$FRAGMENTS"

          if [[ -z "$CHANGELOG" ]]; then
            CHANGELOG="No new changelog entries in this nightly."
          fi

          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo -e "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Get commits
        id: commits
        run: |
          LAST_TAG="${{ steps.tags.outputs.last }}"
          CURRENT_TAG="${{ steps.tags.outputs.current }}"

          if [[ -z "$LAST_TAG" ]]; then
            COMMITS=$(git log --format="• %h %s (%an)" -10)
          else
            COMMITS=$(git log "${LAST_TAG}".."${CURRENT_TAG}" --format="• %h %s (%an)")
          fi
          COUNT=$(echo "$COMMITS" | wc -l | tr -d ' ')

          echo "list<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Format timestamp
        id: timestamp
        run: |
          TS="${{ inputs.build_timestamp }}"
          YEAR="${TS:0:4}"
          MONTH="${TS:4:2}"
          DAY="${TS:6:2}"
          HOUR="${TS:8:2}"
          MIN="${TS:10:2}"
          READABLE=$(TZ='America/Los_Angeles' date -d "${YEAR}-${MONTH}-${DAY} ${HOUR}:${MIN} UTC" "+%B %d, %Y at %I:%M %p PST")
          echo "readable=$READABLE" >> "$GITHUB_OUTPUT"

      - name: Build message
        id: build-message
        env:
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          COMMITS: ${{ steps.commits.outputs.list }}
          COMMIT_COUNT: ${{ steps.commits.outputs.count }}
        run: |
          jq -n \
            --arg message "🌙 New Kiro CLI nightly version released!" \
            --arg version "${{ inputs.version }}" \
            --arg timestamp "${{ steps.timestamp.outputs.readable }}" \
            --arg branch "${{ inputs.branch_name }}" \
            --arg changelog "$CHANGELOG" \
            --arg commits "$COMMITS" \
            --arg commit_count "$COMMIT_COUNT" \
            '{
              message: $message,
              version: $version,
              build_timestamp: $timestamp,
              branch_name: $branch,
              release_notes: $changelog,
              commits: $commits,
              commit_count: $commit_count
            }' > message.json
          echo "message<<JSONEOF" >> "$GITHUB_OUTPUT"
          cat message.json >> "$GITHUB_OUTPUT"
          echo "JSONEOF" >> "$GITHUB_OUTPUT"

  notify:
    name: Send Notification
    needs: prepare_message
    uses: ./.github/workflows/notify-slack.yml
    secrets:
      WEBHOOK_URL: ${{ secrets.SLACK_NIGHTLY_WEBHOOK_URL }}
    with:
      message: ${{ needs.prepare_message.outputs.message }}
