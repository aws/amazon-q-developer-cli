name: "PR: Changelog"

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

concurrency:
  group: docs-check-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr-assist:
    if: |
      (github.event_name == 'pull_request' &&
       github.actor != 'github-actions[bot]' &&
       github.event.pull_request.head.repo.fork != true &&
       !contains(github.event.pull_request.labels.*.name, 'no-changelog')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/changelog') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get PR info
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            PR_JSON=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json headRefName,headRefOid)
            echo "ref=$(echo $PR_JSON | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
            echo "sha=$(echo $PR_JSON | jq -r '.headRefOid')" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "ref=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.KIRO_WORKFLOWS_PAT }}

      - name: Determine what to run
        id: check
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== PR Context ==="
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "SHA: ${{ steps.pr.outputs.sha }}"
          echo "Ref: ${{ steps.pr.outputs.ref }}"
          echo ""

          # Check for code changes (three-dot: only this branch's changes)
          echo "=== Code changes in this branch ==="
          CODE_CHANGES=$(git diff --name-only origin/main...HEAD -- crates/ packages/tui/src/ | grep -v test || true)
          if [ -n "$CODE_CHANGES" ]; then
            echo "$CODE_CHANGES"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

          # Detect @kiro/agent version bump
          echo ""
          echo "=== KAS version bump check ==="
          OLD_VER=$(git show origin/main:packages/tui/package.json | jq -r '.dependencies["@kiro/agent"] // empty')
          NEW_VER=$(jq -r '.dependencies["@kiro/agent"] // empty' packages/tui/package.json)
          if [ -n "$OLD_VER" ] && [ -n "$NEW_VER" ] && [ "$OLD_VER" != "$NEW_VER" ]; then
            echo "KAS bump detected: $OLD_VER -> $NEW_VER"
            echo "kas_bump=true" >> "$GITHUB_OUTPUT"
            echo "kas_old_ver=$OLD_VER" >> "$GITHUB_OUTPUT"
            echo "kas_new_ver=$NEW_VER" >> "$GITHUB_OUTPUT"

            # Fetch release notes for all versions in the range (OLD_VER, NEW_VER]
            echo ""
            echo "=== Fetching KAS release notes ($OLD_VER -> $NEW_VER) ==="
            RELEASE_NOTES=""

            # Helper: returns 0 if $1 > $2 using semver numeric comparison
            ver_gt() { [ "$(printf '%s\n%s' "$1" "$2" | sort -V | head -1)" = "$2" ] && [ "$1" != "$2" ]; }
            # Helper: returns 0 if $1 <= $2
            ver_lte() { [ "$(printf '%s\n%s' "$1" "$2" | sort -V | head -1)" = "$1" ]; }

            for tag in $(gh release list --repo kiro-team/kiro-agent --limit 50 --json tagName --jq '.[].tagName'); do
              VER=${tag#agent-v-}
              # Include versions where VER > OLD_VER AND VER <= NEW_VER
              if ver_gt "$VER" "$OLD_VER" && ver_lte "$VER" "$NEW_VER"; then
                BODY=$(gh release view "$tag" --repo kiro-team/kiro-agent --json body --jq .body 2>/dev/null || true)
                if [ -n "$BODY" ]; then
                  RELEASE_NOTES="$RELEASE_NOTES
          --- Release $VER ---
          $BODY"
                fi
              fi
            done

            if [ -n "$RELEASE_NOTES" ]; then
              printf '%s' "$RELEASE_NOTES" > /tmp/kas_release_notes.txt
              echo "Collected release notes ($(wc -l < /tmp/kas_release_notes.txt) lines)"
            else
              echo "No release notes found in range"
              echo "kas_bump=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No KAS version change (current: ${NEW_VER:-none})"
            echo "kas_bump=false" >> "$GITHUB_OUTPUT"
          fi

          # If neither code changes nor KAS bump, skip
          if [ -z "$CODE_CHANGES" ] && [ "${OLD_VER:-}" = "${NEW_VER:-}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No user-facing code changes or KAS bump detected."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Check if changelog already exists
          echo ""
          echo "=== Changelog status ==="
          HAS_CHANGELOG=$(git diff --name-only origin/main...HEAD -- '.changes/*.json' || true)
          if [ -n "$HAS_CHANGELOG" ]; then
            echo "has_changelog=true" >> "$GITHUB_OUTPUT"
            echo "Existing changelog: $HAS_CHANGELOG"
          else
            echo "has_changelog=false" >> "$GITHUB_OUTPUT"
            echo "No changelog fragment found"
          fi

          # Determine trigger type for comment commands
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            if echo "$COMMENT_BODY" | grep -q "^/changelog"; then
              echo "trigger=changelog" >> "$GITHUB_OUTPUT"
            fi
            printf '%s' "$COMMENT_BODY" > /tmp/user_comment.txt
          else
            echo "trigger=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Kiro CLI
        if: steps.check.outputs.skip != 'true'
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          kiro-cli --version

      - name: Generate changelog for KAS bump
        if: |
          steps.check.outputs.skip != 'true' &&
          steps.check.outputs.kas_bump == 'true' &&
          (steps.check.outputs.has_changelog == 'false' || steps.check.outputs.trigger == 'changelog')
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_REVIEW_PAT }}
        run: |
          PROMPT="You are generating changelog fragments for a @kiro/agent version bump (${{ steps.check.outputs.kas_old_ver }} -> ${{ steps.check.outputs.kas_new_ver }}).

          Read .changes/GUIDELINES.md for format rules.
          Read .changes/VISIBILITY.md for what counts as user-facing.

          Below are the kiro-agent release notes for versions in this bump. Create changelog fragments ONLY for changes that are user-facing in Kiro CLI (things users would notice). Skip internal refactors, CI changes, test-only changes, and backend-only features that don't surface in the CLI.

          Prefix each V3/KAS-engine-only entry with [V3].
          Use ./scripts/new-change.sh <type> \"<description>\" to create entries.

          Release notes:
          $(cat /tmp/kas_release_notes.txt)"

          kiro-cli chat --no-interactive --trust-all-tools --model auto "$PROMPT" 2>&1 | tee /tmp/kas-changelog-output.txt
          echo ""
          echo "=== KAS changelog agent output ==="
          cat /tmp/kas-changelog-output.txt

      - name: Generate changelog
        if: |
          steps.check.outputs.skip != 'true' &&
          steps.check.outputs.kas_bump != 'true' &&
          (steps.check.outputs.has_changelog == 'false' || steps.check.outputs.trigger == 'changelog')
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_REVIEW_PAT }}
        run: |
          PROMPT="Read .changes/VISIBILITY.md FIRST — if the STOP CHECK applies, say 'Skipping' and STOP.

          Otherwise, review the code changes (git diff origin/main...HEAD) and determine if a changelog entry is needed.

          Read .changes/GUIDELINES.md for format rules. Use ./scripts/new-change.sh <type> \"<description>\" to create entries.

          If no changelog is needed, say so and stop."

          if [ -f /tmp/user_comment.txt ] && grep -q "^/changelog" /tmp/user_comment.txt; then
            EXTRA=$(sed 's|^/changelog||' /tmp/user_comment.txt)
            PROMPT="$PROMPT

          Additional instructions: $EXTRA"
          fi

          kiro-cli chat --no-interactive --trust-all-tools --model auto "$PROMPT" 2>&1 | tee /tmp/changelog-agent-output.txt
          echo ""
          echo "=== Changelog agent output ==="
          cat /tmp/changelog-agent-output.txt

      - name: Lint generated changelog
        if: |
          steps.check.outputs.skip != 'true' &&
          (steps.check.outputs.has_changelog == 'false' || steps.check.outputs.trigger == 'changelog')
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_REVIEW_PAT }}
        run: |
          NEW_FILES=$(git ls-files --others --exclude-standard '.changes/*.json' || true)
          if [ -n "$NEW_FILES" ]; then
            if ! ./scripts/lint-changelog.sh $NEW_FILES; then
              echo "Lint failed — asking agent to fix..."
              kiro-cli chat --no-interactive --trust-all-tools --model auto \
                "The changelog entry in $NEW_FILES failed lint. Read .changes/GUIDELINES.md for the rules, then fix the file in place." 2>&1
            fi
          fi

      - name: Check for changes
        if: steps.check.outputs.skip != 'true'
        id: generated
        run: |
          echo "=== Files modified by agents ==="
          git add .changes/ 2>/dev/null || true
          git diff --cached --name-only || true
          echo ""
          if git diff --cached --name-only | grep -qE '\.changes/[^/]+\.json$'; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changelog changes detected:"
            git diff --cached --name-only -- '.changes/*.json'
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes generated by agents."
          fi

      - name: Commit and push
        if: steps.generated.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .changes/
          git commit -m "chore: auto-generate changelog for PR #${{ steps.pr.outputs.number }}"
          git push origin HEAD:${{ steps.pr.outputs.ref }}

      - name: Post comment
        if: steps.generated.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(git diff --name-only HEAD~1 -- .changes/ 2>/dev/null || true)
          BODY="🤖 Generated changelog fragment:
          $(echo "$FILES" | sed 's/^/- /')

          Please review. To regenerate: \`/changelog <instructions>\`"

          gh pr comment "${{ steps.pr.outputs.number }}" --body "$BODY"
