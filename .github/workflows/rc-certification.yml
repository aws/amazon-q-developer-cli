        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ inputs.execution_mode == 'fork' }}

      - name: Checkout trusted CI support
        if: inputs.execution_mode == 'fork'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .trusted-ci
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/codeartifact-login
            .github/scripts/rc-binary-cache.ts
            .github/scripts/rc-binary-cache/
            crates/asset-embedding-env.txt
            scripts/const.py

      - name: Read pinned Bun version
        id: bun-ver
        shell: bash
        run: |
          version="$(sed -n 's/^BUN_VERSION = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' "$RC_CI_ROOT/scripts/const.py" | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No pinned Bun version in $RC_CI_ROOT/scripts/const.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - name: Login to CodeArtifact
        if: inputs.execution_mode != 'fork'
        uses: ./.github/actions/codeartifact-login

      - name: Login to CodeArtifact
        if: inputs.execution_mode == 'fork'
        uses: ./.trusted-ci/.github/actions/codeartifact-login

      - name: Install dependencies
        run: bun install

      - name: Download reusable bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-bundle-linux
          path: .

      - name: Verify reusable binary
        shell: bash
        run: |
          bun "$RC_CI_ROOT/.github/scripts/rc-binary-cache.ts" verify-bundle \
            --binary-path target/release/chat_cli \
            --manifest-path target/release/chat_cli.rc-binary-manifest.json

      - name: Build Twinki workspace dependency
        # Coverage instruments TUI *source*, so the wrapper imports
        # `../index.tsx` and needs the twinki workspace package's build output
        # (the downloaded bundle already has it inlined). Consequence worth
        # knowing: under coverage this lane executes source, not the shipped
        # bundle, so KIRO_TEST_TUI_JS_PATH below is set but unread here. The
        # bundle stays certified by the ui-integration, e2e, smoke and
        # scenario-categories lanes.
        run: bun run build
        working-directory: packages/twinki/packages/twinki

      - name: Run krs-mock lane
        shell: bash
        env:
          KIRO_TEST_TUI_JS_PATH: ${{ github.workspace }}/packages/tui/dist/tui.js
          KIRO_CHAT_CLI_BIN: ${{ github.workspace }}/target/release/chat_cli
          MOCK_KRS_BIN: ${{ github.workspace }}/target/release/mock-krs-server
          SCENARIO_RUNNER_RETRIES: ${{ needs.resolve.outputs.scenario_runner_retries }}
          # Instrument the TUI through the real Rust->bun launch. Per-scenario
          # lcov lands under this base dir; the drift step merges it.
          KIRO_COVERAGE: '1'
          KIRO_SCENARIO_COVERAGE_DIR: ${{ github.workspace }}/verification-results/scenario-coverage
        run: |
          # The bundle rides across jobs as an artifact, which does not restore
          # file modes. chat_cli gets its execute bit back from verify-bundle;
          # the fake KRS server has no manifest to hang that on, so do it here.
          chmod +x "$MOCK_KRS_BIN"
          mkdir -p verification-results/krs-mock
          bun packages/tui/e2e_tests/smoke/run-smoke.ts \
            --backend krs-mock \
            --format tap \
            --retries "$SCENARIO_RUNNER_RETRIES" \
            --capture-frames \
            --output-dir verification-results/krs-mock

      - name: Check scenario coverage drift
        # Only judges a lane run that actually happened: with `always()` this
        # step would also fire after a failed lane, where the coverage dir is
        # empty for the obvious reason, and "no lcov" would bury the real error.
        #
        # Both outcomes are advisory — coverage reporting does not gate merge —
        # but they are not equally quiet. Drift below the floor is a warning.
        # Producing no lcov at all is how this lane silently stops measuring
        # anything, so that surfaces as an error annotation on a green run.
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          FLOOR=packages/tui/e2e_tests/smoke/scenarios.coverage.json
          ARGS=(check --coverage-dir "${{ github.workspace }}/verification-results/scenario-coverage")
          if [ -f "$FLOOR" ]; then
            ARGS+=(--floor "$FLOOR")
          fi
          set +e
          bun packages/tui/e2e_tests/smoke/scenario-coverage.ts "${ARGS[@]}"
          status=$?
          set -e
          case "$status" in
            0) ;;
            1) echo "::warning::scenario coverage fell below the committed floor" ;;
            *) echo "::error::scenario coverage check failed (exit $status) — see the log above; if no lcov was produced the lane measured nothing"
               exit "$status" ;;
          esac

      - name: Upload krs-mock artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-smoke-krs-mock
          path: |
