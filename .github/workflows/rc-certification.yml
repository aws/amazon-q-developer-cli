name: RC Certification

on:
  pull_request:
  schedule:
    - cron: '0 2 * * *'
  workflow_call:
    inputs:
      execution_mode:
        description: Trusted invocation mode
        type: string
        default: internal
      source_repository:
        description: Repository containing the source under test
        type: string
        default: ''
      source_sha:
        description: Immutable source commit under test
        type: string
        default: ''
      trusted_sha:
        description: Base-repository commit providing trusted CI support
        type: string
        default: ''
      pr_number:
        description: Pull request number used for concurrency
        type: number
        default: 0
  workflow_dispatch:
    inputs:
      run_smoke:
        description: Run the broad smoke lane
        type: boolean
        default: true
      run_scenarios:
        description: Run scenario categories in parallel
        type: boolean
        default: false
      run_visual:
        description: Run the Visual Stories capture lane
        type: boolean
        default: true
      run_integration:
        description: Run UI and ACP integration tests
        type: boolean
        default: true
      run_e2e:
        description: Run end-to-end tests
        type: boolean
        default: true
      live_engine:
        description: Optional live smoke engine lane
        type: choice
        default: none
        options:
          - none
          - v2
          - kas
          - both
      smoke_priority:
        description: Smoke priority filter
        type: choice
        default: all
        options:
          - p0
          - all
      scenario_category:
        description: Optional single scenario category shard
        type: string
        default: ''
      scenario_tag:
        description: Optional scenario tag filter for manual scenario runs
        type: string
        default: ''
      visual_suite:
        description: Visual Stories suite
        type: string
        default: storybook-catalog
      scenario_runner_retries:
        description: Retries inside the scenario runner for failed scenarios
        type: choice
        default: '1'
        options:
          - '0'
          - '1'
          - '2'
      lane_attempts:
        description: Full lane attempts for flaky workflow steps
        type: choice
        default: '3'
        options:
          - '1'
          - '2'
          - '3'
      lane_retry_delay_seconds:
        description: Delay between full lane retry attempts
        type: choice
        default: '15'
        options:
          - '5'
          - '15'
          - '30'

concurrency:
  group: rc-certification-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: '1'
  TERM: xterm-256color
  COLORTERM: truecolor
  FORCE_COLOR: '3'
  RC_CI_ROOT: ${{ inputs.execution_mode == 'fork' && format('{0}/.trusted-ci', github.workspace) || github.workspace }}

jobs:
  resolve:
    name: Resolve Verification Matrix
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      run_smoke: ${{ steps.resolve.outputs.run_smoke }}
      run_scenarios: ${{ steps.resolve.outputs.run_scenarios }}
      run_visual: ${{ steps.resolve.outputs.run_visual }}
      run_integration: ${{ steps.resolve.outputs.run_integration }}
      run_e2e: ${{ steps.resolve.outputs.run_e2e }}
      run_tui_static: ${{ steps.resolve.outputs.run_tui_static }}
      run_twinki_perf: ${{ steps.resolve.outputs.run_twinki_perf }}
      live_engines: ${{ steps.resolve.outputs.live_engines }}
      smoke_priority: ${{ steps.resolve.outputs.smoke_priority }}
      visual_suite: ${{ steps.resolve.outputs.visual_suite }}
      scenario_categories: ${{ steps.resolve.outputs.scenario_categories }}
      scenario_tag: ${{ steps.resolve.outputs.scenario_tag }}
      scenario_runner_retries: ${{ steps.resolve.outputs.scenario_runner_retries }}
      lane_attempts: ${{ steps.resolve.outputs.lane_attempts }}
      lane_retry_delay_seconds: ${{ steps.resolve.outputs.lane_retry_delay_seconds }}
    steps:
      - name: Validate invocation
        shell: bash
        env:
          EXECUTION_MODE: ${{ inputs.execution_mode || 'internal' }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRUSTED_SHA: ${{ inputs.trusted_sha }}
          TRUSTED_BASE_SHA: ${{ github.sha }}
        run: |
          case "$EXECUTION_MODE" in
            internal)
              ;;
            fork)
              if [[ ! "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
                echo "Invalid fork source repository: $SOURCE_REPOSITORY" >&2
                exit 1
              fi
              if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || ! "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Fork execution requires immutable source and trusted commit SHAs." >&2
                exit 1
              fi
              if [[ "$TRUSTED_SHA" != "$TRUSTED_BASE_SHA" ]]; then
                echo "Trusted CI support must come from the calling base commit $TRUSTED_BASE_SHA, not $TRUSTED_SHA." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported execution mode: $EXECUTION_MODE" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ inputs.execution_mode == 'fork' }}

      - name: Checkout trusted CI support
        if: inputs.execution_mode == 'fork'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .trusted-ci
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/codeartifact-login
            .github/scripts/rc-binary-cache.test.ts
            .github/scripts/rc-binary-cache.ts
            .github/scripts/rc-binary-cache/
            crates/asset-embedding-env.txt
            .github/scripts/run-with-retry.test.ts
            .github/scripts/run-with-retry.sh
            .github/workflows/fork-ci.yml
            .github/workflows/rc-certification.yml
            scripts/const.py

      - name: Detect verification changes
        id: paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          predicate-quantifier: every
          filters: |
            verification:
              - '**'
              - '!docs/**'
              - '!.docs/**'
              - '!.ops/**'
              - '!.kiro/**'
              - '!.changes/**'
              - '!pending_autodocs/**'
              - '!scripts/testing-cert-status/**'
              - '!.github/**/*.md'
              - '!packages/tui/**/*.md'
              - '!packages/tui/docs/**'
              - '!packages/twinki/**/*.md'
              - '!packages/twinki/docs/**'
              - '!crates/*/README.md'
              - '!crates/*/docs/**'
              - '!*.md'

      - name: Detect TUI changes
        id: tui-paths
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          predicate-quantifier: every
          filters: |
            tui:
              - 'packages/tui/**'
              - '!packages/tui/**/*.md'
              - '!packages/tui/docs/**'
            twinki:
              - 'packages/twinki/**'
              - '!packages/twinki/**/*.md'
              - '!packages/twinki/docs/**'
            infrastructure:
              - '{package.json,bun.lock,eslint.config.js,.prettierrc,scripts/const.py,.github/workflows/rc-certification.yml,.github/actions/codeartifact-login/**,.github/scripts/run-with-retry*}'

      - name: Read pinned Bun version
        id: bun-ver
        shell: bash
        run: |
          version="$(sed -n 's/^BUN_VERSION = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' "$RC_CI_ROOT/scripts/const.py" | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No pinned Bun version in $RC_CI_ROOT/scripts/const.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - name: Test verification scripts
        shell: bash
        run: |
          for test_file in \
            "$RC_CI_ROOT/.github/scripts/rc-binary-cache.test.ts" \
            "$RC_CI_ROOT/.github/scripts/run-with-retry.test.ts"
          do
            test_name="$(basename "$test_file" .test.ts)"
            test_log="$RUNNER_TEMP/$test_name-tests.log"
            FORCE_COLOR=0 bun test "$test_file" 2>&1 | tee "$test_log"
            if ! grep -Eq '^[[:space:]]*[1-9][0-9]* pass[[:space:]]*$' "$test_log"; then
              echo "::error::$test_file executed zero passing tests"
              exit 1
            fi
          done

      - id: resolve
        shell: bash
        env:
          EXECUTION_MODE: ${{ inputs.execution_mode || 'internal' }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRUSTED_SHA: ${{ inputs.trusted_sha }}
          SCENARIO_CATEGORY: ${{ inputs.scenario_category }}
          SCENARIO_TAG: ${{ inputs.scenario_tag }}
          VISUAL_SUITE: ${{ inputs.visual_suite }}
          LIVE_ENGINE: ${{ inputs.live_engine }}
          TUI_CHANGED: ${{ steps.tui-paths.outputs.tui }}
          TWINKI_CHANGED: ${{ steps.tui-paths.outputs.twinki }}
          TUI_INFRASTRUCTURE_CHANGED: ${{ steps.tui-paths.outputs.infrastructure }}
        run: |
          if [ "$EXECUTION_MODE" = "fork" ]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            echo "run_scenarios=false" >> "$GITHUB_OUTPUT"
            echo "run_visual=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "run_tui_static=true" >> "$GITHUB_OUTPUT"
            echo "run_twinki_perf=true" >> "$GITHUB_OUTPUT"
            echo 'live_engines=[]' >> "$GITHUB_OUTPUT"
            echo "smoke_priority=all" >> "$GITHUB_OUTPUT"
            echo "visual_suite=storybook-catalog" >> "$GITHUB_OUTPUT"
            echo "scenario_categories=[]" >> "$GITHUB_OUTPUT"
            echo "scenario_tag=" >> "$GITHUB_OUTPUT"
            echo "scenario_runner_retries=1" >> "$GITHUB_OUTPUT"
            echo "lane_attempts=3" >> "$GITHUB_OUTPUT"
            echo "lane_retry_delay_seconds=15" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ github.event.pull_request.head.repo.fork || false }}" = "true" ] || [ "${{ steps.paths.outputs.verification }}" != "true" ]; then
              echo "run_smoke=false" >> "$GITHUB_OUTPUT"
              echo "run_scenarios=false" >> "$GITHUB_OUTPUT"
              echo "run_visual=false" >> "$GITHUB_OUTPUT"
              echo "run_integration=false" >> "$GITHUB_OUTPUT"
              echo "run_e2e=false" >> "$GITHUB_OUTPUT"
              echo "run_tui_static=false" >> "$GITHUB_OUTPUT"
              echo "run_twinki_perf=false" >> "$GITHUB_OUTPUT"
              echo 'live_engines=[]' >> "$GITHUB_OUTPUT"
              echo "smoke_priority=all" >> "$GITHUB_OUTPUT"
              echo "visual_suite=storybook-catalog" >> "$GITHUB_OUTPUT"
              echo "scenario_categories=[]" >> "$GITHUB_OUTPUT"
              echo "scenario_tag=" >> "$GITHUB_OUTPUT"
              echo "scenario_runner_retries=1" >> "$GITHUB_OUTPUT"
              echo "lane_attempts=3" >> "$GITHUB_OUTPUT"
              echo "lane_retry_delay_seconds=15" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            echo "run_scenarios=false" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            if [[ "$TUI_CHANGED" == "true" || "$TWINKI_CHANGED" == "true" || "$TUI_INFRASTRUCTURE_CHANGED" == "true" ]]; then
              echo "run_tui_static=true" >> "$GITHUB_OUTPUT"
              echo "run_visual=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_tui_static=false" >> "$GITHUB_OUTPUT"
              echo "run_visual=false" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$TWINKI_CHANGED" == "true" || "$TUI_INFRASTRUCTURE_CHANGED" == "true" ]]; then
              echo "run_twinki_perf=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_twinki_perf=false" >> "$GITHUB_OUTPUT"
            fi
            echo 'live_engines=[]' >> "$GITHUB_OUTPUT"
            echo "smoke_priority=all" >> "$GITHUB_OUTPUT"
            echo "visual_suite=storybook-catalog" >> "$GITHUB_OUTPUT"
            echo "scenario_categories=[]" >> "$GITHUB_OUTPUT"
            echo "scenario_tag=" >> "$GITHUB_OUTPUT"
            echo "scenario_runner_retries=1" >> "$GITHUB_OUTPUT"
            echo "lane_attempts=3" >> "$GITHUB_OUTPUT"
            echo "lane_retry_delay_seconds=15" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            echo "run_scenarios=false" >> "$GITHUB_OUTPUT"
            echo "run_visual=true" >> "$GITHUB_OUTPUT"
            echo "run_integration=true" >> "$GITHUB_OUTPUT"
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "run_tui_static=true" >> "$GITHUB_OUTPUT"
            echo "run_twinki_perf=true" >> "$GITHUB_OUTPUT"
            echo 'live_engines=["v2","kas"]' >> "$GITHUB_OUTPUT"
            echo "smoke_priority=all" >> "$GITHUB_OUTPUT"
            echo "visual_suite=storybook-catalog" >> "$GITHUB_OUTPUT"
            echo "scenario_categories=[]" >> "$GITHUB_OUTPUT"
            echo "scenario_tag=" >> "$GITHUB_OUTPUT"
            echo "scenario_runner_retries=1" >> "$GITHUB_OUTPUT"
            echo "lane_attempts=3" >> "$GITHUB_OUTPUT"
            echo "lane_retry_delay_seconds=15" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$LIVE_ENGINE" in
            none)
              LIVE_ENGINES='[]'
              ;;
            v2)
              LIVE_ENGINES='["v2"]'
              ;;
            kas)
              LIVE_ENGINES='["kas"]'
              ;;
            both)
              LIVE_ENGINES='["v2","kas"]'
              ;;
            *)
              echo "Unsupported live_engine input: $LIVE_ENGINE" >&2
              exit 1
              ;;
          esac

          if [ "${{ inputs.run_smoke }}" != "true" ] && [ "${{ inputs.run_scenarios }}" != "true" ] && [ "${{ inputs.run_visual }}" != "true" ] && [ "${{ inputs.run_integration }}" != "true" ] && [ "${{ inputs.run_e2e }}" != "true" ] && [ "$LIVE_ENGINES" = '[]' ]; then
            echo "Select at least one verification lane or live engine to run." >&2
            exit 1
          fi

          echo "live_engines=$LIVE_ENGINES" >> "$GITHUB_OUTPUT"
          ARGS=(--backend acp-mock --engine kas)
          if [ -n "$SCENARIO_CATEGORY" ]; then
            ARGS+=(--category "$SCENARIO_CATEGORY")
          fi
          if [ -n "$SCENARIO_TAG" ]; then
            ARGS+=(--tag "$SCENARIO_TAG")
          fi
          SCENARIO_CATEGORIES="$(bun packages/tui/e2e_tests/verification/list-scenario-categories.ts "${ARGS[@]}")"

          echo "run_smoke=${{ inputs.run_smoke }}" >> "$GITHUB_OUTPUT"
          echo "run_scenarios=${{ inputs.run_scenarios }}" >> "$GITHUB_OUTPUT"
          echo "run_visual=${{ inputs.run_visual }}" >> "$GITHUB_OUTPUT"
          echo "run_integration=${{ inputs.run_integration }}" >> "$GITHUB_OUTPUT"
          echo "run_e2e=${{ inputs.run_e2e }}" >> "$GITHUB_OUTPUT"
          echo "run_tui_static=true" >> "$GITHUB_OUTPUT"
          echo "run_twinki_perf=true" >> "$GITHUB_OUTPUT"
          echo "smoke_priority=${{ inputs.smoke_priority }}" >> "$GITHUB_OUTPUT"
          echo "visual_suite=$VISUAL_SUITE" >> "$GITHUB_OUTPUT"
          echo "scenario_categories=$SCENARIO_CATEGORIES" >> "$GITHUB_OUTPUT"
          echo "scenario_tag=$SCENARIO_TAG" >> "$GITHUB_OUTPUT"
          echo "scenario_runner_retries=${{ inputs.scenario_runner_retries }}" >> "$GITHUB_OUTPUT"
          echo "lane_attempts=${{ inputs.lane_attempts }}" >> "$GITHUB_OUTPUT"
          echo "lane_retry_delay_seconds=${{ inputs.lane_retry_delay_seconds }}" >> "$GITHUB_OUTPUT"

  tui-static:
    name: TUI Static (${{ matrix.check }})
    permissions:
      contents: read
      id-token: write
    needs: resolve
    if: needs.resolve.outputs.run_tui_static == 'true'
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Bun's large colored coverage report can fail while writing to piped CI output.
      FORCE_COLOR: '0'
      KIRO_TUI_FORCE_COLOR: '3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ inputs.execution_mode == 'fork' }}

      - name: Checkout trusted CI support
        if: inputs.execution_mode == 'fork'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .trusted-ci
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/codeartifact-login
            .github/scripts/run-with-retry.sh
            scripts/const.py
            scripts/code-quality

      - name: Read pinned Bun version
        id: bun-ver
        shell: bash
        run: |
          version="$(sed -n 's/^BUN_VERSION = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' "$RC_CI_ROOT/scripts/const.py" | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No pinned Bun version in $RC_CI_ROOT/scripts/const.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - name: Login to CodeArtifact
        if: inputs.execution_mode != 'fork'
        uses: ./.github/actions/codeartifact-login

      - name: Login to CodeArtifact
        if: inputs.execution_mode == 'fork'
        uses: ./.trusted-ci/.github/actions/codeartifact-login

      - name: Install dependencies
        run: bun install

      - name: Build Twinki workspace dependency
        run: bun run build
        working-directory: packages/twinki/packages/twinki

      - name: Run typecheck or lint
        if: matrix.check != 'test'
        shell: bash
        env:
          LANE_ATTEMPTS: ${{ needs.resolve.outputs.lane_attempts }}
          LANE_RETRY_DELAY_SECONDS: ${{ needs.resolve.outputs.lane_retry_delay_seconds }}
        run: |
          bash "$RC_CI_ROOT/.github/scripts/run-with-retry.sh" \
            --attempts "$LANE_ATTEMPTS" \
            --delay-seconds "$LANE_RETRY_DELAY_SECONDS" \
            --label "TUI ${{ matrix.check }}" \
            --status-file "$GITHUB_WORKSPACE/verification-results/retries/tui-${{ matrix.check }}-linux.txt" \
            -- bun run "${{ matrix.check }}"
        working-directory: packages/tui

      - name: Run TUI unit tests
        if: matrix.check == 'test'
        shell: bash
        env:
          LANE_ATTEMPTS: ${{ needs.resolve.outputs.lane_attempts }}
          LANE_RETRY_DELAY_SECONDS: ${{ needs.resolve.outputs.lane_retry_delay_seconds }}
          UNIT_TEST_COMMAND: |
            set -euo pipefail
            bun test
            npx vitest run --config vitest.config.ts --coverage --coverage.reportsDirectory=coverage/vitest
        run: |
          bash "$RC_CI_ROOT/.github/scripts/run-with-retry.sh" \
            --attempts "$LANE_ATTEMPTS" \
            --delay-seconds "$LANE_RETRY_DELAY_SECONDS" \
            --label "TUI unit tests" \
            --status-file "$GITHUB_WORKSPACE/verification-results/retries/tui-unit-linux.txt" \
            -- bash -c "$UNIT_TEST_COMMAND"
        working-directory: packages/tui

      - name: Run twinki tests
        if: matrix.check == 'test'
        shell: bash
        env:
          LANE_ATTEMPTS: ${{ needs.resolve.outputs.lane_attempts }}
          LANE_RETRY_DELAY_SECONDS: ${{ needs.resolve.outputs.lane_retry_delay_seconds }}
        run: |
          bash "$RC_CI_ROOT/.github/scripts/run-with-retry.sh" \
            --attempts "$LANE_ATTEMPTS" \
            --delay-seconds "$LANE_RETRY_DELAY_SECONDS" \
            --label "Twinki unit tests" \
            --status-file "$GITHUB_WORKSPACE/verification-results/retries/tui-twinki-linux.txt" \
            -- bun run test:run
        working-directory: packages/twinki

      - name: Enforce coverage floors
        # Internal pull_request runs already carry this floor on a required check;
        # fork mode, the nightly schedule and manual dispatches are gated here.
        if: matrix.check == 'test' && (inputs.execution_mode == 'fork' || github.event_name != 'pull_request')
        shell: bash
        run: |
          # The checker comes from the trusted ref: under fork mode the working tree
          # is the contributor's, so its own copy could be edited to pass its floors.
          # The floors file stays the tree's, gated by the baseline-direction ratchet.
          python3 "$RC_CI_ROOT/scripts/code-quality/check-coverage.py" \
            --floors .coverage-floors.json \
            --coverage-config packages/tui/coverage-config.json \
            --package packages/tui \
                --lcov packages/tui/coverage/lcov.info:bun \
                --lcov packages/tui/coverage/vitest/lcov.info:tuiVitest \
            --package packages/twinki \
                --lcov packages/twinki/coverage/lcov.info:twinkiVitest \
            --report-out "$RUNNER_TEMP/coverage-floor-report.md"

      - name: Upload TUI static retry status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-retry-tui-${{ matrix.check }}-linux
          path: verification-results/retries/
          retention-days: 7
          if-no-files-found: warn

  twinki-perf:
    name: Twinki Perf Suite (non-blocking)
    permissions:
      contents: read
      id-token: write
    needs: resolve
    if: needs.resolve.outputs.run_twinki_perf == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ inputs.execution_mode == 'fork' }}

      - name: Checkout trusted CI support
        if: inputs.execution_mode == 'fork'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .trusted-ci
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/codeartifact-login
            .github/scripts/run-with-retry.sh
            scripts/const.py

      - name: Read pinned Bun version
        id: bun-ver
        shell: bash
        run: |
          version="$(sed -n 's/^BUN_VERSION = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' "$RC_CI_ROOT/scripts/const.py" | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No pinned Bun version in $RC_CI_ROOT/scripts/const.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - name: Login to CodeArtifact
        if: inputs.execution_mode != 'fork'
        uses: ./.github/actions/codeartifact-login

      - name: Login to CodeArtifact
        if: inputs.execution_mode == 'fork'
        uses: ./.trusted-ci/.github/actions/codeartifact-login

      - name: Install dependencies
        run: bun install

      - name: Build Twinki workspace dependency
        run: bun run build
        working-directory: packages/twinki/packages/twinki

      - name: Run twinki perf suite
        id: perf
        shell: bash
        env:
          LANE_ATTEMPTS: ${{ needs.resolve.outputs.lane_attempts }}
          LANE_RETRY_DELAY_SECONDS: ${{ needs.resolve.outputs.lane_retry_delay_seconds }}
        run: |
          bash "$RC_CI_ROOT/.github/scripts/run-with-retry.sh" \
            --attempts "$LANE_ATTEMPTS" \
            --delay-seconds "$LANE_RETRY_DELAY_SECONDS" \
            --label "Twinki perf suite" \
            --status-file "$GITHUB_WORKSPACE/verification-results/retries/twinki-perf-linux.txt" \
            -- bun run test:perf
        working-directory: packages/twinki

      - name: Summarize perf measurements
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=(test/.artifacts/*/*/report.txt)
          outcome='${{ steps.perf.outcome }}'
          case "$outcome" in
            success) verdict='All perf assertions passed.' ;;
            failure) verdict='**A perf assertion failed**; this lane is non-blocking.' ;;
            *) verdict="Perf suite outcome: \`$outcome\`." ;;
          esac
          {
            echo "## Twinki perf measurements"
            echo
            echo "$verdict"
            echo
            echo "${#reports[@]} report(s) produced."
            for report in "${reports[@]}"; do
              echo
              echo "<details><summary>${report#test/.artifacts/}</summary>"
              echo
              echo '```'
              cat "$report"
              echo '```'
              echo
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: packages/twinki/packages/twinki

      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: twinki-perf-reports
          path: packages/twinki/packages/twinki/test/.artifacts/
          include-hidden-files: true
          retention-days: 7

      - name: Upload twinki perf retry status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-retry-twinki-perf-linux
          path: verification-results/retries/twinki-perf-linux.txt
          retention-days: 7
          if-no-files-found: warn

  build-assets:
    name: Build Verification Assets (${{ matrix.os }})
    permissions:
      contents: read
      id-token: write
    needs: resolve
    if: needs.resolve.outputs.run_smoke == 'true' || needs.resolve.outputs.run_scenarios == 'true' || needs.resolve.outputs.run_integration == 'true' || needs.resolve.outputs.run_e2e == 'true' || needs.resolve.outputs.live_engines != '[]'
    env:
      RC_SCCACHE_VERSION: v0.16.0
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest-8-cores,
            macos-latest-xlarge,
            windows-x64-latest-16-cores,
          ]
        include:
          - os: ubuntu-latest-8-cores
            artifact_suffix: linux
          - os: macos-latest-xlarge
            artifact_suffix: macos
          - os: windows-x64-latest-16-cores
            artifact_suffix: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ inputs.execution_mode == 'fork' }}

      - name: Checkout trusted CI support
        if: inputs.execution_mode == 'fork'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .trusted-ci
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/codeartifact-login
            .github/scripts/rc-binary-cache.ts
            .github/scripts/rc-binary-cache/
            crates/asset-embedding-env.txt
            scripts/const.py

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Read pinned Bun version
        id: bun-ver
        shell: bash
        run: |
          version="$(sed -n 's/^BUN_VERSION = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' "$RC_CI_ROOT/scripts/const.py" | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No pinned Bun version in $RC_CI_ROOT/scripts/const.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - name: Set Rust compiler wrapper
        if: inputs.execution_mode != 'fork'
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"

      - name: Configure sccache
        if: inputs.execution_mode != 'fork'
        id: sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: ${{ env.RC_SCCACHE_VERSION }}

      - name: Compute Rust binary identity
        id: binary-id
        shell: bash
        run: |
          bun "$RC_CI_ROOT/.github/scripts/rc-binary-cache.ts" prepare \
            --runner-label "${{ matrix.os }}" \
            --identity-path "$RUNNER_TEMP/rc-binary-identity.json" \
            --cache-directory "$RUNNER_TEMP/rc-binary-cache"

      - name: Restore exact Rust binary cache
        id: binary-cache
        if: steps.binary-id.outputs.cache-enabled == 'true'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.binary-id.outputs.cache-directory }}
          key: ${{ steps.binary-id.outputs.cache-key }}
          enableCrossOsArchive: false

      - name: Validate restored Rust binary
        id: binary-restore
        shell: bash
        run: |
          bun "$RC_CI_ROOT/.github/scripts/rc-binary-cache.ts" restore \
            --enabled "${{ steps.binary-id.outputs.cache-enabled }}" \
            --outcome "${{ steps.binary-cache.outcome || 'skipped' }}" \
            --cache-hit "${{ steps.binary-cache.outputs.cache-hit }}" \
            --identity-path "${{ steps.binary-id.outputs.identity-path }}" \
            --cache-directory "${{ steps.binary-id.outputs.cache-directory }}" \
            --destination-path "${{ steps.binary-id.outputs.binary-path }}" \
            --bundle-manifest-path "${{ steps.binary-id.outputs.binary-path }}.rc-binary-manifest.json"

      - name: Restore cargo registry
        if: inputs.execution_mode == 'fork' && steps.binary-restore.outputs.rebuild == 'true'
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-rc-certification-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-rc-certification-${{ runner.os }}-

      - name: Cache cargo registry
        if: inputs.execution_mode != 'fork' && steps.binary-restore.outputs.rebuild == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-rc-certification-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-rc-certification-${{ runner.os }}-

      - name: Execute recorded chat_cli build plan
        if: steps.binary-restore.outputs.rebuild == 'true'
        shell: bash
        run: bun "$RC_CI_ROOT/.github/scripts/rc-binary-cache.ts" build --identity-path "${{ steps.binary-id.outputs.identity-path }}"

      - name: Show sccache statistics
        if: always() && steps.binary-restore.outputs.rebuild == 'true' && steps.sccache.outcome == 'success'
        run: sccache --show-stats

      - name: Stage Rust binary cache
        id: binary-stage
        if: steps.binary-restore.outputs.rebuild == 'true'
        shell: bash
        run: |
          bun "$RC_CI_ROOT/.github/scripts/rc-binary-cache.ts" stage \
            --identity-path "${{ steps.binary-id.outputs.identity-path }}" \
            --binary-path "${{ steps.binary-id.outputs.binary-path }}" \
            --cache-directory "${{ steps.binary-id.outputs.cache-directory }}" \
            --bundle-manifest-path "${{ steps.binary-id.outputs.binary-path }}.rc-binary-manifest.json"

      - name: Probe selected Rust binary
        shell: bash
        run: |
          "${{ steps.binary-id.outputs.binary-path }}" --version
          bun "$RC_CI_ROOT/.github/scripts/rc-binary-cache.ts" verify-bundle \
            --binary-path "${{ steps.binary-id.outputs.binary-path }}" \
            --manifest-path "${{ steps.binary-id.outputs.binary-path }}.rc-binary-manifest.json"

      - name: Save exact Rust binary cache
        if: inputs.execution_mode != 'fork' && steps.binary-restore.outputs.rebuild == 'true' && steps.binary-id.outputs.cache-enabled == 'true'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.binary-id.outputs.cache-directory }}
          key: ${{ steps.binary-id.outputs.cache-key }}
          enableCrossOsArchive: false

      - name: Login to CodeArtifact
        if: inputs.execution_mode != 'fork'
        uses: ./.github/actions/codeartifact-login

      - name: Login to CodeArtifact
        if: inputs.execution_mode == 'fork'
        uses: ./.trusted-ci/.github/actions/codeartifact-login

      - name: Install dependencies
        run: bun install

      - name: Build fake KRS server
        # Only the Linux bundle feeds the krs-mock lane, and this crate is not
        # covered by any Windows Rust build.
        if: runner.os == 'Linux'
        run: cargo build -p mock-krs-server --release

      - name: Build Twinki workspace dependency
        run: bun run build
        working-directory: packages/twinki/packages/twinki

      - name: Build TUI bundle
        run: bun run build
        working-directory: packages/tui

      - name: Upload reusable bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-bundle-${{ matrix.artifact_suffix }}
          path: |
            ${{ steps.binary-id.outputs.binary-path }}
            ${{ steps.binary-id.outputs.binary-path }}.rc-binary-manifest.json
            target/release/mock-krs-server
            packages/tui/dist/tui.js
            packages/twinki/packages/twinki/dist/
          retention-days: 7

