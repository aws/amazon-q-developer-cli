      - name: Checkout trusted CI support
        if: inputs.execution_mode == 'fork'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .trusted-ci
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/codeartifact-login
            .github/scripts/rc-binary-cache.ts
            .github/scripts/rc-binary-cache/
            .github/scripts/run-with-retry.sh
            crates/asset-embedding-env.txt
            scripts/const.py

      - name: Read pinned Bun version
        id: bun-ver
        shell: bash
        run: |
          version="$(sed -n 's/^BUN_VERSION = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' "$RC_CI_ROOT/scripts/const.py" | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No pinned Bun version in $RC_CI_ROOT/scripts/const.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - name: Login to CodeArtifact
        if: inputs.execution_mode != 'fork'
        uses: ./.github/actions/codeartifact-login

      - name: Login to CodeArtifact
        if: inputs.execution_mode == 'fork'
        uses: ./.trusted-ci/.github/actions/codeartifact-login

      - name: Install dependencies
        run: bun install

      - name: Download reusable bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-bundle-linux
          path: .

      - name: Verify reusable binary
        run: |
          bun "$RC_CI_ROOT/.github/scripts/rc-binary-cache.ts" verify-bundle \
            --binary-path target/release/chat_cli \
            --manifest-path target/release/chat_cli.rc-binary-manifest.json

      - name: Run live smoke tests
        shell: bash
        env:
          KIRO_TEST_TUI_JS_PATH: ${{ github.workspace }}/packages/tui/dist/tui.js
          KIRO_CHAT_CLI_BIN: ${{ github.workspace }}/target/release/chat_cli
          KIRO_API_KEY: ${{ secrets.KIRO_REVIEW_PAT }}
        run: |
          ARGS=(--backend live --engine "${{ matrix.engine }}" --tag smoke --format tap --output-dir verification-results/live/${{ matrix.engine }})
          bash "$RC_CI_ROOT/.github/scripts/run-with-retry.sh" \
            --attempts 1 \
            --delay-seconds 0 \
            --label "live smoke:${{ matrix.engine }}" \
            -- bun packages/tui/e2e_tests/smoke/run-smoke.ts "${ARGS[@]}"

      - name: Upload live smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-live-${{ matrix.engine }}
          path: verification-results/live/${{ matrix.engine }}/
          retention-days: 7
          if-no-files-found: warn

  summary:
    name: Publish Verification Summary
    permissions:
      contents: read
    needs:
      [
        resolve,
        tui-static,
        twinki-perf,
        build-assets,
        ui-integration,
        acp-integration,
        e2e,
        smoke,
        smoke-krs-mock,
        scenario-categories,
        visual,
        live-parity,
      ]
    if: |
      always() && (
        needs.resolve.result == 'failure' ||
        needs.tui-static.result != 'skipped' ||
        needs.twinki-perf.result != 'skipped' ||
        needs.build-assets.result == 'failure' ||
        needs.ui-integration.result != 'skipped' ||
        needs.acp-integration.result != 'skipped' ||
        needs.e2e.result != 'skipped' ||
        needs.smoke.result != 'skipped' ||
        needs.smoke-krs-mock.result != 'skipped' ||
        needs.scenario-categories.result != 'skipped' ||
        needs.visual.result != 'skipped' ||
        needs.live-parity.result != 'skipped'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Validate invocation
        shell: bash
        env:
          EXECUTION_MODE: ${{ inputs.execution_mode || 'internal' }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TRUSTED_SHA: ${{ inputs.trusted_sha }}
          TRUSTED_BASE_SHA: ${{ github.sha }}
        run: |
          case "$EXECUTION_MODE" in
            internal)
              ;;
            fork)
              if [[ ! "$SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
                echo "Invalid fork source repository: $SOURCE_REPOSITORY" >&2
                exit 1
              fi
              if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || ! "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Fork execution requires immutable source and trusted commit SHAs." >&2
                exit 1
              fi
              if [[ "$TRUSTED_SHA" != "$TRUSTED_BASE_SHA" ]]; then
                echo "Trusted CI support must come from the calling base commit $TRUSTED_BASE_SHA, not $TRUSTED_SHA." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported execution mode: $EXECUTION_MODE" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: ${{ inputs.execution_mode == 'fork' }}

      - name: Checkout trusted CI support
        if: inputs.execution_mode == 'fork'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .trusted-ci
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/const.py

      - name: Read pinned Bun version
        id: bun-ver
        shell: bash
        run: |
          version="$(sed -n 's/^BUN_VERSION = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' "$RC_CI_ROOT/scripts/const.py" | head -n 1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::No pinned Bun version in $RC_CI_ROOT/scripts/const.py"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - name: Download smoke artifacts
        if: needs.smoke.result != 'skipped'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-smoke-*
          path: verification-artifacts

      - name: Download scenario artifacts
        if: needs.scenario-categories.result != 'skipped'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-scenarios-*
          path: verification-artifacts

      - name: Download visual artifacts
        if: needs.visual.result != 'skipped'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-visual-*
          path: verification-artifacts

      - name: Download live smoke artifacts
        if: needs.live-parity.result != 'skipped'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-live-*
          path: verification-artifacts

      - name: Download ACP capability coverage
        if: needs.acp-integration.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-acp-integration-linux
          path: verification-artifacts/acp-integration

      - name: Download test retry status
        if: |
          needs.tui-static.result != 'skipped' ||
          needs.twinki-perf.result != 'skipped' ||
          needs.ui-integration.result != 'skipped' ||
          needs.acp-integration.result != 'skipped' ||
          needs.e2e.result != 'skipped'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-retry-*
          path: verification-artifacts/retries
          merge-multiple: true

      - name: Build summary bundle
        run: bun packages/tui/e2e_tests/verification/build-verification-report.ts --root verification-artifacts --out-dir verification-artifacts/summary

      - name: Append test lane results
        shell: bash
        run: |
          retry_status() {
            local prefix="$1"
            local files=(verification-artifacts/retries/"$prefix"-*.txt)
            if [[ ! -e "${files[0]}" ]]; then
              printf 'not recorded'
              return
            fi

            local joined=''
            for file in "${files[@]}"; do
              local platform
              platform="$(basename "$file" .txt)"
              platform="${platform#"$prefix"-}"
              if [[ -n "$joined" ]]; then
                joined+='; '
              fi
              joined+="$platform: $(<"$file")"
            done
            printf '%s' "$joined"
          }

          {
            echo
            echo "## Test lanes"
            echo
            echo "| Lane | Result | Attempts |"
            echo "| --- | --- | --- |"
            echo "| TUI typecheck | ${{ needs.tui-static.result }} | $(retry_status tui-typecheck) |"
            echo "| TUI lint | ${{ needs.tui-static.result }} | $(retry_status tui-lint) |"
            echo "| TUI unit | ${{ needs.tui-static.result }} | $(retry_status tui-unit) |"
            echo "| Twinki unit | ${{ needs.tui-static.result }} | $(retry_status tui-twinki) |"
            echo "| Twinki perf | ${{ needs.twinki-perf.result }} | $(retry_status twinki-perf) |"
            echo "| UI integration | ${{ needs.ui-integration.result }} | $(retry_status ui-integration) |"
            echo "| ACP integration | ${{ needs.acp-integration.result }} | $(retry_status acp-integration) |"
            echo "| E2E | ${{ needs.e2e.result }} | $(retry_status e2e) |"
          } >> verification-artifacts/summary/summary.md

          coverage_report="verification-artifacts/acp-integration/coverage/acp-integration.md"
          if [[ -f "$coverage_report" ]]; then
            {
              echo
              cat "$coverage_report"
            } >> verification-artifacts/summary/summary.md
          fi

      - name: Publish workflow summary
        shell: bash
        run: cat verification-artifacts/summary/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload summary bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-summary
          path: verification-artifacts/summary/
          retention-days: 14

      - name: Fail on lane failures
        if: |
          needs.resolve.result == 'failure' ||
          needs.tui-static.result == 'failure' ||
          needs.build-assets.result == 'failure' ||
          needs.ui-integration.result == 'failure' ||
          needs.acp-integration.result == 'failure' ||
          needs.e2e.result == 'failure' ||
          needs.smoke.result == 'failure' ||
          needs.smoke-krs-mock.result == 'failure' ||
          needs.scenario-categories.result == 'failure' ||
          needs.visual.result == 'failure' ||
          needs.live-parity.result == 'failure'
        run: exit 1

  tui-unit-tests-required:
    name: 'TUI: Unit Tests (required)'
    permissions: {}
    if: always()
    needs: [resolve, tui-static]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        shell: bash
        run: |
          if [[ "${{ needs.resolve.result }}" != "success" ]]; then
            echo "::error::RC verification matrix resolution failed"
            exit 1
          fi
          if [[ "${{ needs.resolve.outputs.run_tui_static }}" != "true" ]]; then
            echo "TUI files not changed; static checks are disabled"
            exit 0
          fi
          if [[ "${{ needs.tui-static.result }}" != "success" ]]; then
            echo "::error::TUI static checks failed"
            exit 1
          fi

  tui-typecheck-required:
    name: 'TUI: Typecheck (required)'
    permissions: {}
    if: always()
    needs: [resolve, tui-static]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        shell: bash
        run: |
          if [[ "${{ needs.resolve.result }}" != "success" ]]; then
            echo "::error::RC verification matrix resolution failed"
            exit 1
          fi
          if [[ "${{ needs.resolve.outputs.run_tui_static }}" != "true" ]]; then
            echo "TUI files not changed; static checks are disabled"
            exit 0
          fi
          if [[ "${{ needs.tui-static.result }}" != "success" ]]; then
            echo "::error::TUI static checks failed"
            exit 1
          fi

  tui-lint-required:
    name: 'TUI: Lint (required)'
    permissions: {}
    if: always()
    needs: [resolve, tui-static]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        shell: bash
        run: |
          if [[ "${{ needs.resolve.result }}" != "success" ]]; then
            echo "::error::RC verification matrix resolution failed"
            exit 1
          fi
          if [[ "${{ needs.resolve.outputs.run_tui_static }}" != "true" ]]; then
            echo "TUI files not changed; static checks are disabled"
            exit 0
          fi
          if [[ "${{ needs.tui-static.result }}" != "success" ]]; then
            echo "::error::TUI static checks failed"
            exit 1
          fi

  tui-integ-tests-required:
    name: 'TUI: Integration Tests (required)'
    permissions: {}
    if: always()
    needs: [resolve, ui-integration, acp-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        shell: bash
        run: |
          if [[ "${{ github.event.pull_request.head.repo.fork || false }}" == "true" ]]; then
            echo "Fork PR — integration checks deferred to fork-ci.yml"
            exit 0
          fi
          if [[ "${{ needs.resolve.result }}" != "success" ]]; then
            echo "::error::RC verification matrix resolution failed"
            exit 1
          fi
          if [[ "${{ needs.resolve.outputs.run_integration }}" != "true" ]]; then
            echo "Integration tests are disabled for this run"
            exit 0
          fi
          if [[ "${{ needs.ui-integration.result }}" != "success" || "${{ needs.acp-integration.result }}" != "success" ]]; then
            echo "::error::TUI integration tests failed"
            exit 1
          fi

  tui-e2e-required:
    name: 'TUI: E2E Tests (required)'
    permissions: {}
    if: always()
    needs: [resolve, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        shell: bash
        run: |
          if [[ "${{ github.event.pull_request.head.repo.fork || false }}" == "true" ]]; then
            echo "Fork PR — E2E checks deferred to fork-ci.yml"
            exit 0
          fi
          if [[ "${{ needs.resolve.result }}" != "success" ]]; then
            echo "::error::RC verification matrix resolution failed"
            exit 1
          fi
          if [[ "${{ needs.resolve.outputs.run_e2e }}" != "true" ]]; then
            echo "E2E tests are disabled for this run"
            exit 0
          fi
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "::error::TUI E2E tests failed"
            exit 1
          fi
