name: Publish Changelog

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - gamma
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-changelog-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate feed.json
        run: python3 -c "import json, sys; json.load(open(sys.argv[1]))" crates/chat-cli-v2/src/cli/feed.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload to S3
        run: |
          aws s3 cp crates/chat-cli-v2/src/cli/feed.json \
            s3://${{ secrets.CHANGELOG_BUCKET }}/stable/changelog/feed.json \
            --content-type application/json \
            --cache-control "public, max-age=300"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CHANGELOG_CF_DISTRIBUTION_ID }} \
            --paths "/changelog/feed.json"
