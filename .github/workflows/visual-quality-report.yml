name: Quality Metrics Report

on:
  workflow_run:
    workflows: [RC Certification, Code Quality]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: quality-metrics-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve measured pull request
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    outputs:
      pr-number: ${{ steps.target.outputs.pr-number }}
    steps:
      - name: Resolve measured pull request
        id: target
        shell: bash
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_REPOSITORY_ID: ${{ github.event.repository.id }}
        run: |
          set -euo pipefail
          matches="$(
            jq -c \
              --arg sha "$EXPECTED_HEAD_SHA" \
              --argjson repository_id "$EXPECTED_REPOSITORY_ID" \
              '[.workflow_run.pull_requests[]? | select(.head.sha == $sha and .head.repo.id == $repository_id)]' \
              "$GITHUB_EVENT_PATH"
          )"
          count="$(jq 'length' <<< "$matches")"
          if [[ "$count" != "1" ]]; then
            echo "Expected exactly one same-repository PR for $EXPECTED_HEAD_SHA, found $count" >&2
            exit 1
          fi
          echo "pr-number=$(jq -r '.[0].number' <<< "$matches")" >> "$GITHUB_OUTPUT"

  publish-code-quality:
    name: Publish Code Quality metrics
    needs: resolve
    if: |
      needs.resolve.result == 'success' &&
      github.event.workflow_run.name == 'Code Quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: code-quality-coverage-report
          path: quality-report
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Prepare unavailable report
        if: hashFiles('quality-report/coverage-report.md') == ''
        run: |
          mkdir -p quality-report
          {
            echo "## Code Quality — Coverage Report"
            echo
            echo "Metrics unavailable for this revision. Open the Code Quality check for the operational failure."
          } > quality-report/coverage-report.md

      - name: Publish Code Quality section
        uses: ./.github/actions/publish-quality-report
        with:
          section: code-quality
          content: quality-report/coverage-report.md
          pr-number: ${{ needs.resolve.outputs.pr-number }}
          expected-head-sha: ${{ github.event.workflow_run.head_sha }}
          github-token: ${{ github.token }}

  publish-rc:
    name: Publish RC quality metrics
    needs: resolve
    if: |
      needs.resolve.result == 'success' &&
      github.event.workflow_run.name == 'RC Certification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download head visual metrics
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: verification-visual-linux-*
          path: visual-metrics/head
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download base visual metrics
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: comparison-visual-base-*
          path: visual-metrics/base
          merge-multiple: true
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download ACP capability metrics
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verification-acp-integration-linux
          path: acp-metrics
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Build ACP Integration section
        env:
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 scripts/code-quality/pr-report.py acp \
            --report acp-metrics/coverage/acp-integration.json \
            --run-result "$RUN_RESULT" \
            --run-url "$RUN_URL" \
            --out "$RUNNER_TEMP/acp-integration-report.md"

      - name: Build Visual Stories section
        env:
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 scripts/code-quality/pr-report.py visual \
            --head visual-metrics/head/coverage.json \
            --base visual-metrics/base/coverage.json \
            --run-result "$RUN_RESULT" \
            --run-url "$RUN_URL" \
            --out "$RUNNER_TEMP/visual-stories-report.md"

      - name: Publish ACP Integration section
        uses: ./.github/actions/publish-quality-report
        with:
          section: acp-integration
          content: ${{ runner.temp }}/acp-integration-report.md
          pr-number: ${{ needs.resolve.outputs.pr-number }}
          expected-head-sha: ${{ github.event.workflow_run.head_sha }}
          github-token: ${{ github.token }}

      - name: Publish Visual Stories section
        uses: ./.github/actions/publish-quality-report
        with:
          section: visual-stories
          content: ${{ runner.temp }}/visual-stories-report.md
          pr-number: ${{ needs.resolve.outputs.pr-number }}
          expected-head-sha: ${{ github.event.workflow_run.head_sha }}
          github-token: ${{ github.token }}
