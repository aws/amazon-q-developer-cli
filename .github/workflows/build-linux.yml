name: 1.1 Build Linux

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      build_timestamp:
        type: string
        required: true
      version:
        type: string
        required: true
      release_type:
        type: string
        required: true
      environment:
        type: string
        required: true
      branch_name:
        type: string
        required: true
      commit_sha:
        type: string
        required: true

env:
  AWS_REGION: "us-east-1"
  STAGE_NAME: ${{ inputs.environment }}
  CI: 1
  # Avoid GitHub API rate limits (403) during postinstall scripts
  # that download from GitHub Releases (e.g. @vscode/ripgrep).
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  id-token: write
  contents: read

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }}, ${{ inputs.environment }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest-8-cores
            container: ubuntu:22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest-8-cores
            musl: "1"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest-8-cores
            cross_target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest-8-cores
            musl: "1"
            cross_target: aarch64-unknown-linux-musl
    steps:
      - name: Prepare container (install basics)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git build-essential pkg-config \
            libssl-dev unzip xz-utils sudo gnupg zip
          # Install Node.js 20 from NodeSource (22.04's default nodejs is too old for modern deps like node-pty)
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          npm install -g node-gyp
          # Install AWS CLI v2
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          cd /tmp && unzip -q awscliv2.zip && ./aws/install && cd - && rm -rf /tmp/aws /tmp/awscliv2.zip

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Configure environment from secrets
        run: |
          {
            echo "AWS_GITHUB_ACTIONS_ROLE_ARN=${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}"
            echo "BUILD_OUTPUT_BUCKET=${{ secrets.BUILD_OUTPUT_BUCKET }}"
          } >> "$GITHUB_ENV"

      - name: Install Python (in container)
        if: matrix.container
        run: |
          apt-get install -y --no-install-recommends python3 python3-pip python3-venv

      - name: Setup Python
        if: '!matrix.container'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Install system dependencies
        if: "!matrix.musl && !matrix.cross_target"
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libssl-dev pkg-config cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clear partial toolchain state
        shell: bash
        run: |
          TC=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          rustup toolchain uninstall "$TC" 2>/dev/null || true

      - name: Read pinned Bun version
        id: bun-version
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Free Disk Space
        if: '!matrix.container'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Cache cargo registry (native builds)
        if: inputs.branch_name != 'prod' && !matrix.musl && !matrix.cross_target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-registry-

      - name: Install cross (for cross-compilation)
        if: matrix.musl || matrix.cross_target
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.4 --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - uses: ./.github/actions/codeartifact-login
        with:
          restore-role-arn: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          restore-region: ${{ env.AWS_REGION }}

      - name: Set workspace version for packaging
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" Cargo.toml
          cargo update --workspace

      - name: Build Linux Binary
        env:
          AMAZON_Q_BUILD_MUSL: ${{ matrix.musl }}
          AMAZON_Q_BUILD_TARGET_TRIPLE: ${{ matrix.cross_target }}
          INCLUDE_KAS_BUNDLE: "true"
          KIRO_VERSION: ${{ inputs.version }}
        run: |
          # The cross image pre-build fetches apt packages; a mirror outage lasting
          # longer than apt's own retries needs a fresh attempt with a delay.
          for attempt in 1 2 3; do
            if python3 ./scripts/main.py build \
                --skip-lints --skip-tests --skip-autodocs-embeddings \
                --stage-name "${{ env.STAGE_NAME }}"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build attempt $attempt failed, retrying in $((attempt * 30)) seconds"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Build failed after 3 attempts"
          exit 1

      - name: Upload artifacts to S3
        run: |
          echo "Uploading build artifacts to S3..."
          BRANCH_NAME="${{ inputs.branch_name }}"
          COMMIT_ID="${{ inputs.commit_sha }}"
          TARGET="${{ matrix.target }}"
          S3_PATH_COMMIT="chat/${BRANCH_NAME}/${COMMIT_ID}/${TARGET}"
          S3_PATH_LATEST="chat/${BRANCH_NAME}/latest/${TARGET}"
          
          # build/ also holds bundle-assembly intermediates (~50K loose files); upload
          # only the release artifacts so the copy takes seconds instead of minutes.
          for REQUIRED in kiro-cli-chat.tar.gz kiro-cli-chat.tar.gz.sha256 kiro-cli-chat.zip kiro-cli-chat.zip.sha256 BUILD_INFO.json; do
              if [ ! -s "build/${REQUIRED}" ]; then
                  echo "❌ build/${REQUIRED} missing or empty"
                  exit 1
              fi
          done
          for DEST in "${S3_PATH_COMMIT}" "${S3_PATH_LATEST}"; do
              aws s3 cp build/ "s3://${{ env.BUILD_OUTPUT_BUCKET }}/${DEST}/" --recursive \
                  --exclude "*" \
                  --include "kiro-cli-chat.tar.gz*" \
                  --include "kiro-cli-chat.zip*" \
                  --include "BUILD_INFO.json"
              echo "✓ Uploaded to s3://${{ env.BUILD_OUTPUT_BUCKET }}/${DEST}/"
          done
