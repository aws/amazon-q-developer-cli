name: 1.1 Build Linux

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      build_timestamp:
        type: string
        required: true
      version:
        type: string
        required: true
      release_type:
        type: string
        required: true
      environment:
        type: string
        required: true
      branch_name:
        type: string
        required: true
      commit_sha:
        type: string
        required: true

env:
  AWS_REGION: "us-east-1"
  STAGE_NAME: ${{ inputs.environment }}
  CI: 1
  # Avoid GitHub API rate limits (403) during postinstall scripts
  # that download from GitHub Releases (e.g. @vscode/ripgrep).
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  id-token: write
  contents: read

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }}, ${{ inputs.environment }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest-8-cores
            container: ubuntu:22.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest-8-cores
            musl: "1"
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest-8-cores
            cross_target: aarch64-unknown-linux-gnu
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest-8-cores
            musl: "1"
            cross_target: aarch64-unknown-linux-musl
    steps:
      - name: Prepare container (install basics)
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git build-essential pkg-config \
            libssl-dev unzip xz-utils sudo gnupg zip
          # Install Node.js 20 from NodeSource (22.04's default nodejs is too old for modern deps like node-pty)
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt-get install -y --no-install-recommends nodejs
          npm install -g node-gyp
          # Install AWS CLI v2
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          cd /tmp && unzip -q awscliv2.zip && ./aws/install && cd - && rm -rf /tmp/aws /tmp/awscliv2.zip

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Configure environment from secrets
        run: |
          {
            echo "AWS_GITHUB_ACTIONS_ROLE_ARN=${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}"
            echo "BUILD_OUTPUT_BUCKET=${{ secrets.BUILD_OUTPUT_BUCKET }}"
          } >> "$GITHUB_ENV"

      - name: Install Python (in container)
        if: matrix.container
        run: |
          apt-get install -y --no-install-recommends python3 python3-pip python3-venv

      - name: Setup Python
        if: '!matrix.container'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      - name: Install system dependencies
        if: "!matrix.musl && !matrix.cross_target"
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libssl-dev pkg-config cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Read pinned Bun version
        id: bun-version
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-version.outputs.version }}

      - name: Free Disk Space
        if: '!matrix.container'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Configure sccache
        if: inputs.branch_name != 'prod' && !matrix.musl && !matrix.cross_target
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set Rust compiler wrapper
        if: inputs.branch_name != 'prod' && !matrix.musl && !matrix.cross_target
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"

      - name: Cache Rust dependencies (cross builds)
        if: inputs.branch_name != 'prod' && (matrix.musl || matrix.cross_target)
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - name: Install cross (for cross-compilation)
        if: matrix.musl || matrix.cross_target
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.4 --locked

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200

      - name: Download autodocs embeddings
        uses: actions/download-artifact@v4
        with:
          pattern: autodocs-embeddings-*
          path: autodocs-artifacts

      - name: Install autodocs embeddings
        run: |
          echo "=== Before: committed files ==="
          echo "V1: $(python3 -c "import json; d=json.load(open('autodocs/meta/doc-index.json')); print(f'generated_at={d[\"generated_at\"]} total_docs={d[\"total_docs\"]}')")"
          echo "V1 tar.gz sha256: $(shasum -a 256 autodocs/meta/doc-search-index.tar.gz | cut -d' ' -f1)"
          echo "V2: $(python3 -c "import json; d=json.load(open('autodocs-v2/meta/doc-index.json')); print(f'generated_at={d[\"generated_at\"]} total_docs={d[\"total_docs\"]}')")"
          echo "V2 tar.gz sha256: $(shasum -a 256 autodocs-v2/meta/doc-search-index.tar.gz | cut -d' ' -f1)"
          echo ""
          echo "=== Installing from artifacts ==="
          find autodocs-artifacts -type f | sort
          cp autodocs-artifacts/autodocs-embeddings-v1/doc-search-index.tar.gz autodocs/meta/doc-search-index.tar.gz
          cp autodocs-artifacts/autodocs-embeddings-v1/doc-index.json autodocs/meta/doc-index.json
          cp autodocs-artifacts/autodocs-embeddings-v2/doc-search-index.tar.gz autodocs-v2/meta/doc-search-index.tar.gz
          cp autodocs-artifacts/autodocs-embeddings-v2/doc-index.json autodocs-v2/meta/doc-index.json
          echo ""
          echo "=== After: installed from CI ==="
          echo "V1: $(python3 -c "import json; d=json.load(open('autodocs/meta/doc-index.json')); print(f'generated_at={d[\"generated_at\"]} total_docs={d[\"total_docs\"]}')")"
          echo "V1 tar.gz sha256: $(shasum -a 256 autodocs/meta/doc-search-index.tar.gz | cut -d' ' -f1)"
          echo "V2: $(python3 -c "import json; d=json.load(open('autodocs-v2/meta/doc-index.json')); print(f'generated_at={d[\"generated_at\"]} total_docs={d[\"total_docs\"]}')")"
          echo "V2 tar.gz sha256: $(shasum -a 256 autodocs-v2/meta/doc-search-index.tar.gz | cut -d' ' -f1)"

      - uses: ./.github/actions/codeartifact-login
        with:
          restore-role-arn: ${{ env.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          restore-region: ${{ env.AWS_REGION }}

      - name: Set workspace version for packaging
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ inputs.version }}\"/" Cargo.toml
          cargo update --workspace

      - name: Build Linux Binary
        env:
          AMAZON_Q_BUILD_MUSL: ${{ matrix.musl }}
          AMAZON_Q_BUILD_TARGET_TRIPLE: ${{ matrix.cross_target }}
          INCLUDE_KAS_BUNDLE: "true"
          KIRO_VERSION: ${{ inputs.version }}
        run: |
          python3 ./scripts/main.py build \
            --skip-lints --skip-tests --skip-autodocs-embeddings \
            --stage-name "${{ env.STAGE_NAME }}"

      - name: Upload artifacts to S3
        run: |
          echo "Uploading build artifacts to S3..."
          BRANCH_NAME="${{ inputs.branch_name }}"
          COMMIT_ID="${{ inputs.commit_sha }}"
          TARGET="${{ matrix.target }}"
          S3_PATH_COMMIT="chat/${BRANCH_NAME}/${COMMIT_ID}/${TARGET}"
          S3_PATH_LATEST="chat/${BRANCH_NAME}/latest/${TARGET}"
          
          if [ -d "build" ] && [ "$(ls -A build)" ]; then
              aws s3 cp build/ "s3://${{ env.BUILD_OUTPUT_BUCKET }}/${S3_PATH_COMMIT}/" --recursive
              echo "✓ Uploaded to s3://${{ env.BUILD_OUTPUT_BUCKET }}/${S3_PATH_COMMIT}/"
              
              aws s3 cp build/ "s3://${{ env.BUILD_OUTPUT_BUCKET }}/${S3_PATH_LATEST}/" --recursive
              echo "✓ Uploaded to s3://${{ env.BUILD_OUTPUT_BUCKET }}/${S3_PATH_LATEST}/"
          else
              echo "❌ Build directory not found or empty"
              exit 1
          fi
