name: "Fork PR: CI"

# Runs TUI CI for fork PRs after a maintainer adds the "safe-to-test" label.
# This is needed because fork PRs cannot access repo secrets (CodeArtifact, IAM roles).
#
# Rust checks (clippy, test, fmt, deny) run automatically via rust.yml +
# approve-fork-ci.yaml — no label needed. Only TUI jobs require this workflow
# because they need CodeArtifact access for @kiro/@amzn packages.
#
# Security model:
# - Only triggers on label addition (requires write access to the repo)
# - A maintainer must review the code BEFORE adding the label
# - Label is removed after the run so new pushes require re-approval
# - CodeArtifact login is INLINED (not via ./.github/actions/) to prevent
#   fork code from hijacking the composite action and exfiltrating credentials

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  CI: 1
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  guard:
    name: Check trigger
    if: github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Fork PR #${{ github.event.pull_request.number }} approved for CI via safe-to-test label"

  # Remove the label so the next push requires re-approval
  remove-label:
    name: Remove safe-to-test label
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              name: 'safe-to-test'
            });

  # --- TUI checks (mirrors tui.yml) ---

  tui:
    name: TUI (${{ matrix.check }})
    needs: guard
    strategy:
      matrix:
        check: [typecheck, lint, test]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIRO_TUI_FORCE_COLOR: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Fork checkout under pull_request_target is gated behind the
          # maintainer-only safe-to-test label (removed after each run).
          allow-unsafe-pr-checkout: true
      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      # Keep authentication inline because fork checkouts are untrusted.
      - name: Configure AWS credentials for CodeArtifact
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::273221486557:role/kiro-agent-npm-packages-reader
          aws-region: us-west-2
      - name: Login to CodeArtifact
        run: |
          REGISTRY="kiro-agent-273221486557.d.codeartifact.us-west-2.amazonaws.com/npm/npm-packages"
          for attempt in 1 2 3; do
            if TOKEN=$(aws codeartifact get-authorization-token --domain kiro-agent --domain-owner 273221486557 --query authorizationToken --output text --region us-west-2) && [ -n "$TOKEN" ] && [ "$TOKEN" != "None" ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "CodeArtifact token request failed (attempt $attempt/3); retrying" >&2
            sleep $((attempt * 5))
          done
          printf '@kiro:registry=https://%s/\n@amzn:registry=https://%s/\n//%s/:always-auth=true\n//%s/:_authToken=%s\n' "$REGISTRY" "$REGISTRY" "$REGISTRY" "$REGISTRY" "$TOKEN" > .npmrc
      - name: Install dependencies
        run: bun install
      - name: Build twinki
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Run ${{ matrix.check }}
        if: matrix.check != 'test'
        run: bun run ${{ matrix.check }}
        working-directory: packages/tui
      # The unit-test leg answers a required check, so it must assert everything that check means on a branch.
      - name: Run tui tests
        if: matrix.check == 'test'
        run: |
          set -o pipefail
          bun test 2>&1 | tee /tmp/tui-coverage.txt
          # Extract coverage from bun's "All files" line
          FUNCS=$(grep "All files" /tmp/tui-coverage.txt | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          LINES=$(grep "All files" /tmp/tui-coverage.txt | awk -F'|' '{gsub(/ /,"",$3); print $3}')
          echo "Coverage — functions: ${FUNCS}%, lines: ${LINES}%"
          # Minimum thresholds — bun's "All files" includes files that
          # coveragePathIgnorePatterns excludes from the table but not the
          # summary (bun bug). Use 80% as the floor for the raw summary;
          # the real coverage of unit-testable code is 93%+.
          MIN_FUNCS=80
          MIN_LINES=80
          if [ "$(echo "$FUNCS < $MIN_FUNCS" | bc -l)" = "1" ]; then
            echo "::error::Function coverage regression! ${FUNCS}% < ${MIN_FUNCS}%"
            exit 1
          fi
          if [ "$(echo "$LINES < $MIN_LINES" | bc -l)" = "1" ]; then
            echo "::error::Line coverage regression! ${LINES}% < ${MIN_LINES}%"
            exit 1
          fi
        working-directory: packages/tui
      - name: Run vitest selector tests
        if: matrix.check == 'test'
        run: npx vitest run --config vitest.config.ts
        working-directory: packages/tui
      - name: Run twinki tests
        if: matrix.check == 'test'
        run: bun run test:run
        working-directory: packages/twinki

  tui-integ:
    name: TUI Integration (${{ matrix.os }})
    needs: guard
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-x64-latest-16-cores]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Fork checkout under pull_request_target is gated behind the
          # maintainer-only safe-to-test label (removed after each run).
          allow-unsafe-pr-checkout: true
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y -qq build-essential pkg-config jq dpkg curl wget zstd cmake clang libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev valac libibus-1.0-dev libglib2.0-dev sqlite3 libxdo-dev protobuf-compiler libfuse2 libasound2-dev
      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: fork-cargo-integ-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            fork-cargo-integ-${{ runner.os }}-
      - name: Build chat_cli
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo build -p chat_cli --no-default-features
          else
            cargo build -p chat_cli
          fi
      - name: Read pinned Bun version
        id: bun-ver
        shell: bash
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      - name: Configure AWS credentials for CodeArtifact
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::273221486557:role/kiro-agent-npm-packages-reader
          aws-region: us-west-2
      - name: Login to CodeArtifact
        shell: bash
        run: |
          REGISTRY="kiro-agent-273221486557.d.codeartifact.us-west-2.amazonaws.com/npm/npm-packages"
          for attempt in 1 2 3; do
            if TOKEN=$(aws codeartifact get-authorization-token --domain kiro-agent --domain-owner 273221486557 --query authorizationToken --output text --region us-west-2) && [ -n "$TOKEN" ] && [ "$TOKEN" != "None" ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "CodeArtifact token request failed (attempt $attempt/3); retrying" >&2
            sleep $((attempt * 5))
          done
          printf '@kiro:registry=https://%s/\n@amzn:registry=https://%s/\n//%s/:always-auth=true\n//%s/:_authToken=%s\n' "$REGISTRY" "$REGISTRY" "$REGISTRY" "$REGISTRY" "$TOKEN" > .npmrc
      - name: Install dependencies
        run: bun install
      - name: Build twinki
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Run integration tests (Linux)
        if: runner.os == 'Linux'
        run: bun run test:integ
        working-directory: packages/tui
      - name: Run ACP integration tests
        run: bun run test:acp-integ
        working-directory: packages/tui
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-integ-logs-${{ matrix.os }}
          path: packages/tui/integ_tests/test-outputs/
          retention-days: 7

  tui-e2e:
    name: TUI E2E (${{ matrix.os }})
    needs: guard
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-x64-latest-16-cores]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Fork checkout under pull_request_target is gated behind the
          # maintainer-only safe-to-test label (removed after each run).
          allow-unsafe-pr-checkout: true
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y -qq build-essential pkg-config jq dpkg curl wget zstd cmake clang libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev valac libibus-1.0-dev libglib2.0-dev sqlite3 libxdo-dev protobuf-compiler libfuse2 libasound2-dev
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: fork-cargo-e2e-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Build chat_cli
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cargo build -p chat_cli --no-default-features
          else
            cargo build -p chat_cli
          fi
      - name: Read pinned Bun version
        id: bun-ver
        shell: bash
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      - name: Configure AWS credentials for CodeArtifact
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::273221486557:role/kiro-agent-npm-packages-reader
          aws-region: us-west-2
      - name: Login to CodeArtifact
        shell: bash
        run: |
          REGISTRY="kiro-agent-273221486557.d.codeartifact.us-west-2.amazonaws.com/npm/npm-packages"
          for attempt in 1 2 3; do
            if TOKEN=$(aws codeartifact get-authorization-token --domain kiro-agent --domain-owner 273221486557 --query authorizationToken --output text --region us-west-2) && [ -n "$TOKEN" ] && [ "$TOKEN" != "None" ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "CodeArtifact token request failed (attempt $attempt/3); retrying" >&2
            sleep $((attempt * 5))
          done
          printf '@kiro:registry=https://%s/\n@amzn:registry=https://%s/\n//%s/:always-auth=true\n//%s/:_authToken=%s\n' "$REGISTRY" "$REGISTRY" "$REGISTRY" "$REGISTRY" "$TOKEN" > .npmrc
      - name: Install dependencies
        run: bun install
      - name: Build twinki
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Build TUI
        run: bun run build
        working-directory: packages/tui
      - name: Run E2E tests
        run: bun test ./e2e_tests/
        working-directory: packages/tui
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-e2e-logs-${{ matrix.os }}
          path: packages/tui/e2e_tests/test-outputs/
          retention-days: 7

  # The PR's required TUI gate checks report before these results exist, so
  # re-run them once the results are in.
  refresh-required-checks:
    name: Refresh required checks
    needs: [guard, tui, tui-integ, tui-e2e]
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run the PR TUI checks for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Every workflow hosting a fork-gated required check needs the re-run:
          # a gate left in another workflow keeps the verdict it recorded before
          # this run existed, and no event re-evaluates it on its own.
          for wf in tui.yml rc-certification.yml; do
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$HEAD_SHA&per_page=1" --jq '.workflow_runs[0].id // empty')
            if [[ -z "$RUN_ID" ]]; then
              echo "::warning::No $wf run for $HEAD_SHA — required checks need a manual re-run"
              continue
            fi
            # Whole run, not just its failed jobs: a partial re-run would reuse the
            # earlier job outputs, which is exactly the stale answer being replaced.
            if ! gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/rerun"; then
              echo "::warning::Could not re-run $wf run $RUN_ID — required checks need a manual re-run"
            fi
          done
