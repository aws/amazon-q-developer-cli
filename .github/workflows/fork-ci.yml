name: 'Fork PR: RC Certification'

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: fork-rc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write
  pull-requests: read
  statuses: write

jobs:
  prepare:
    name: Prepare fork certification
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      source_repository: ${{ steps.prepare.outputs.source_repository }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      should_run: ${{ steps.prepare.outputs.should_run }}
      short_sha: ${{ steps.prepare.outputs.short_sha }}
    steps:
      - name: Validate approval gate and source
        id: prepare
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const sourceSha = pr.head.sha;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            const statusContext = 'Fork RC Certification (required)';

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const fileListComplete = files.length === pr.changed_files;
            const isIgnoredPath = filename => {
              return (
                filename.startsWith('docs/') ||
                filename.startsWith('.docs/') ||
                filename.startsWith('.ops/') ||
                filename.startsWith('.kiro/') ||
                filename.startsWith('.changes/') ||
                filename.startsWith('pending_autodocs/') ||
                filename.startsWith('scripts/testing-cert-status/') ||
                filename.startsWith('packages/tui/docs/') ||
                filename.startsWith('packages/twinki/docs/') ||
                /^\.github\/.*\.md$/i.test(filename) ||
                /^packages\/(?:tui|twinki)\/.*\.md$/i.test(filename) ||
                /^crates\/[^/]+\/README\.md$/i.test(filename) ||
                /^crates\/[^/]+\/docs\//i.test(filename) ||
                /^[^/]+\.md$/i.test(filename)
              );
            };
            const needsVerification =
              !fileListComplete ||
              files.some(({ filename, previous_filename }) => {
                return [filename, previous_filename]
                  .filter(Boolean)
                  .some(path => !isIgnoredPath(path));
              });
            if (!fileListComplete) {
              core.warning(
                `Received ${files.length} of ${pr.changed_files} changed files; RC verification is required`
              );
            }

            core.setOutput('source_repository', pr.head.repo.full_name);
            core.setOutput('source_sha', sourceSha);
            core.setOutput('short_sha', sourceSha.slice(0, 12));
            core.setOutput(
              'should_run',
              pr.head.repo.fork && needsVerification ? 'true' : 'false'
            );

            if (!pr.head.repo.fork) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: sourceSha,
                state: 'success',
                context: statusContext,
                description: 'Internal PR uses the standard RC certification gate',
                target_url: runUrl,
              });
              core.info('Internal PR does not require fork approval');
              return;
            }

            if (!needsVerification) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: sourceSha,
                state: 'success',
                context: statusContext,
                description: 'No RC verification paths changed',
                target_url: runUrl,
              });
              core.info('No RC verification paths changed');
              return;
            }

            let environment;
            try {
              ({ data: environment } = await github.rest.repos.getEnvironment({
                owner,
                repo,
                environment_name: 'fork-rc',
              }));
            } catch (error) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: sourceSha,
                state: 'failure',
                context: statusContext,
                description: 'Unable to verify fork-rc approval protections',
                target_url: runUrl,
              });
              throw error;
            }
            const reviewerRule = environment.protection_rules?.find(
              rule => rule.type === 'required_reviewers'
            );
            if (
              environment.can_admins_bypass ||
              !reviewerRule?.prevent_self_review ||
              !reviewerRule.reviewers?.length
            ) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha: sourceSha,
                state: 'failure',
                context: statusContext,
                description: 'fork-rc approval environment is not protected',
                target_url: runUrl,
              });
              throw new Error('fork-rc approval protections are incomplete');
            }

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: sourceSha,
              state: 'pending',
              context: statusContext,
              description: 'Waiting for a reviewer to approve RC certification',
              target_url: runUrl,
            });

  notify:
    name: Notify fork reviewers
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Post approval request to Slack
        id: slack
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_REVIEWER_BOT_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        shell: bash
        run: |
          PAYLOAD="$(jq -n \
            --arg channel "C0ARG53D0NL" \
            --arg author "$PR_AUTHOR" \
            --arg number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg pr_url "$PR_URL" \
            --arg run_url "$RUN_URL" \
            --arg sha "$SHORT_SHA" \
            '{
              channel: $channel,
              unfurl_links: false,
              text: ("Fork RC approval requested for #" + $number),
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "Fork RC certification needs approval"
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("<" + $pr_url + "|#" + $number + ": " + $title + "> by `" + $author + "`")
                  },
                  fields: [
                    {
                      type: "mrkdwn",
                      text: ("*Reviewed SHA*\n`" + $sha + "`")
                    },
                    {
                      type: "mrkdwn",
                      text: "*Runs after approval*\nRC smoke, integration, and E2E"
                    }
                  ]
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      style: "primary",
                      text: {
                        type: "plain_text",
                        text: "Review and approve RC"
                      },
                      url: $run_url
                    },
                    {
                      type: "button",
                      text: {
                        type: "plain_text",
                        text: "Open pull request"
                      },
                      url: $pr_url
                    }
                  ]
                },
                {
                  type: "context",
                  elements: [
                    {
                      type: "mrkdwn",
                      text: "Approve only after reviewing this SHA. A new push cancels this run and requests approval again."
                    }
                  ]
                }
              ]
            }'
          )"

          RESPONSE="$(curl -fsS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$PAYLOAD")"
          if [ "$(jq -r '.ok' <<<"$RESPONSE")" != "true" ]; then
            jq -r '.error // "Slack notification failed"' <<<"$RESPONSE" >&2
            exit 1
          fi

      - name: Report Slack notification failure
        if: steps.slack.outcome == 'failure'
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "::warning::Slack approval notification failed; approve the fork RC run manually at $RUN_URL"
          {
            echo "### Slack approval notification failed"
            echo
            echo "Reviewers must open the [fork RC run]($RUN_URL) directly."
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Approve reviewed fork SHA
    needs: [prepare, notify]
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: fork-rc
      url: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Record approval
        run: echo "Approved fork commit ${{ needs.prepare.outputs.source_sha }}"

  rc-certification:
    name: Run shared RC certification
    needs: [prepare, approve]
    if: needs.prepare.outputs.should_run == 'true'
    uses: ./.github/workflows/rc-certification.yml
    with:
      execution_mode: fork
      source_repository: ${{ needs.prepare.outputs.source_repository }}
      source_sha: ${{ needs.prepare.outputs.source_sha }}
      trusted_sha: ${{ github.sha }}
      pr_number: ${{ github.event.pull_request.number }}

  publish-status:
    name: Publish fork certification status
    needs: [prepare, rc-certification]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish exact-SHA result
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          RC_RESULT: ${{ needs.rc-certification.result }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        with:
          script: |
            const passed = process.env.RC_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.SOURCE_SHA,
              state: passed ? 'success' : 'failure',
              context: 'Fork RC Certification (required)',
              description: passed
                ? 'Shared RC certification passed'
                : `Shared RC certification ${process.env.RC_RESULT}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!passed) {
              core.setFailed(`Shared RC certification ${process.env.RC_RESULT}`);
            }
