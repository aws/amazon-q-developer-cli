name: "PR: Rust"

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check-paths:
    name: Check if Rust files changed
    runs-on: ubuntu-latest
    outputs:
      rust-changed: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'deny.toml'
              - '.github/workflows/rust.yml'

  cargo-clippy:
    name: Clippy (${{ matrix.os }})
    needs: check-paths
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        if: needs.check-paths.outputs.rust-changed == 'true'
      - name: Install dependencies (Linux)
        if: needs.check-paths.outputs.rust-changed == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y -qq build-essential pkg-config jq dpkg curl wget zstd cmake clang libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev valac libibus-1.0-dev libglib2.0-dev sqlite3 libxdo-dev protobuf-compiler libfuse2 libasound2-dev bash fish zsh shellcheck
      - name: Install dependencies (macOS)
        if: needs.check-paths.outputs.rust-changed == 'true' && runner.os == 'Macos'
        run: brew install protobuf fish shellcheck
      - uses: dtolnay/rust-toolchain@1.84.0
        if: needs.check-paths.outputs.rust-changed == 'true'
        id: toolchain
        with:
          components: clippy
      - name: Cache cargo registry
        if: needs.check-paths.outputs.rust-changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-clippy-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-clippy-registry-${{ runner.os }}-
      - name: Run clippy
        if: needs.check-paths.outputs.rust-changed == 'true'
        run: cargo clippy --locked --workspace --color always -- -D warnings

  cargo-test:
    name: Test (${{ matrix.name }})
    needs: check-paths
    strategy:
      matrix:
        include:
          - os: ubuntu-latest-8-cores
            name: ubuntu-latest
          - os: macos-latest
            name: macos-latest
      fail-fast: false
    env:
      OS: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        if: needs.check-paths.outputs.rust-changed == 'true'
      - name: Free disk space (Linux)
        if: needs.check-paths.outputs.rust-changed == 'true' && runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
      - name: Install dependencies (Linux)
        if: needs.check-paths.outputs.rust-changed == 'true' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y -qq build-essential pkg-config jq dpkg curl wget zstd cmake clang libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev valac libibus-1.0-dev libglib2.0-dev sqlite3 libxdo-dev protobuf-compiler libfuse2 libasound2-dev bash zsh
      # this needs to be nightly for code coverage
      - uses: dtolnay/rust-toolchain@nightly
        if: needs.check-paths.outputs.rust-changed == 'true'
        id: toolchain
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        if: needs.check-paths.outputs.rust-changed == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo registry
        if: needs.check-paths.outputs.rust-changed == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-test-registry-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-test-registry-${{ matrix.name }}-
      - name: Run tests
        if: needs.check-paths.outputs.rust-changed == 'true'
        run: cargo test --locked --workspace --lib --bins --test '*'
      - name: Run release-profile gating tests
        if: needs.check-paths.outputs.rust-changed == 'true' && runner.os == 'Linux'
        run: cargo test --locked --release -p chat_cli --test cloud_sessions_gating --test changelog_feed

  # Windows clippy — disabled until dead_code warnings in platform-gated code are resolved
  # cargo-clippy-windows:
  #   name: Clippy Windows
  #   needs: check-paths
  #   if: needs.check-paths.outputs.rust-changed == 'true'
  #   runs-on: windows-x64-latest-16-cores
  #   timeout-minutes: 60
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@1.84.0
  #       id: toolchain
  #       with:
  #         components: clippy
  #     - uses: actions/cache@v4
  #       with:
  #         path: |
  #           ~/.cargo/registry/index/
  #           ~/.cargo/registry/cache/
  #           ~/.cargo/git/db/
  #           target/
  #         key: cargo-clippy-windows-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.cachekey }}
  #     - run: cargo clippy --locked -p chat_cli -p chat_cli_v2 -p agent --color always -- -D warnings

  cargo-coverage:
    name: Coverage floor (agent crate)
    needs: check-paths
    if: needs.check-paths.outputs.rust-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Floor: line coverage for the agent crate must not drop below this.
      # Ratchet upward as coverage improves.
      AGENT_COVERAGE_FLOOR: 83
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y -qq build-essential pkg-config jq dpkg curl wget zstd cmake clang libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev valac libibus-1.0-dev libglib2.0-dev sqlite3 libxdo-dev protobuf-compiler libfuse2 bash zsh
      - uses: dtolnay/rust-toolchain@nightly
        id: toolchain
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-coverage-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ steps.toolchain.outputs.cachekey }}
      - name: Run coverage on agent crate
        run: |
          cargo llvm-cov --package agent --lcov --output-path lcov.info
          cargo llvm-cov report --package agent --summary-only | tee coverage-summary.txt
      - name: Enforce coverage floor
        run: |
          # Extract line coverage % from the TOTAL row of the summary.
          # Format: "TOTAL  <regions> <missed> <cov%> <funcs> <missed> <cov%> <lines> <missed> <cov%> ..."
          # We want the lines coverage (10th field).
          coverage=$(awk '/^TOTAL/ { gsub("%", "", $10); print $10 }' coverage-summary.txt)
          floor="${AGENT_COVERAGE_FLOOR}"
          echo "::notice::agent crate line coverage = ${coverage}% (floor = ${floor}%)"
          # Use awk for floating-point comparison.
          if awk -v c="$coverage" -v f="$floor" 'BEGIN { exit !(c < f) }'; then
            echo "::error::Coverage ${coverage}% is below the required floor of ${floor}%."
            echo "Either add tests to bring coverage back up, or (only with reviewer approval) lower the floor in .github/workflows/rust.yml."
            exit 1
          fi
          echo "✓ Coverage ${coverage}% meets the floor of ${floor}%."
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage-lcov
          path: lcov.info
          retention-days: 14

  cargo-test-windows:
    name: Test (windows-x64-latest-16-cores)
    needs: check-paths
    if: needs.check-paths.outputs.rust-changed == 'true'
    runs-on: windows-x64-latest-16-cores
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        id: toolchain
        with:
          components: llvm-tools-preview
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-test-registry-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-test-registry-windows-
      - name: Run tests
        run: cargo test --locked -p chat_cli -p chat_cli_v2 -p agent --lib

  cargo-fmt:
    name: Fmt
    needs: check-paths
    if: needs.check-paths.outputs.rust-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --check -- --color always

  cargo-deny:
    name: Deny
    needs: check-paths
    if: needs.check-paths.outputs.rust-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  rust-deny-required:
    name: "Rust: Deny (required)"
    if: always()
    needs: [check-paths, cargo-deny]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.rust-changed }}" != "true" ]]; then
            echo "Rust files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.cargo-deny.result }}" != "success" ]]; then
            echo "::error::cargo deny failed"
            exit 1
          fi

  rust-fmt-required:
    name: "Rust: Fmt (required)"
    if: always()
    needs: [check-paths, cargo-fmt]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.rust-changed }}" != "true" ]]; then
            echo "Rust files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.cargo-fmt.result }}" != "success" ]]; then
            echo "::error::cargo fmt failed"
            exit 1
          fi

  rust-coverage-required:
    name: "Rust: Coverage (required)"
    if: always()
    needs: [check-paths, cargo-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.rust-changed }}" != "true" ]]; then
            echo "Rust files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.cargo-coverage.result }}" != "success" ]]; then
            echo "::error::Coverage floor check failed"
            exit 1
          fi
