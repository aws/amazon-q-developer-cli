name: Code Review

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [main]
  issue_comment:
    types: [created]

concurrency:
  group: kiro-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/review') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Get PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check skip marker
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(gh pr view "${{ steps.pr.outputs.number }}" --repo "${{ github.repository }}" --json body --jq '.body // ""')
          if echo "$BODY" | grep -qF '[review:ignore]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect review iteration
        id: iteration
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Fetch all bot reviews once, extract count and last timestamp
          BOT_REVIEWS=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")]')
          REVIEW_COUNT=$(echo "$BOT_REVIEWS" | jq 'length')
          echo "count=$REVIEW_COUNT" >> "$GITHUB_OUTPUT"

          # Check if bot has a prior CHANGES_REQUESTED that needs dismissing
          HAS_CHANGES_REQUESTED=$(echo "$BOT_REVIEWS" | jq '[.[] | select(.state == "CHANGES_REQUESTED")] | length > 0')
          echo "has_prior_request_changes=$HAS_CHANGES_REQUESTED" >> "$GITHUB_OUTPUT"

          if [ "$REVIEW_COUNT" -eq 0 ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=incremental" >> "$GITHUB_OUTPUT"
          fi

          # Debounce: skip if last bot review was < 10 min ago (unless /review command)
          if [ "${{ github.event_name }}" != "issue_comment" ] && [ "$REVIEW_COUNT" -gt 0 ]; then
            LAST_REVIEW_TIME=$(echo "$BOT_REVIEWS" | jq -r 'last | .submitted_at // empty')
            if [ -n "$LAST_REVIEW_TIME" ]; then
              # CI is Ubuntu-only; date -d is always available
              LAST_EPOCH=$(date -d "$LAST_REVIEW_TIME" +%s)
              NOW_EPOCH=$(date +%s)
              DIFF_MIN=$(( (NOW_EPOCH - LAST_EPOCH) / 60 ))
              if [ "$DIFF_MIN" -lt 10 ]; then
                echo "debounced=true" >> "$GITHUB_OUTPUT"
              else
                echo "debounced=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "debounced=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "debounced=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.gate.outputs.skip != 'true' && steps.iteration.outputs.debounced != 'true'
        with:
          # Checkout the trusted base branch (main), NOT the PR head.
          # The reviewer agent fetches PR diffs via `gh pr diff` API — it does
          # not need the untrusted PR code on disk. This avoids CodeQL's
          # "checkout of untrusted code in a privileged context" finding.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1

      - name: Install Kiro CLI
        if: steps.gate.outputs.skip != 'true' && steps.iteration.outputs.debounced != 'true'
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          kiro-cli --version

      - name: Configure AWS credentials
        if: steps.gate.outputs.skip != 'true' && steps.iteration.outputs.debounced != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::551670267384:role/KiroCLIReviewerQueryRole
          aws-region: us-east-1

      - name: Run review
        if: steps.gate.outputs.skip != 'true' && steps.iteration.outputs.debounced != 'true'
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_REVIEW_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_REVIEWER_BOT_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REVIEW_MODE: ${{ steps.iteration.outputs.mode }}
          REVIEW_ITERATION: ${{ steps.iteration.outputs.count }}
          HAS_PRIOR_REQUEST_CHANGES: ${{ steps.iteration.outputs.has_prior_request_changes }}
        run: |
          if [ "$REVIEW_MODE" = "full" ]; then
            kiro-cli chat --no-interactive --trust-all-tools --agent pr-reviewer \
              "Review PR $PR_NUMBER (iteration: first). Keep the parent review body to Description (1-2 lines), Recommendation (1 line), Watch For (only if inline comments cannot cover it), Memory Context (short, relevant bullets only), and Suggested Reviewers. Label issues as Blocking or Non-blocking. Mark REQUEST_CHANGES if any blocking finding exists. DO NOT wait for user input."
          else
            DISMISS_CLAUSE=""
            if [ "$HAS_PRIOR_REQUEST_CHANGES" = "true" ]; then
              DISMISS_CLAUSE=" If no blocking findings remain, dismiss the prior REQUEST_CHANGES review using the GitHub dismissals API."
            fi
            kiro-cli chat --no-interactive --trust-all-tools --agent pr-reviewer \
              "Review PR $PR_NUMBER (iteration: $((REVIEW_ITERATION + 1)), mode: incremental). Only post NEW inline comments for findings not already raised. Keep the parent review body to Description (1-2 lines), Recommendation (1 line), and Watch For (optional). Do not include memory context, suggested reviewers, or appendices. Label issues as Blocking or Non-blocking. Mark REQUEST_CHANGES if any blocking finding remains unresolved on the PR.${DISMISS_CLAUSE} DO NOT wait for user input."
          fi
