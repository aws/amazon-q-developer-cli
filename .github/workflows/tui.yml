name: "PR: TUI"

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  id-token: write

env:
  CI: 1
  # Avoid GitHub API rate limits (403) during postinstall scripts
  # that download from GitHub Releases (e.g. @vscode/ripgrep).
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-paths:
    name: Check if TUI files changed
    runs-on: ubuntu-latest
    outputs:
      tui-changed: ${{ steps.filter.outputs.tui }}
      telemetry-changed: ${{ steps.filter.outputs.telemetry }}
      is-fork: ${{ steps.fork.outputs.is-fork }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tui:
              - 'packages/tui/**'
              - 'packages/twinki/**'
              - '.github/workflows/tui.yml'
            telemetry:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'dev/telemetry/**'
              - 'crates/agent/src/agent/agent_loop/**'
              - 'crates/chat-cli/**'
              - 'crates/chat-cli-v2/src/agent/acp/**'
              - 'crates/chat-cli-v2/src/telemetry/**'
              - 'crates/kiro-telemetry*/**'
              - 'packages/tui/src/acp-client/**'
              - 'packages/tui/src/index.tsx'
              - 'packages/tui/src/utils/meter.ts'
              - 'packages/tui/src/utils/tui-telemetry-observer.ts'
              - 'packages/tui/src/utils/otlp-emit.ts'
              - '.github/workflows/tui.yml'
      - name: Detect fork PR
        id: fork
        run: echo "is-fork=${{ github.event.pull_request.head.repo.fork || false }}" >> "$GITHUB_OUTPUT"

  tui-typecheck:
    name: Typecheck
    needs: check-paths
    if: needs.check-paths.outputs.tui-changed == 'true' && needs.check-paths.outputs.is-fork != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      - uses: ./.github/actions/codeartifact-login
      - name: Install dependencies
        run: bun install
      - name: Build twinki package
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Typecheck
        run: bun run typecheck
        working-directory: packages/tui

  tui-lint:
    name: Lint
    needs: check-paths
    if: needs.check-paths.outputs.tui-changed == 'true' && needs.check-paths.outputs.is-fork != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      - uses: ./.github/actions/codeartifact-login
      - name: Install dependencies
        run: bun install
      - name: Build twinki package
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Lint
        run: bun run lint
        working-directory: packages/tui

  tui-test:
    name: Unit Tests
    needs: check-paths
    if: needs.check-paths.outputs.tui-changed == 'true' && needs.check-paths.outputs.is-fork != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIRO_TUI_FORCE_COLOR: '3'
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      - uses: ./.github/actions/codeartifact-login
      - name: Install dependencies
        run: bun install
      - name: Build twinki package
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Run tui tests
        run: |
          set -o pipefail
          bun test 2>&1 | tee /tmp/tui-coverage.txt
          # Extract coverage from bun's "All files" line
          FUNCS=$(grep "All files" /tmp/tui-coverage.txt | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          LINES=$(grep "All files" /tmp/tui-coverage.txt | awk -F'|' '{gsub(/ /,"",$3); print $3}')
          echo "Coverage — functions: ${FUNCS}%, lines: ${LINES}%"
          # Minimum thresholds — bun's "All files" includes files that
          # coveragePathIgnorePatterns excludes from the table but not the
          # summary (bun bug). Use 80% as the floor for the raw summary;
          # the real coverage of unit-testable code is 93%+.
          MIN_FUNCS=80
          MIN_LINES=80
          if [ "$(echo "$FUNCS < $MIN_FUNCS" | bc -l)" = "1" ]; then
            echo "::error::Function coverage regression! ${FUNCS}% < ${MIN_FUNCS}%"
            exit 1
          fi
          if [ "$(echo "$LINES < $MIN_LINES" | bc -l)" = "1" ]; then
            echo "::error::Line coverage regression! ${LINES}% < ${MIN_LINES}%"
            exit 1
          fi
        working-directory: packages/tui
      - name: Run vitest selector tests
        run: npx vitest run --config vitest.config.ts
        working-directory: packages/tui
      - name: Run twinki tests
        run: bun run test:run
        working-directory: packages/twinki

  tui-telemetry-e2e:
    name: Telemetry E2E
    needs: check-paths
    if: needs.check-paths.outputs.telemetry-changed == 'true' && needs.check-paths.outputs.is-fork != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install telemetry E2E build deps
        run: sudo apt-get update && sudo apt-get install -y -qq protobuf-compiler jq curl sqlite3

      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-telemetry-e2e-registry-v1-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-telemetry-e2e-registry-v1-${{ runner.os }}-

      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - uses: ./.github/actions/codeartifact-login

      - name: Install dependencies
        run: bun install

      - name: Build twinki package
        run: bun run build
        working-directory: packages/twinki/packages/twinki

      - name: Run telemetry E2E validation
        # Brings up the local OTel stack (collector + Prometheus + Grafana) via
        # `docker compose`, runs a real non-interactive V1 dual-write chat,
        # records and compares OTLP + legacy Toolkit delivery, then exercises
        # Rust/TUI metric constructors and exporters before verifying
        # Prometheus plus the provisioned Grafana dashboard. The script starts
        # from empty volumes and tears the stack down on EXIT.
        run: COMPOSE_CMD="docker compose" bash dev/telemetry/validate-metrics-e2e.sh

      - name: Upload collector logs on failure
        if: failure()
        run: docker compose -f dev/telemetry/compose.yaml logs > /tmp/telemetry-stack.log 2>&1 || true
      - name: Upload stack logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-e2e-stack-logs
          path: /tmp/telemetry-stack.log
          retention-days: 7

  # Fork PRs have no CodeArtifact credentials, so their TUI checks run in a
  # maintainer-labelled workflow; collect its per-check results for this commit.
  fork-ci-status:
    name: Fork CI status
    needs: check-paths
    if: needs.check-paths.outputs.is-fork == 'true' && needs.check-paths.outputs.tui-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      typecheck: ${{ steps.query.outputs.typecheck }}
      lint: ${{ steps.query.outputs.lint }}
      test: ${{ steps.query.outputs.test }}
    steps:
      - name: Query fork CI results for this commit
        id: query
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          RUN_IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/fork-ci.yml/runs?head_sha=$HEAD_SHA&per_page=20" --jq '.workflow_runs[].id')
          # Every label starts a run, so only an approved one carries a verdict.
          APPROVED_JOBS=()
          for run_id in $RUN_IDS; do
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")
            [[ "$(jq -r '.jobs[] | select(.name == "Check trigger") | .conclusion' <<<"$jobs")" == success ]] || continue
            APPROVED_JOBS+=("$jobs")
          done
          for spec in "typecheck:TUI (typecheck)" "lint:TUI (lint)" "test:TUI (test)"; do
            key="${spec%%:*}"
            prefix="${spec#*:}"
            result=missing
            for jobs in "${APPROVED_JOBS[@]}"; do
              conclusions=$(jq -r ".jobs[] | select(.name | startswith(\"$prefix\")) | .conclusion // \"pending\"" <<<"$jobs")
              [[ -n "$conclusions" ]] || continue
              if grep -qv '^success$' <<<"$conclusions"; then
                # Anything that is not success or in flight is a real failure for this commit.
                if grep -qvE '^(success|pending)$' <<<"$conclusions"; then
                  # An older run's failure cannot retract a newer one still in flight.
                  [[ "$result" == pending ]] || result=failing
                  break
                fi
                # In flight is not a verdict, so an older run may still answer for this commit.
                result=pending
                continue
              fi
              result=success
              break
            done
            echo "$key=$result" >> "$GITHUB_OUTPUT"
            echo "$key: $result"
          done

  # Gate jobs: always run so they can be set as required status checks.
  # They pass only when the work they stand for actually ran and succeeded.

  tui-unit-tests-required:
    name: "TUI: Unit Tests (required)"
    if: always()
    needs: [check-paths, tui-test, fork-ci-status]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.tui-changed }}" != "true" ]]; then
            echo "TUI files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.check-paths.outputs.is-fork }}" == "true" ]]; then
            # Only one of "still running" and "failed" is a reason to go read a test.
            case "${{ needs.fork-ci-status.outputs.test }}" in
              success)
                echo "Fork CI unit tests passed for this commit"
                exit 0
                ;;
              pending)
                echo "::error::Fork CI unit tests for this commit are still running — this check is refreshed when they finish"
                exit 1
                ;;
              failing)
                echo "::error::Fork CI unit tests failed for this commit"
                exit 1
                ;;
              *)
                echo "::error::No approved fork CI unit test result for this commit — maintainers start fork CI with the safe-to-test label"
                exit 1
                ;;
            esac
          fi
          if [[ "${{ needs.tui-test.result }}" != "success" ]]; then
            echo "::error::TUI unit tests failed"
            exit 1
          fi

  tui-telemetry-e2e-required:
    name: "TUI: Telemetry E2E (required)"
    if: always()
    needs: [check-paths, tui-telemetry-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.telemetry-changed }}" != "true" ]]; then
            echo "Telemetry files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.check-paths.outputs.is-fork }}" == "true" ]]; then
            echo "Fork PR — telemetry E2E needs CodeArtifact + Docker, deferred"
            exit 0
          fi
          if [[ "${{ needs.tui-telemetry-e2e.result }}" != "success" ]]; then
            echo "::error::TUI telemetry E2E failed"
            exit 1
          fi

  tui-typecheck-required:
    name: "TUI: Typecheck (required)"
    if: always()
    needs: [check-paths, tui-typecheck, fork-ci-status]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.tui-changed }}" != "true" ]]; then
            echo "TUI files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.check-paths.outputs.is-fork }}" == "true" ]]; then
            case "${{ needs.fork-ci-status.outputs.typecheck }}" in
              success)
                echo "Fork CI typecheck passed for this commit"
                exit 0
                ;;
              pending)
                echo "::error::Fork CI typecheck for this commit is still running — this check is refreshed when it finishes"
                exit 1
                ;;
              failing)
                echo "::error::Fork CI typecheck failed for this commit"
                exit 1
                ;;
              *)
                echo "::error::No approved fork CI typecheck result for this commit — maintainers start fork CI with the safe-to-test label"
                exit 1
                ;;
            esac
          fi
          if [[ "${{ needs.tui-typecheck.result }}" != "success" ]]; then
            echo "::error::TUI typecheck failed"
            exit 1
          fi

  tui-lint-required:
    name: "TUI: Lint (required)"
    if: always()
    needs: [check-paths, tui-lint, fork-ci-status]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.tui-changed }}" != "true" ]]; then
            echo "TUI files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.check-paths.outputs.is-fork }}" == "true" ]]; then
            case "${{ needs.fork-ci-status.outputs.lint }}" in
              success)
                echo "Fork CI lint passed for this commit"
                exit 0
                ;;
              pending)
                echo "::error::Fork CI lint for this commit is still running — this check is refreshed when it finishes"
                exit 1
                ;;
              failing)
                echo "::error::Fork CI lint failed for this commit"
                exit 1
                ;;
              *)
                echo "::error::No approved fork CI lint result for this commit — maintainers start fork CI with the safe-to-test label"
                exit 1
                ;;
            esac
          fi
          if [[ "${{ needs.tui-lint.result }}" != "success" ]]; then
            echo "::error::TUI lint failed"
            exit 1
          fi
