name: "PR: TUI"

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  id-token: write

env:
  CI: 1
  # Avoid GitHub API rate limits (403) during postinstall scripts
  # that download from GitHub Releases (e.g. @vscode/ripgrep).
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check-paths:
    name: Check if TUI files changed
    runs-on: ubuntu-latest
    outputs:
      tui-changed: ${{ steps.filter.outputs.tui }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            tui:
              - 'packages/tui/**'
              - 'packages/twinki/**'
              - '.github/workflows/tui.yml'

  tui-typecheck:
    name: Typecheck
    needs: check-paths
    if: needs.check-paths.outputs.tui-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      - uses: ./.github/actions/codeartifact-login
      - name: Install dependencies
        run: bun install
      - name: Build twinki package
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Typecheck
        run: bun run typecheck
        working-directory: packages/tui

  tui-lint:
    name: Lint
    needs: check-paths
    if: needs.check-paths.outputs.tui-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      - uses: ./.github/actions/codeartifact-login
      - name: Install dependencies
        run: bun install
      - name: Build twinki package
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Lint
        run: bun run lint
        working-directory: packages/tui

  tui-test:
    name: Unit Tests
    needs: check-paths
    if: needs.check-paths.outputs.tui-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      - uses: ./.github/actions/codeartifact-login
      - name: Install dependencies
        run: bun install
      - name: Build twinki package
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Run tui tests
        run: |
          set -o pipefail
          bun test 2>&1 | tee /tmp/tui-coverage.txt
          # Extract coverage from bun's "All files" line
          FUNCS=$(grep "All files" /tmp/tui-coverage.txt | awk -F'|' '{gsub(/ /,"",$2); print $2}')
          LINES=$(grep "All files" /tmp/tui-coverage.txt | awk -F'|' '{gsub(/ /,"",$3); print $3}')
          echo "Coverage — functions: ${FUNCS}%, lines: ${LINES}%"
          # Minimum thresholds — bun's "All files" includes files that
          # coveragePathIgnorePatterns excludes from the table but not the
          # summary (bun bug). Use 80% as the floor for the raw summary;
          # the real coverage of unit-testable code is 93%+.
          MIN_FUNCS=80
          MIN_LINES=80
          if [ "$(echo "$FUNCS < $MIN_FUNCS" | bc -l)" = "1" ]; then
            echo "::error::Function coverage regression! ${FUNCS}% < ${MIN_FUNCS}%"
            exit 1
          fi
          if [ "$(echo "$LINES < $MIN_LINES" | bc -l)" = "1" ]; then
            echo "::error::Line coverage regression! ${LINES}% < ${MIN_LINES}%"
            exit 1
          fi
        working-directory: packages/tui
      - name: Run vitest selector tests
        run: npx vitest run --config vitest.config.ts
        working-directory: packages/tui
      - name: Run twinki tests
        run: bun run test:run
        working-directory: packages/twinki

  tui-integ:
    name: Integration Tests (${{ matrix.os }})
    needs: check-paths
    if: needs.check-paths.outputs.tui-changed == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y -qq build-essential pkg-config jq dpkg curl wget zstd cmake clang libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev valac libibus-1.0-dev libglib2.0-dev sqlite3 libxdo-dev protobuf-compiler libfuse2 libasound2-dev

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-e2e-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-e2e-${{ runner.os }}-

      - name: Build chat_cli
        # The TUI shells out to `kiro-cli chat ...` for cross-engine
        # session listing, ensure-session, and `/chat` save/load. The
        # integ harness defaults `KIRO_CHAT_CLI_BIN` to `target/debug/chat_cli`,
        # so a built binary is a prerequisite (same as tui-e2e).
        run: cargo build -p chat_cli

      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}
      - uses: ./.github/actions/codeartifact-login
      - name: Install dependencies
        run: bun install
      - name: Build twinki package
        run: bun run build
        working-directory: packages/twinki/packages/twinki
      - name: Run integration tests
        # `test:integ` spawns chat_cli over IPC and is currently Linux-only.
        if: runner.os == 'Linux'
        run: bun run test:integ
        working-directory: packages/tui
      - name: Run ACP integration tests
        run: bun run test:acp-integ
        working-directory: packages/tui
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integ-logs-${{ matrix.os }}
          path: packages/tui/integ_tests/test-outputs/
          retention-days: 7

  tui-e2e:
    name: E2E Tests (${{ matrix.os }})
    needs: check-paths
    if: needs.check-paths.outputs.tui-changed == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-x64-latest-16-cores]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y -qq build-essential pkg-config jq dpkg curl wget zstd cmake clang libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev valac libibus-1.0-dev libglib2.0-dev sqlite3 libxdo-dev protobuf-compiler libfuse2 libasound2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-e2e-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build chat_cli
        run: cargo build -p chat_cli

      - name: Read pinned Bun version
        id: bun-ver
        run: echo "version=$(grep '^BUN_VERSION' scripts/const.py | sed 's/.*\"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.bun-ver.outputs.version }}

      - uses: ./.github/actions/codeartifact-login

      - name: Install dependencies
        run: bun install

      - name: Build twinki package
        run: bun run build
        working-directory: packages/twinki/packages/twinki

      - name: Build TUI
        run: bun run build
        working-directory: packages/tui

      - name: Run E2E tests
        run: bun test ./e2e_tests/
        working-directory: packages/tui

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.os }}
          path: packages/tui/e2e_tests/test-outputs/
          retention-days: 7

  # Gate jobs: always run so they can be set as required status checks.
  # When TUI files aren't changed the upstream jobs are skipped, but these
  # still report success — unblocking non-TUI PRs.

  tui-unit-tests-required:
    name: "TUI: Unit Tests (required)"
    if: always()
    needs: [check-paths, tui-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.tui-changed }}" != "true" ]]; then
            echo "TUI files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.tui-test.result }}" != "success" ]]; then
            echo "::error::TUI unit tests failed"
            exit 1
          fi

  tui-integ-tests-required:
    name: "TUI: Integration Tests (required)"
    if: always()
    needs: [check-paths, tui-integ]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.tui-changed }}" != "true" ]]; then
            echo "TUI files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.tui-integ.result }}" != "success" ]]; then
            echo "::error::TUI integration tests failed"
            exit 1
          fi

  tui-e2e-required:
    name: "TUI: E2E Tests (required)"
    if: always()
    needs: [check-paths, tui-e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.tui-changed }}" != "true" ]]; then
            echo "TUI files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.tui-e2e.result }}" != "success" ]]; then
            echo "::error::TUI E2E tests failed"
            exit 1
          fi

  tui-typecheck-required:
    name: "TUI: Typecheck (required)"
    if: always()
    needs: [check-paths, tui-typecheck]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.tui-changed }}" != "true" ]]; then
            echo "TUI files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.tui-typecheck.result }}" != "success" ]]; then
            echo "::error::TUI typecheck failed"
            exit 1
          fi

  tui-lint-required:
    name: "TUI: Lint (required)"
    if: always()
    needs: [check-paths, tui-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        run: |
          if [[ "${{ needs.check-paths.outputs.tui-changed }}" != "true" ]]; then
            echo "TUI files not changed — skipping"
            exit 0
          fi
          if [[ "${{ needs.tui-lint.result }}" != "success" ]]; then
            echo "::error::TUI lint failed"
            exit 1
          fi
