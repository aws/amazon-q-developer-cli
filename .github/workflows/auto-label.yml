name: "PR: Auto-Label"

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

concurrency:
  group: auto-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Classify and label PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Kiro CLI
        run: |
          curl -fsSL https://cli.kiro.dev/install | bash
          kiro-cli --version

      - name: Classify PR
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_REVIEW_PAT }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          kiro-cli chat --agent pr-classifier --no-interactive --trust-all-tools \
            "Classify PR #$PR_NUMBER in this repository."
