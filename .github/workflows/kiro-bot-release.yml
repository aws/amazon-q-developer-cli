name: kiro-bot-release

# Phase 5 of the kiro-help bot roadmap. Builds, evals, and publishes the three
# kiro-bot binaries (kiro-bot, kiro-cli, kiro-knowledge-mcp) into a single
# binary-carrier image in ECR, then writes the digest to SSM so CodeBuild can
# rebuild the runtime image and ECS can roll the service.
#
# Triggers:
#   - push to feature/kiro-bot or main, restricted to paths that affect the
#     bot binaries or the eval suite — avoids rebuilding the world on
#     unrelated kiro-cli changes.
#   - tag push matching kiro-bot-v* — promotes the digest to /prod/.

on:
  push:
    branches:
      - main
      - feature/kiro-bot
    paths:
      - 'crates/kiro-bot/**'
      - 'crates/kiro-knowledge-mcp/**'
      - 'crates/kiro-help-corpus-ingest/**'
      - 'crates/kiro-bot-eval/**'
      - 'crates/chat-cli/src/kiro_help.json'
      - 'crates/chat-cli/src/help_prompt.md'
      - 'crates/chat-cli/src/cli/agent/mod.rs'
      - '.github/workflows/kiro-bot-release.yml'
  push:
    tags:
      - 'kiro-bot-v*'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT: '551670267384'
  BINARIES_REPO: kiro-bot-binaries
  PUBLISHER_ROLE_ARN: arn:aws:iam::551670267384:role/GitHubActionsKiroBotPublisher
  TARGET: aarch64-unknown-linux-gnu

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test \
            -p kiro-bot \
            -p kiro-knowledge-mcp \
            -p kiro-help-corpus-ingest \
            -p kiro-bot-eval

  eval:
    name: Eval (RAG recall@5)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - run: |
          KB_ID=$(aws ssm get-parameter \
            --name /kiro-help-bot/alpha/kb-id \
            --query Parameter.Value --output text)
          cargo run --release -p kiro-bot-eval -- \
            --kb-id "$KB_ID" \
            --top-n 5 \
            --threshold 0.7

  build-binaries:
    name: Cross-compile ARM64 binaries
    runs-on: ubuntu-latest
    needs: eval
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
      - name: Install zig (cross-toolchain)
        uses: mlugg/setup-zig@v1
        with:
          version: 0.16.0
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild
      - name: Build
        run: |
          cargo zigbuild --release --target ${{ env.TARGET }} \
            -p kiro-bot \
            -p chat_cli \
            -p kiro-knowledge-mcp
      - name: Stage artifacts
        run: |
          mkdir -p artifacts
          cp target/${{ env.TARGET }}/release/kiro-bot           artifacts/
          cp target/${{ env.TARGET }}/release/chat_cli           artifacts/kiro-cli
          cp target/${{ env.TARGET }}/release/kiro-knowledge-mcp artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ env.TARGET }}
          path: artifacts/

  publish-image:
    name: Publish binary-carrier image
    runs-on: ubuntu-latest
    needs: build-binaries
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      stage: ${{ steps.stage.outputs.stage }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ env.TARGET }}
          path: ./artifacts
      - name: Resolve target stage
        id: stage
        run: |
          STAGE=alpha
          if [[ "${GITHUB_REF}" == refs/tags/kiro-bot-v* ]]; then STAGE=prod; fi
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
      - name: Build & push binary-carrier image
        id: push
        run: |
          chmod +x artifacts/kiro-bot artifacts/kiro-cli artifacts/kiro-knowledge-mcp
          cat > Dockerfile.carrier <<'EOF'
          FROM scratch
          COPY artifacts/kiro-bot              /usr/local/bin/kiro-bot
          COPY artifacts/kiro-cli              /usr/local/bin/kiro-cli
          COPY artifacts/kiro-knowledge-mcp    /usr/local/bin/kiro-knowledge-mcp
          EOF
          IMAGE=${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.BINARIES_REPO }}
          docker buildx build --platform linux/arm64 \
            --provenance=false \
            --push \
            -t "$IMAGE:${GITHUB_SHA}" \
            -f Dockerfile.carrier .
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.BINARIES_REPO }} \
            --image-ids imageTag=${GITHUB_SHA} \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
      - name: Write SSM digest
        run: |
          aws ssm put-parameter \
            --name /kiro-help-bot/${{ steps.stage.outputs.stage }}/binary-image-digest \
            --value '${{ steps.push.outputs.digest }}' \
            --type String --overwrite
