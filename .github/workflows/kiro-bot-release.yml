name: kiro-bot-release

# Cross-compiles the kiro-bot binaries, then builds the FINAL runtime image here
# and writes its digest to SSM at /kiro-help-bot/alpha/runtime-image-digest.
# The CDK stacks read that parameter at deploy time and own the ECS cluster,
# service, and task definition, so CloudFormation is the only writer of the
# task-def family.
#
# Alpha is the only stage this workflow publishes. There is no prod: no prod
# stack, no prod SSM parameter, and the publisher role's OIDC trust pins both
# `sub` and `ref` to refs/heads/*, so a tag could not publish even if it fired.
#
# Triggers:
#   - push to main, restricted to paths that affect the bot binaries — avoids
#     rebuilding the world on unrelated kiro-cli changes.
#   - manual dispatch — this workflow revision fails explicitly; select a
#     revision that implements the manual release jobs.

# One release at a time per ref. Without this, two overlapping runs can push
# images in one order and write the digest parameter in the other, leaving the
# parameter — and therefore the next CloudFormation deploy — on the older image.
# Never cancel-in-progress: a run cancelled between the ECR push and the SSM
# write is exactly the state this prevents.
concurrency:
  group: kiro-bot-release-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref verified by the selected manual-release workflow revision
        required: false
        type: string
      bootstrap_carrier:
        description: Ask the selected manual-release workflow revision to publish the alpha carrier
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'crates/kiro-bot/**'
      - 'crates/kiro-knowledge-mcp/**'
      - 'crates/kiro-github-mcp/**'
      - 'crates/kiro-mcp/**'
      # chat-cli ships as the `kiro-cli` binary the bot execs, so any
      # change to the ACP server, tool dispatch, agent loader, or v2
      # chat surface affects bot behavior. Broadened from the original
      # three-file allowlist to avoid the bot running on a stale binary.
      - 'crates/chat-cli/**'
      - 'crates/chat-cli-v2/**'
      # This workflow now builds the runtime image itself, so a change to the
      # workflow is a change to the release. Without this, workflow-only edits
      # are untestable.
      - '.github/workflows/kiro-bot-release.yml'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT: '551670267384'
  RUNTIME_REPO: kiro-bot
  PUBLISHER_ROLE_ARN: arn:aws:iam::551670267384:role/GitHubActionsKiroBotAlphaPublisher
  TARGET: aarch64-unknown-linux-gnu

jobs:
  reject-manual-dispatch:
    name: Reject unsupported manual release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Explain the required workflow selection
        run: |
          echo "::error title=Manual release unavailable::Select a workflow revision that implements the manual release jobs."
          exit 1

  test:
    name: Test
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # Honor the workspace's rust-toolchain.toml so the build runs on
          # the same compiler everyone else uses (1.92.0 at time of writing).
          # Without `with: toolchain:` set, this action reads the file.
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo test \
            -p kiro-bot \
            -p kiro-knowledge-mcp

  build-binaries:
    name: Cross-compile ARM64 binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct cache slot for the cross-compile target dir so it doesn't
          # churn against the host-target cache in `test`, and persists even
          # when the build step itself fails.
          shared-key: arm64-build
          cache-on-failure: true
      - name: Install zig (cross-toolchain)
        uses: mlugg/setup-zig@v1
        # Pin to a Zig release that's still on the official mirror network.
        # 0.16.0 was de-listed; the cargo-zigbuild docs recommend tracking a
        # recent stable, so we follow latest of the 0.13 line which is what
        # cargo-zigbuild's own CI uses.
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild
      - name: Build
        run: |
          cargo zigbuild --release --target ${{ env.TARGET }} \
            --no-default-features \
            --features chat_cli/legacy_codewhisperer_sink,chat_cli/legacy_toolkit_sink \
            -p kiro-bot \
            -p chat_cli \
            -p kiro-knowledge-mcp \
            -p kiro-github-mcp \
            -p kiro-mcp
      - name: Stage artifacts
        run: |
          mkdir -p artifacts artifacts/agents artifacts/kiro-help
          cp target/${{ env.TARGET }}/release/kiro-bot           artifacts/
          cp target/${{ env.TARGET }}/release/chat_cli           artifacts/kiro-cli
          cp target/${{ env.TARGET }}/release/kiro-knowledge-mcp artifacts/
          cp target/${{ env.TARGET }}/release/kiro-github-mcp    artifacts/
          cp target/${{ env.TARGET }}/release/kiro-mcp           artifacts/
          # Phase 1c-bundle ships the legacy `kiro-taskei-mcp` name as
          # a deprecated alias binary built from the same crate. Both
          # bins are emitted by `cargo build -p kiro-mcp`. Removed in
          # Phase 2.
          cp target/${{ env.TARGET }}/release/kiro-taskei-mcp    artifacts/
          # Bot-only agent definition. Not in the public chat_cli binary —
          # the runtime container drops these into ~/.kiro/agents/ so v2's
          # disk-loader picks them up when `kiro-cli acp --agent kiro-help`
          # runs. Ship the whole agents/ directory so any new prompt,
          # skill, or reference file is picked up without a workflow edit.
          cp -r crates/kiro-bot/agents/. artifacts/agents/
          # Runtime config templates -> /etc/kiro-help/ in the runtime image.
          # These stay un-substituted; docker/entrypoint.sh expands
          # ${BOT_MEMBER_ID} and ${ALLOWED_CHANNEL_ID} at container start.
          cp -r crates/kiro-bot/kiro-help/. artifacts/kiro-help/
          # The commit the container git-fetches into its worktree. Must be a
          # 40-char sha that exists on the remote: entrypoint.sh fetches it by
          # exact sha and asserts rev-parse HEAD matches, so a local-only or
          # force-pushed-away commit makes the container unbootable.
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-sha
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ env.TARGET }}
          path: artifacts/

  publish-runtime-image:
    name: Publish runtime image
    runs-on: ubuntu-latest
    needs: [build-binaries]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PUBLISHER_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ env.TARGET }}
          path: ./artifacts
      # This runner is amd64 and the image is arm64. This Dockerfile runs
      # apt-get, groupadd and chmod in the target image, so the kernel needs a
      # registered handler for aarch64 binaries.
      - uses: docker/setup-qemu-action@v3
      # Provisions the docker-container driver. Two things need it: cross-arch
      # RUN, and --provenance/--sbom, which the default `docker` driver rejects
      # unless the daemon runs the containerd image store. This is the
      # `docker buildx create --use` that build-runtime.sh had; CodeBuild also
      # ran on a native arm64 image, which GitHub-hosted ubuntu-latest is not.
      - uses: docker/setup-buildx-action@v3
      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
      - name: Build & push runtime image
        id: push
        run: |
          # Artifact download drops the exec bit. The Dockerfile's `RUN chmod
          # 0555` is what actually sets the in-image mode, so this is belt and
          # braces for anyone building from a downloaded artifact by hand.
          chmod +x artifacts/kiro-bot artifacts/kiro-cli artifacts/kiro-knowledge-mcp artifacts/kiro-github-mcp artifacts/kiro-mcp artifacts/kiro-taskei-mcp
          IMAGE=${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.RUNTIME_REPO }}
          # The kiro-bot repo is IMMUTABLE, so the tag must be unique per run
          # attempt or a re-run of the same commit fails on push.
          TAG="alpha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          # Context is the repo root: the Dockerfile needs both ./artifacts and
          # crates/kiro-bot/docker/entrypoint.sh. Provenance and SBOM carry over
          # from the CodeBuild build this replaces.
          docker buildx build --platform linux/arm64 \
            --push \
            --provenance=mode=max \
            --sbom=true \
            --build-arg SOURCE_SHA="${GITHUB_SHA}" \
            -t "$IMAGE:$TAG" \
            -f crates/kiro-bot/docker/runtime.Dockerfile \
            .
          DIGEST=$(aws ecr describe-images \
            --repository-name ${{ env.RUNTIME_REPO }} \
            --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error title=Bad runtime digest::describe-images returned '$DIGEST'"
            exit 1
          }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Verify the image ships what the bot needs
        # Asserted against the BUILT IMAGE, not by grepping source. The previous
        # version of this contract grepped this workflow for a `COPY` line; when
        # that line moved into runtime.Dockerfile the grep started failing while
        # the contract itself was still satisfied, which broke every release run
        # on main. An image assertion cannot be fooled by a file moving.
        #
        # kiro-knowledge-mcp is the compatibility case that matters: the agent
        # config no longer registers it, but the binary must stay in the image
        # until the config change has shipped everywhere.
        run: |
          IMAGE=${{ env.AWS_ACCOUNT }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.RUNTIME_REPO }}
          docker run --rm --platform linux/arm64 --entrypoint sh \
            "$IMAGE@${{ steps.push.outputs.digest }}" -c '
              set -e
              for binary in kiro-bot kiro-cli kiro-knowledge-mcp kiro-github-mcp kiro-mcp; do
                test -x "/usr/local/bin/$binary" || { echo "missing or non-executable: $binary" >&2; exit 1; }
              done
              # entrypoint.sh hard-fails without these, and a container that
              # cannot start looks identical to a bad deploy.
              test -f /etc/kiro-help/config.toml
              test -f /etc/kiro-help/policies/agents.cedar
              # The container git-fetches this sha at startup and asserts
              # rev-parse HEAD matches, so a malformed one is unbootable.
              sha=$(tr -d "\n" < /etc/kiro-help/source-sha)
              test ${#sha} -eq 40
              case "$sha" in *[!0-9a-f]*) echo "source-sha is not 40 hex: $sha" >&2; exit 1 ;; esac
            '
      - name: Write SSM runtime digest
        # Read at deploy time by stack.ts via
        # ssm.StringParameter.valueForStringParameter, so CloudFormation stays
        # the only writer of the ECS task definition.
        run: |
          aws ssm put-parameter \
            --name /kiro-help-bot/alpha/runtime-image-digest \
            --value '${{ steps.push.outputs.digest }}' \
            --type String --overwrite
