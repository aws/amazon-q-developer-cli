name: "PR: Changelog Check"

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  changelog:
    name: Changelog fragment required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip if label is present
        if: contains(github.event.pull_request.labels.*.name, 'no-changelog')
        run: echo "::notice::Changelog check skipped — 'no-changelog' label is present."

      - uses: actions/checkout@v4
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        with:
          fetch-depth: 0

      - name: Check for new changelog fragments
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        id: check
        run: |
          BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          NEW_FRAGMENTS=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- '.changes/unreleased/*.json')

          if [ -z "$NEW_FRAGMENTS" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Found new changelog fragment(s):"
            echo "$NEW_FRAGMENTS"
          fi

      - name: Lint changelog fragments
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') && steps.check.outputs.found == 'true' }}
        run: |
          BASE_SHA=$(git merge-base origin/${{ github.event.pull_request.base.ref }} HEAD)
          NEW_FRAGMENTS=$(git diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- '.changes/unreleased/*.json')
          ./scripts/lint-changelog.sh $NEW_FRAGMENTS

      - name: Note missing changelog
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changelog') && steps.check.outputs.found == 'false' }}
        run: |
          echo "::notice::No changelog fragment found. Comment \`/changelog <optional instructions>\` to generate one, or add \`no-changelog\` label to skip."
