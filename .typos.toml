[files]
extend-exclude = [
  # KRS mock (#4009): the generated Smithy server SDK carries upstream
  # codegen typos, and mock-krs-server's docs use the "mis-scripted"
  # compound the checker splits. Scope both to the crate rather than
  # weakening the global dictionary.
  "crates/amzn-kiro-runtime-service-server-sdk/",
  "crates/mock-krs-server/",
  "packages/ink/",
  "packages/twinki/",
  "docs/perf-baselines/",
  "**/__tests__/",
  "**/e2e_tests/",
  "**/tests/",
  "**/*.test.*",
  "**/*.spec.*",
  "**/fixtures/",
  # Generated from an upstream model and overwritten on regeneration.
  "crates/amzn-kiro-runtime-service-server-sdk/src/model.rs"
]

[default]
extend-ignore-re = [
  # Commit SHAs (hex strings of 7+ chars)
  "\\b[0-9a-f]{7,40}\\b",
]

[default.extend-identifiers]
PNGf = "PNGf" # AppleScript clipboard class name «class PNGf»
TKE = "TKE" # fictional ticket-ID prefix used in kiro-help-bot examples

[default.extend-words]
mmaped = "mmaped"
caf = "caf" # used in chat tools test
braket = "braket" # AWS Braket quantum computing service
nd = "nd" # ndjson (newline-delimited JSON)
hel = "hel" # used in test data
isues = "isues" # intentional typo in agent-configuration.md example
unparseable = "unparseable" # valid word in LLM dictionary
