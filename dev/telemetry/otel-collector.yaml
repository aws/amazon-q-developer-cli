receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  deltatocumulative: {}
  transform/resource_labels:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["service_version"], resource.attributes["service.version"])
          - set(attributes["os_type"], resource.attributes["os.type"]) where attributes["os_type"] == nil
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:9464
  debug:
    verbosity: detailed

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [deltatocumulative, transform/resource_labels, batch]
      exporters: [prometheus, debug]
