apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: true
    jsonData:
      timeout: 30
      maxLines: 5000
      # Surface and auto-run the log-volume histogram in Explore.
      enableLogsVolume: true
