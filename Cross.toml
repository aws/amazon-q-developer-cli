# Pin cross Docker images to SHA digests to prevent upstream glibc bumps.
# The :main tag is mutable — cross-rs periodically rebuilds images with newer
# Ubuntu bases. Without pinning, a rebuild can silently raise the minimum glibc
# of our output binaries (see P464326498).
#
# To update: pull the new :main image, verify the cross-compiled binary shows
# max GLIBC_2.34 with `objdump -T`, then replace the digest here.
[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main@sha256:73811f43949215c88456a311970037a34f3f89f6486cfbcf61d8fe5379a9517e"

[build]
pre-build = ["apt-get update && apt-get --assume-yes install unzip zsh libclang-dev libssl-dev pkg-config"]

[build.env]
passthrough = [
    "KIRO_VERSION",
    "AMAZON_Q_BUILD_TARGET_TRIPLE",
    "AMAZON_Q_BUILD_VARIANT",
    "AMAZON_Q_BUILD_HASH",
    "AMAZON_Q_BUILD_DATETIME",
    "Q_TELEMETRY_CLIENT_ID",
    "BUN_EXECUTABLE_PATH",
    "BUN_EXECUTABLE_PATH_X86_64",
    "BUN_EXECUTABLE_PATH_AARCH64",
    "BUN_RUNTIME_SHA256",
    "BUN_RUNTIME_SHA256_X86_64",
    "BUN_RUNTIME_SHA256_AARCH64",
    "TUI_JS_PATH",
    "TUI_JS_SHA256",
    "DISABLE_V2_BUN",
    "NODE_EXECUTABLE_PATH",
    "NODE_EXECUTABLE_PATH_X86_64",
    "NODE_EXECUTABLE_PATH_AARCH64",
    "NODE_RUNTIME_SHA256",
    "NODE_RUNTIME_SHA256_X86_64",
    "NODE_RUNTIME_SHA256_AARCH64",
    "KAS_BUNDLE_PATH",
    "KAS_BUNDLE_SHA256",
]
