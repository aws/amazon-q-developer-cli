[test]
root = "src"
coverage = true
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
# Concurrency caps live on the package.json `test*` scripts as `--parallel`
# and `--max-concurrency` flags — Bun does not honor these as bunfig keys.

# Coverage exclusions — keep in sync with coverage-config.json (source of truth).
# Excluded categories:
# 1. Build artifacts, test infrastructure, deprecated code
# 2. acp-client.ts — bun's query-string import isolation prevents coverage
#    merging across test files. Tested in isolation at 63%.
# 3. React components/hooks — require jsdom environment (tested via vitest)
# 4. Platform-dependent utilities that require TTY/process spawning
coveragePathIgnorePatterns = [
  "**/dist/**",
  "**/node_modules/**",
  "**/ink/**",
  "**/renderer.ts",
  "**/test-utils/**",
  "**/e2e_tests/**",
  "**/__tests__/**",
  "**/storybook/**",
  "**/coverage-preload*",
  "**/acp-client.ts",
  "**/components/**",
  "**/hooks/**",
  "**/selectors.ts",
  "**/ThemeProvider.tsx",
  "**/UserThemeBridge.tsx",
  "**/syntax-highlight.ts",
  "**/git.ts",
  "**/open-transcript.ts",
  "**/acp-recorder.ts",
  "**/clipboard-image.ts",
]

# e2e_tests/preload.ts rebuilds dist/tui.js before E2E test runs.
# For comprehensive coverage with zero-coverage visibility, run with:
#   bun test --preload ./src/test-utils/coverage-preload.ts
preload = ["./e2e_tests/preload.ts"]
