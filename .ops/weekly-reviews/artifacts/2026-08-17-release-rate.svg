<!-- Derived from successful public CloudFront production promotions bucketed by 09:30 America/Los_Angeles handoffs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Stable release rate for the four weeks ending August 17, 2026</title>
  <desc id="desc">Four promotion-backed weekly counts were four, four, two, and three, averaging 3.25 releases per week; prior tag-based charts are not directly comparable.</desc>
  <rect width="640" height="300" fill="#19161D" rx="8"/>
  <text x="32" y="36" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="600">Stable releases per oncall week</text>
  <text x="32" y="58" fill="#938f9b" font-family="sans-serif" font-size="12">Trailing average: 3.3/week</text>
  <line x1="56" y1="236" x2="608" y2="236" stroke="#938f9b" stroke-width="1"/>
  <rect x="90" y="116" width="76" height="120" rx="4" fill="#a566ff"/>
  <rect x="224" y="116" width="76" height="120" rx="4" fill="#a566ff"/>
  <rect x="358" y="176" width="76" height="60" rx="4" fill="#a566ff"/>
  <rect x="492" y="146" width="76" height="90" rx="4" fill="#a566ff"/>
  <g fill="#ffffff" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="128" y="108">4</text><text x="262" y="108">4</text><text x="396" y="168">2</text><text x="530" y="138">3</text>
  </g>
  <g fill="#938f9b" font-family="sans-serif" font-size="12" text-anchor="middle">
    <text x="128" y="258">07/27</text><text x="262" y="258">08/03</text><text x="396" y="258">08/10</text><text x="530" y="258">08/17</text>
  </g>
  <text x="32" y="286" fill="#938f9b" font-family="sans-serif" font-size="11">Four promotion-backed weeks; prior tag-based charts are not directly comparable</text>
</svg>
