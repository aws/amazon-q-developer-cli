attributes:
  - name: version_full
    description: Full CLI version, including nightly or prerelease suffixes.
    cloudwatch_cardinality_hint: 35
  - name: session_interface
    description: Interface through which the agent session is used.
    allowed_values: [interactive_cli, noninteractive_cli, external_acp]
  - name: acp_client_name
    description: Sanitized name reported by an ACP client, capped at 64 characters.
  - name: agent_engine
    description: Agent runtime responsible for the measured operation.
    allowed_values: [v1, v2, v3, unknown]
  - name: os_type
    description: Operating-system family running the CLI process.
    allowed_values: [linux, macos, windows, unknown]
  - name: auth_method
    description: Identity provider used by an explicit login flow.
    allowed_values: [builder_id, identity_center, social, external_idp, unknown]
  - name: auth_flow
    description: Protocol used to complete an explicit login flow.
    allowed_values: [pkce, device_code, not_applicable, unknown]
  - name: agent_mode
    description: Product-defined agent mode active for the session or turn.
    allowed_values: [default, plan, spec, autonomous, custom]
  - name: cloud_event
    description: Lifecycle transition observed for a cloud development session.
    allowed_values: [created, create_failed, ready, provision_failed, reattached, detached, turned_off, fell_back_local, unknown]
  - name: autonomous_event
    description: Terminal result of an autonomous-mode transition.
    allowed_values: [enabled, disabled, switch_failed, reverted, unknown]
  - name: cloud_op
    description: Cloud operation that produced a client-observed failure.
    allowed_values: [session_new, session_load, turn_stream, source_providers_list, source_providers_resources, list_sessions, delete_session, unknown]
  - name: cloud_error_kind
    description: Bounded client-observed class of a cloud operation failure.
    allowed_values: [throttling, auth, version_skew, not_found, network, timeout, stream_truncated, server_error, other, unknown]
  - name: attach_kind
    description: Content class of a file attached to a cloud prompt.
    allowed_values: [image, document, text, binary, unknown]
  - name: attach_size_bucket
    description: Decoded size range of a file attached to a cloud prompt.
    allowed_values: [under_64k, under_1m, under_5m, over_5m, unknown]
  - name: repo_attach_event
    description: Funnel transition in the cloud repository picker.
    allowed_values: [opened, submitted, unknown]
  - name: repo_count_bucket
    description: Bounded count of repositories selected for a cloud session.
    allowed_values: [none, "1", "2", "3_5", "6_plus", unknown]
  - name: config_category
    description: Config category viewed through the /config panel.
    allowed_values: [menu, agents, mcp, powers, steering, skills, hooks, env, unknown]
  - name: diagnostic_severity
    description: Severity of a cloud-config sync diagnostic pushed by the agent.
    allowed_values: [error, warning, info, unknown]
  - name: config_surface
    description: Configuration surface on which a cloud-sourced resource was observed.
    allowed_values: [mcp, steering, hooks, powers, unknown]
  - name: workflow_run_event
    description: Client-observed workflow lifecycle transition.
    allowed_values: [started, paused, completed, failed, aborted]
  - name: workflow_outcome
    description: Terminal result of a workflow run.
    allowed_values: [completed, failed, aborted, _other_]
  - name: workflow_topology
    description: Static composition of executable workflow nodes.
    allowed_values: [sequential, parallel, iterative, watch, mixed, _other_]
  - name: workflow_step_bucket
    description: Bounded count of declared executable leaf steps.
    allowed_values: ["1", "2", "3_5", "6_10", "11_plus", _other_]
  - name: workflow_node_type
    description: Node kind from the typed workflow contract.
    allowed_values: [step, sequence, repeat, parallel, watch]
  - name: workflow_node_outcome
    description: Node lifecycle status from the typed workflow contract.
    allowed_values: [pending, running, paused, completed, failed, aborted, skipped]
  - name: workflow_control_action
    description: User-facing workflow control operation.
    allowed_values: [pause, resume, cancel, retry, message]
  - name: workflow_control_result
    description: Client-observed result of a workflow control operation.
    allowed_values: [success, failed]
  - name: workflow_restore_result
    description: Client-observed result of restoring a persisted workflow.
    allowed_values: [restored, discovery_failed, load_failed, rejected, _other_]
  - name: ui_mode
    description: First-party interactive layout selected at session start.
    allowed_values: [tui, lite, unknown]
  - name: release_channel
    description: Release channel derived from the full CLI version.
    allowed_values: [stable, nightly, beta, unknown]
  - name: install_method
    description: Installation mechanism known from a trusted local receipt.
    allowed_values: [brew, internal_toolbox, unknown]
  - name: slash_command
    description: Canonical recognized slash-command family.
    allowed_values:
      - /agent
      - /autonomous
      - /changelog
      - /chat
      - /checkpoint
      - /clear
      - /code
      - /compact
      - /config
      - /context
      - /context-gatherer
      - /copy
      - /custom
      - /disconnect
      - /editor
      - /effort
      - /exit
      - /experiment
      - /feedback
      - /general-task-execution
      - /goal
      - /guide
      - /help
      - /hooks
      - /issue
      - /knowledge
      - /lite
      - /load
      - /logdump
      - /mcp
      - /memories
      - /model
      - /paste
      - /plan
      - /prompt
      - /prompts
      - /quit
      - /reply
      - /repo
      - /rewind
      - /save
      - /session-id
      - /sessions
      - /settings
      - /skill
      - /spawn
      - /spec
      - /stats
      - /steering
      - /switch
      - /tangent
      - /theme
      - /title
      - /todos
      - /tools
      - /transcript
      - /tui
      - /upgrade-agent
      - /usage
      - /verbosity
      - /voice
      - /workflow
      - /workflow-cancel
      - /workflow-resume
      - /workflow-run
      - /workflow-status
      - /workflows
  - name: top_level_command
    description: Canonical recognized top-level CLI command.
    allowed_values:
      - agent
      - chat
      - completion
      - doctor
      - help
      - issue
      - login
      - logout
      - mcp
      - profile
      - settings
      - unknown
      - update
      - version
  - name: tool_origin
    description: Subsystem that supplied a tool executed by the agent.
    allowed_values: [builtin, mcp, unknown]
  - name: builtin_tool_name
    description: Canonical cross-engine identity of a Kiro-provided built-in tool.
    allowed_values:
      - fs_read
      - fs_write
      - execute_bash
      - summary
      - grep
      - glob
      - use_aws
      - web_fetch
      - web_search
      - code
      - use_subagent
      - session
      - switch_to_execution
      - introspect
      - knowledge
      - tool_search
      - task
      - goal
      - unknown
  - name: tool_outcome
    description: Terminal result of one attempted tool execution.
    allowed_values: [success, error, denied, cancelled, unknown]
  - name: execution_context
    description: Whether a tool was invoked by the main agent or a subagent.
    allowed_values: [main, subagent]
  - name: model
    description: Canonical model identifier supplied by the trusted agent or model service.
    cloudwatch_cardinality_hint: 12
  - name: model_request_outcome
    description: Terminal result of one logical model request.
    allowed_values: [success, failure, cancelled, unknown]
  - name: run_outcome
    description: Launcher-observed terminal result of one top-level CLI process invocation; nonzero command or child exits are failures, not crash inference.
    allowed_values: [success, user_interrupt, failure, unknown]
  - name: process_role
    description: Process in the agent process tree that owns an observation.
    allowed_values: [host, tui, kas_subprocess]
  - name: crash_kind
    description: Durable client-observable class of an abnormal process termination.
    allowed_values: [panic, unclean_exit, unknown]
  - name: error_kind
    description: Typed coarse cause of a failed logical model request.
    allowed_values: [throttling, context_limit, timeout, connection, server_error, access_denied, invalid_request, empty_response, refusal, unknown]
  - name: token_type
    description: Service-reported token category.
    allowed_values: [input_uncached, input_cache_read, output, reasoning]
  - name: mcp_server_source
    description: Configuration layer that supplied an MCP server.
    allowed_values: [registry, global, workspace, agent, acp_injected, unknown]
  - name: mcp_server_name
    description: Raw configured MCP server identity retained only for EMF diagnostics.
    metric_allowed: true
  - name: mcp_init_outcome
    description: Availability of an MCP server after initialization.
    allowed_values: [success, failure, unknown]
  - name: goal_outcome
    description: Observed terminal result of an explicit goal workflow.
    allowed_values: [completed, cancelled, iteration_limit, dispatch_failure, reinjection_failure, agent_error, unknown]
  - name: drop_reason
    description: Typed point at which telemetry records became permanently undeliverable.
    allowed_values: [oversize, invalid_record, encoding_failure, retry_exhausted, permanent_rejection, unknown]
  - name: turn_failure_reason
    description: Typed terminal cause of a failed user turn.
    allowed_values: [context_limit, timeout, model_error, tool_error, execution_limit, internal_error, unknown]
  - name: render_kind
    description: Whether Twinki performed a differential or full-screen render.
    allowed_values: [partial, full]
  - name: auth_operation
    description: Authentication lifecycle operation that failed.
    allowed_values: [login, refresh]
  - name: auth_failure_reason
    description: Typed terminal cause of a failed authentication operation.
    allowed_values: [authorization_denied, invalid_or_expired_credential, network, timeout, service_error, configuration, storage, identity_mismatch, unknown]
