mappings:
  - event_type: UserLoggedIn
    legacy_metric: codewhispererterminal_userLoggedIn
    otel_metric: kiro_cli_user_logged_in_total
    parity_tolerance: daily_aggregate
  - event_type: AuthFailed
    legacy_metric: codewhispererterminal_authFailed
    otel_metric: kiro_cli_auth_credential_failure_total
    parity_tolerance: low_volume
  - event_type: CliSubcommandExecuted
    legacy_metric: codewhispererterminal_cliSubcommandExecuted
    otel_metric: kiro_cli_feature_used_total
    parity_tolerance: low_volume
  - event_type: ChatSlashCommandExecuted
    legacy_metric: codewhispererterminal_chatSlashCommandExecuted
    otel_metric: kiro_cli_slash_command_invoked_total
    parity_tolerance: low_volume
  - event_type: ChatStart
    legacy_metric: amazonq_startChat
    otel_metric: kiro_cli_chat_session_started_total
    parity_tolerance: high_volume
  - event_type: ChatEnd
    legacy_metric: amazonq_endChat
    otel_metric: kiro_cli_conversation_completed_total
    parity_tolerance: high_volume
  - event_type: ChatAddedMessage
    legacy_metric: codewhispererterminal_addChatMessage
    otel_metric: kiro_cli_chat_messages_total
    parity_tolerance: high_volume
  - event_type: RecordUserTurnCompletion
    legacy_metric: codewhispererterminal_recordUserTurnCompletion
    otel_metric: kiro_cli_user_turns
    parity_tolerance: high_volume
  - event_type: TangentModeSession
    legacy_metric: codewhispererterminal_chatSlashCommandExecuted
    otel_metric: kiro_cli_slash_command_invoked_total
    parity_tolerance: low_volume
  - event_type: ToolUseSuggested
    legacy_metric: codewhispererterminal_toolUseSuggested
    otel_metric: kiro_cli_tool_call_total
    parity_tolerance: low_volume
  - event_type: McpServerInit
    legacy_metric: codewhispererterminal_mcpServerInit
    otel_metric: kiro_cli_mcp_server_init_total
    parity_tolerance: low_volume
  - event_type: AgentConfigInit
    legacy_metric: codewhispererterminal_agentConfigInit
    otel_metric: kiro_cli_agent_config_init_total
    parity_tolerance: low_volume
  - event_type: DidSelectProfile
    legacy_metric: amazonq_didSelectProfile
    otel_metric: kiro_cli_profile_selection_total
    parity_tolerance: low_volume
  - event_type: ProfileState
    legacy_metric: amazonq_profileState
    otel_metric: kiro_cli_profile_state_total
    parity_tolerance: low_volume
  - event_type: MessageResponseError
    legacy_metric: amazonq_messageResponseError
    otel_metric: kiro_cli.bedrock.request.errors
    parity_tolerance: high_volume
  - event_type: DailyHeartbeat
    legacy_metric: amazonqcli_dailyHeartbeat
    otel_metric: kiro_cli_daily_heartbeat
    parity_tolerance: daily_aggregate
  - event_type: SubagentInvocation
    legacy_metric: kirocli_subagentInvocation
    otel_metric: kiro_cli_subagent_delegations_total
    parity_tolerance: low_volume
  - event_type: VoiceInput
    legacy_metric: kirocli_voiceInput
    otel_metric: kiro_cli_voice_input_total
    parity_tolerance: low_volume
  - event_type: AgentContribution
    legacy_metric: codewhispererterminal_agentContribution
    otel_metric: kiro_cli_agent_contribution_total
    parity_tolerance: high_volume
  - event_type: ProcessHealthMetric
    legacy_metric: codewhispererterminal_processHealthSnapshot
    otel_metric: kiro_cli.process.memory.rss
    parity_tolerance: low_volume
  - event_type: ModeChanged
    legacy_metric: codewhispererterminal_modeChanged
    otel_metric: kiro_cli_mode_active_total
    parity_tolerance: daily_aggregate
  - event_type: GoalCompleted
    legacy_metric: kirocli_goalCompleted
    otel_metric: kiro_cli_session_outcome_total
    parity_tolerance: low_volume

critical_alarms:
  - name: QCLI-FirstTokenLatency
    legacy_metric: timeToFirstChunk
    otel_metric: kiro_cli.bedrock.stream.ttft
    parity_tolerance: high_volume
  - name: QCLI-SuccessRateDown
    legacy_metric: chatResponseSucceeded
    otel_metric: kiro_cli.slo.success_rate
    parity_tolerance: high_volume
  - name: QCLIRTSCallSuccessRate
    legacy_metric: rtsCallSucceeded
    otel_metric: kiro_cli.bedrock.request.duration
    parity_tolerance: high_volume
  - name: QCLIFaultCount
    legacy_metric: serviceFault
    otel_metric: kiro_cli.bedrock.request.errors
    parity_tolerance: low_volume
  - name: QCLIErrorCount
    legacy_metric: serviceError
    otel_metric: kiro_cli.bedrock.request.errors
    parity_tolerance: low_volume
