metrics:
  - name: kiro_cli_run_started_total
    description: CLI process invocations that initialized enough to identify their interface and agent engine.
    dashboard: true
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, session_interface, agent_engine, os_type]
    cloudwatch_dimensions: [version_full, session_interface, agent_engine, os_type]
  - name: kiro_cli_login_success_total
    description: Explicit login flows that completed and stored usable credentials.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, auth_method, auth_flow]
    cloudwatch_dimensions: [version_full, auth_method, auth_flow]
  - name: kiro_cli_chat_session_started_total
    description: Chat sessions created or loaded by a first-party client or external ACP caller.
    dashboard: true
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, session_interface, agent_mode, agent_engine, trust_posture]
    cloudwatch_dimensions: [version_full, session_interface, agent_mode, agent_engine]
  - name: kiro_cli_cloud_session_lifecycle_total
    description: Cloud development session lifecycle transitions observed by the CLI.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, cloud_event]
    cloudwatch_dimensions: [version_full, cloud_event]
  - name: kiro_cli_cloud_session_ready_seconds
    description: Time from cloud session creation until the session became ready.
    kind: histogram
    unit: s
    priority: P1
    temporality: delta
    attributes: [version_full]
    cloudwatch_dimensions: [version_full]
  - name: kiro_cli_autonomous_mode_total
    description: Autonomous-mode lifecycle transitions requested through the KAS client.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, autonomous_event, agent_engine]
    cloudwatch_dimensions: [version_full, autonomous_event, agent_engine]
  - name: kiro_cli_cloud_repo_attach_total
    description: Cloud repository picker opens and submissions, with selected repository counts bucketed.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, repo_attach_event, repo_count_bucket, agent_engine]
    cloudwatch_dimensions: [version_full, repo_attach_event, repo_count_bucket, agent_engine]
  - name: kiro_cli_cloud_error_total
    description: Failed cloud operations grouped by operation and bounded error class.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, cloud_op, cloud_error_kind, agent_engine]
    cloudwatch_dimensions: [version_full, cloud_op, cloud_error_kind, agent_engine]
  - name: kiro_cli_cloud_attach_total
    description: Files attached to cloud prompts grouped by content kind and decoded-size bucket.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, attach_kind, attach_size_bucket, agent_engine]
    cloudwatch_dimensions: [version_full, attach_kind, attach_size_bucket, agent_engine]
  - name: kiro_cli_config_panel_total
    description: Views of the /config panel grouped by the config category opened.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, config_category]
    cloudwatch_dimensions: [version_full, agent_engine, config_category]
  - name: kiro_cli_cloud_config_diagnostic_total
    description: Cloud-config sync diagnostics received in agent diagnostics pushes, grouped by severity.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, diagnostic_severity]
    cloudwatch_dimensions: [version_full, agent_engine, diagnostic_severity]
  - name: kiro_cli_cloud_config_source_total
    description: Sessions that observed cloud-sourced configuration, counted once per session per surface.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, config_surface]
    cloudwatch_dimensions: [version_full, agent_engine, config_surface]
  - name: kiro_cli_workflow_run_total
    description: Client-observed workflow lifecycle transitions grouped by static topology and executable step count.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, workflow_run_event, workflow_topology, workflow_step_bucket, agent_engine]
    cloudwatch_dimensions: [version_full, workflow_run_event, workflow_topology, workflow_step_bucket, agent_engine]
  - name: kiro_cli_workflow_run_duration_seconds
    description: Client-observed terminal workflow duration grouped by outcome, topology, and executable step count.
    kind: histogram
    unit: s
    priority: P1
    temporality: delta
    attributes: [version_full, workflow_outcome, workflow_topology, workflow_step_bucket, agent_engine]
    cloudwatch_dimensions: [version_full, workflow_outcome, workflow_topology, workflow_step_bucket, agent_engine]
  - name: kiro_cli_workflow_node_total
    description: Client-observed workflow node lifecycle transitions grouped by typed node kind and outcome.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, workflow_node_type, workflow_node_outcome, agent_engine]
    cloudwatch_dimensions: [version_full, workflow_node_type, workflow_node_outcome, agent_engine]
  - name: kiro_cli_workflow_node_duration_seconds
    description: Client-observed terminal workflow node duration grouped by typed node kind and outcome.
    kind: histogram
    unit: s
    priority: P1
    temporality: delta
    attributes: [version_full, workflow_node_type, workflow_node_outcome, agent_engine]
    cloudwatch_dimensions: [version_full, workflow_node_type, workflow_node_outcome, agent_engine]
  - name: kiro_cli_workflow_control_total
    description: Client-observed workflow control attempts grouped by bounded action and result.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, workflow_control_action, workflow_control_result, agent_engine]
    cloudwatch_dimensions: [version_full, workflow_control_action, workflow_control_result, agent_engine]
  - name: kiro_cli_workflow_restore_total
    description: Client-observed workflow restoration attempts grouped by bounded result.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, workflow_restore_result, agent_engine]
    cloudwatch_dimensions: [version_full, workflow_restore_result, agent_engine]
  - name: kiro_cli_workflow_concurrent_runs
    description: Client-observed count of running and paused workflows after a live lifecycle transition.
    kind: observable_gauge
    unit: "1"
    priority: P1
    temporality: cumulative
    attributes: [version_full, agent_engine]
    cloudwatch_dimensions: [version_full, agent_engine]
  - name: kiro_cli_ui_mode_session_started_total
    description: First-party interactive sessions started in each TUI layout.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, ui_mode]
    cloudwatch_dimensions: [version_full, ui_mode]
  - name: kiro_cli_session_dashboard_total
    description: Session dashboard visits grouped by terminal outcome, discovery path, entry point, and selected agent engine.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, outcome, via, entry]
    cloudwatch_dimensions: [version_full, agent_engine, outcome, via, entry]
  - name: kiro_cli_daily_heartbeat
    description: At-most-daily active installation heartbeat for the emitted full version.
    dashboard: true
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, release_channel, os_type, install_method]
    cloudwatch_dimensions: [version_full, release_channel, os_type, install_method]
  - name: kiro_cli_slash_command_invoked_total
    description: Recognized slash-command invocation attempts.
    dashboard: true
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, agent_engine, slash_command]
    cloudwatch_dimensions: [version_full, agent_engine, slash_command]
  - name: kiro_cli_top_level_command_invoked_total
    description: Recognized top-level CLI command invocation attempts.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, top_level_command]
    cloudwatch_dimensions: [version_full, top_level_command]
  - name: kiro_cli_tool_call_total
    description: Attempted tool executions and their terminal outcomes.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    # approval_path and path_scope are attributes only, deliberately not
    # cloudwatch_dimensions: promoting them would multiply the existing series for a
    # breakdown no dashboard needs yet. They still reach the EMF records, so query them
    # in Logs Insights. See docs/design/kuts-metric-dimension-review.md before promoting.
    attributes: [version_full, agent_engine, tool_origin, builtin_tool_name, tool_outcome, execution_context, approval_path, path_scope]
    cloudwatch_dimensions: [version_full, agent_engine, tool_origin, builtin_tool_name, tool_outcome, execution_context]
  - name: kiro_cli_model_invocations_total
    description: Logical model requests initiated by an agent loop, excluding transport retries.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, agent_engine, model]
    cloudwatch_dimensions: [version_full, agent_engine, model]
  - name: kiro_cli_model_time_to_first_content_ms
    description: Time from a logical model request until its first meaningful content arrived.
    dashboard: true
    kind: histogram
    unit: ms
    priority: P0
    temporality: delta
    attributes: [version_full, agent_engine, model]
    cloudwatch_dimensions: [version_full, agent_engine, model]
  - name: kiro_cli_time_to_first_visible_response_ms
    description: Time from prompt submission until a first-party client rendered meaningful agent output.
    kind: histogram
    unit: ms
    priority: P0
    temporality: delta
    attributes: [version_full, session_interface, agent_mode, agent_engine]
    cloudwatch_dimensions: [version_full, session_interface, agent_mode, agent_engine]
  - name: kiro_cli_model_request_duration_seconds
    description: End-to-end duration of one logical model request, including internal transport retries.
    kind: histogram
    unit: s
    priority: P0
    temporality: delta
    attributes: [version_full, agent_engine, model, model_request_outcome]
    cloudwatch_dimensions: [version_full, agent_engine, model, model_request_outcome]
  - name: kiro_cli_user_turn_duration_seconds
    description: Time from prompt submission until the user turn reached a terminal state.
    kind: histogram
    unit: s
    priority: P0
    temporality: delta
    attributes: [version_full, session_interface, agent_mode, agent_engine]
    cloudwatch_dimensions: [version_full, session_interface, agent_mode, agent_engine]
  - name: kiro_cli_run_outcome_total
    description: Launcher-observed terminal outcomes of top-level CLI process invocations, including nonzero child or command exits as failures.
    dashboard: true
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, session_interface, agent_engine, os_type, run_outcome]
    cloudwatch_dimensions: [version_full, session_interface, agent_engine, os_type, run_outcome]
  - name: kiro_cli_crash_total
    description: Abnormal process terminations recovered from durable crash receipts or panic hooks.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, agent_engine, os_type, process_role, crash_kind]
    cloudwatch_dimensions: [version_full, agent_engine, os_type, process_role, crash_kind]
  - name: kiro_cli_startup_duration_seconds
    description: Time from process launch until the selected interface could accept a user prompt.
    kind: histogram
    unit: s
    priority: P0
    temporality: delta
    attributes: [version_full, session_interface, agent_engine, os_type]
    cloudwatch_dimensions: [version_full, session_interface, agent_engine, os_type]
  - name: kiro_cli_model_request_failure_total
    description: Logical model requests that terminated with a typed client-observed failure.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, agent_engine, model, error_kind]
    cloudwatch_dimensions: [version_full, agent_engine, model, error_kind]
  - name: kiro_cli_stream_stall_total
    description: Stream-idle watchdog observations of a stalled response stream, by tier.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, model, stall_tier, session_interface, acp_client]
    cloudwatch_dimensions: [version_full, agent_engine, model, stall_tier, session_interface, acp_client]
  - name: kiro_cli_stream_stall_idle_seconds
    description: Observed inter-event silent gap when a stream-stall episode ended.
    kind: histogram
    unit: s
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, model, stall_episode_end, session_interface, acp_client]
    cloudwatch_dimensions: [version_full, agent_engine, model, stall_episode_end, session_interface, acp_client]
  - name: kiro_cli_stream_stall_retry_total
    description: Terminal outcomes of bounded stall-continuation retry sequences.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, model, retry_outcome, attempt_number_bucket, partial_output, session_interface, acp_client]
    cloudwatch_dimensions: [version_full, agent_engine, model, retry_outcome, attempt_number_bucket, partial_output, session_interface, acp_client]
  - name: kiro_cli_stream_stall_recovery_seconds
    description: Time from a hard stall cancel until the retried stream produced its first event.
    kind: histogram
    unit: s
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, model, session_interface, acp_client]
    cloudwatch_dimensions: [version_full, agent_engine, model, session_interface, acp_client]
  - name: kiro_cli_subagent_deadline_expired_total
    description: Subagent stages cancelled because the overall subagent deadline expired.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, deadline_seconds_bucket]
    cloudwatch_dimensions: [version_full, agent_engine, deadline_seconds_bucket]
  - name: kiro_cli_transient_retry_total
    description: Agent-layer retries of transient backend failures (throttle/5xx/network) after a backoff.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, model, transient_class, attempt_number_bucket, partial_output, session_interface, acp_client]
    cloudwatch_dimensions: [version_full, agent_engine, model, transient_class, attempt_number_bucket, partial_output, session_interface, acp_client]
  - name: kiro_cli_process_memory_rss_bytes
    description: Periodic resident-set-size observations for CLI process roles.
    dashboard: true
    kind: observable_gauge
    unit: By
    priority: P1
    temporality: cumulative
    attributes: [version_full, os_type, agent_engine, process_role]
    cloudwatch_dimensions: [version_full, os_type, agent_engine, process_role]
  - name: kiro_cli_process_cpu_utilization_ratio
    description: CPU time consumed divided by elapsed wall time for each sampling window.
    dashboard: true
    kind: histogram
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, os_type, agent_engine, process_role]
    cloudwatch_dimensions: [version_full, os_type, agent_engine, process_role]
  - name: kiro_cli_process_open_file_descriptor_count
    description: Periodic open file descriptor count on supported operating systems.
    kind: observable_gauge
    unit: "1"
    priority: P1
    temporality: cumulative
    attributes: [version_full, os_type, agent_engine, process_role]
    cloudwatch_dimensions: [version_full, os_type, agent_engine, process_role]
  - name: kiro_cli_process_handle_count
    description: Periodic Windows process handle count.
    kind: observable_gauge
    unit: "1"
    priority: P1
    temporality: cumulative
    attributes: [version_full, agent_engine, process_role]
    cloudwatch_dimensions: [version_full, agent_engine, process_role]
  - name: kiro_cli_process_thread_count
    description: Periodic native thread count for CLI process roles.
    kind: observable_gauge
    unit: "1"
    priority: P1
    temporality: cumulative
    attributes: [version_full, os_type, agent_engine, process_role]
    cloudwatch_dimensions: [version_full, os_type, agent_engine, process_role]
  - name: kiro_cli_tokens_consumed
    description: Service-reported token consumption by canonical model and token category.
    kind: counter
    unit: tokens
    priority: P0
    temporality: delta
    attributes: [version_full, agent_engine, model, token_type]
    cloudwatch_dimensions: [version_full, agent_engine, model, token_type]
  - name: kiro_cli_credits_consumed
    description: Service-reported credit consumption by canonical model.
    kind: counter
    unit: credit
    priority: P1
    temporality: delta
    attributes: [version_full, model]
    cloudwatch_dimensions: [version_full, model]
  - name: kiro_cli_tool_execution_duration_ms
    description: Measured execution duration of completed tool calls.
    kind: histogram
    unit: ms
    priority: P0
    temporality: delta
    # approval_path and path_scope are attributes only, deliberately not
    # cloudwatch_dimensions: promoting them would multiply the existing series for a
    # breakdown no dashboard needs yet. They still reach the EMF records, so query them
    # in Logs Insights. See docs/design/kuts-metric-dimension-review.md before promoting.
    attributes: [version_full, agent_engine, tool_origin, builtin_tool_name, tool_outcome, execution_context, approval_path, path_scope]
    cloudwatch_dimensions: [version_full, agent_engine, tool_origin, builtin_tool_name, tool_outcome, execution_context]
  - name: kiro_cli_mcp_server_init_total
    description: Terminal MCP server initialization outcomes; OAuth-required is intermediate and is counted only when initialization later succeeds or fails.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, mcp_server_source, mcp_init_outcome, mcp_server_name]
    cloudwatch_dimensions: [version_full, agent_engine, mcp_server_source, mcp_init_outcome]
  - name: kiro_cli_mcp_tools_token_count_estimate
    description: Estimated token footprint of raw tool specifications advertised by a successfully initialized MCP server.
    kind: histogram
    unit: tokens
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, mcp_server_source, mcp_server_name]
    cloudwatch_dimensions: [version_full, agent_engine, mcp_server_source]
  - name: kiro_cli_acp_method_invocations_total
    description: Supported inbound ACP extension request attempts counted before parameter decoding, grouped in EMF by client and method. For completed-request success rate divide by kiro_cli_acp_method_outcome_total, not this counter.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, session_interface, agent_engine, acp_method, acp_client_name]
    cloudwatch_dimensions: [version_full, session_interface, agent_engine]
  - name: kiro_cli_acp_method_outcome_total
    description: Terminal outcomes of supported inbound ACP extension requests grouped in EMF by client and method. Unknown means a claimed request was abandoned without a response.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, session_interface, agent_engine, acp_method, acp_client_name, acp_method_outcome]
    cloudwatch_dimensions: [version_full, session_interface, agent_engine, acp_method_outcome]
  - name: kiro_cli_acp_method_duration_ms
    description: End-to-end dispatch duration of supported inbound ACP extension requests, split by terminal outcome.
    kind: histogram
    unit: ms
    priority: P1
    temporality: delta
    attributes: [version_full, session_interface, agent_engine, acp_method, acp_client_name, acp_method_outcome]
    cloudwatch_dimensions: [version_full, session_interface, agent_engine, acp_method_outcome]
  - name: kiro_cli_user_turns
    description: User prompts that reached a terminal success, failure, or cancellation.
    dashboard: true
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, session_interface, agent_mode, agent_engine, acp_client_name]
    cloudwatch_dimensions: [version_full, session_interface, agent_mode, agent_engine]
  - name: kiro_cli_goal_outcome_total
    description: Observed terminal outcomes of explicit goal workflows.
    kind: counter
    unit: "1"
    priority: P1
    temporality: delta
    attributes: [version_full, agent_engine, goal_outcome]
    cloudwatch_dimensions: [version_full, agent_engine, goal_outcome]
  - name: kiro_cli_telemetry_export_dropped_total
    description: Telemetry records permanently lost before KUTS accepted them.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, drop_reason]
    cloudwatch_dimensions: [version_full, drop_reason]
  - name: kiro_cli_turn_failure_total
    description: User turns that terminated with a typed failure.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, session_interface, agent_mode, agent_engine, turn_failure_reason]
    cloudwatch_dimensions: [version_full, session_interface, agent_mode, agent_engine, turn_failure_reason]
  - name: kiro_cli_turn_cancelled_total
    description: User turns cancelled before reaching success or failure.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, session_interface, agent_mode, agent_engine]
    cloudwatch_dimensions: [version_full, session_interface, agent_mode, agent_engine]
  - name: kiro_cli_process_peak_rss_bytes
    description: Peak resident-set size observed when a CLI process exits cleanly.
    dashboard: true
    kind: histogram
    unit: By
    priority: P1
    temporality: delta
    attributes: [version_full, os_type, agent_engine, process_role]
    cloudwatch_dimensions: [version_full, os_type, agent_engine, process_role]
  - name: kiro_cli_tui_heap_used_bytes
    description: Periodic Bun JavaScript heap usage for the TUI process.
    kind: observable_gauge
    unit: By
    priority: P1
    temporality: cumulative
    attributes: [version_full, os_type, agent_engine]
    cloudwatch_dimensions: [version_full, os_type, agent_engine]
  - name: kiro_cli_tui_event_loop_delay_p99_seconds
    description: Per-window p99 Bun event-loop delay in the TUI process.
    kind: histogram
    unit: s
    priority: P1
    temporality: delta
    attributes: [version_full, os_type, agent_engine]
    cloudwatch_dimensions: [version_full, os_type, agent_engine]
  - name: kiro_cli_tui_input_to_render_p95_seconds
    description: Per-window p95 latency from the TUI input callback through React rendering.
    kind: histogram
    unit: s
    priority: P1
    temporality: delta
    attributes: [version_full, os_type, agent_engine]
    cloudwatch_dimensions: [version_full, os_type, agent_engine]
  - name: kiro_cli_tui_render_duration_seconds
    description: In-process duration of each completed Twinki render.
    kind: histogram
    unit: s
    priority: P1
    temporality: delta
    attributes: [version_full, os_type, agent_engine, render_kind]
    cloudwatch_dimensions: [version_full, os_type, agent_engine, render_kind]
  - name: kiro_cli_auth_failure_total
    description: Explicit login or credential refresh operations that ended in an unrecovered failure.
    kind: counter
    unit: "1"
    priority: P0
    temporality: delta
    attributes: [version_full, auth_method, auth_flow, auth_operation, auth_failure_reason]
    cloudwatch_dimensions: [version_full, auth_method, auth_flow, auth_operation, auth_failure_reason]
