[package]
name = "kiro-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Bundled MCP stdio shim for kiro-bot — currently hosts the Taskei tool family; knowledge / github migrate in via a follow-up consolidation plan. Phase 1d: rmcp ServerHandler proxying to the SigV4-signed Taskei gateway with per-tool readOnlyHint annotations and a startup tools/list schema-pin."

# Primary binary. Phase 1c-bundle introduces the bundled name.
[[bin]]
name = "kiro-mcp"
path = "src/main.rs"

# Deprecated alias kept for one release so any in-flight kiro-bot
# agent.json or local script still resolving `kiro-taskei-mcp` keeps
# working until Phase 2's `kiro-help.json` switch lands. Removed in
# Phase 2. Both this and the canonical `kiro-mcp` binary reduce to a
# 3-line shim that calls `kiro_mcp::cli::run_cli`.
[[bin]]
name = "kiro-taskei-mcp"
path = "src/bin/kiro-taskei-mcp.rs"

# Operator/dev probe — captures the live gateway tools/list response into
# `src/families/taskei/fixtures/taskei-tools.json` for the runtime
# schema-pin assertion. Not shipped in the kiro-bot OCI image; ignored
# by the release workflow's per-package build list.
[[bin]]
name = "dump-taskei-tools"
path = "src/bin/dump-taskei-tools.rs"

[lib]
name = "kiro_mcp"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sigv4 = "1.4"
aws-smithy-runtime-api.workspace = true
clap = { workspace = true, features = ["env"] }
hex.workspace = true
http = "1"
reqwest = { workspace = true }
# Phase 1d adds rmcp's server + stdio transport so kiro-help can dispatch
# Taskei tools over the bundled shim. `rmcp` itself is the workspace
# dep; we just opt into the right feature subset.
rmcp = { workspace = true, features = ["server", "transport-io"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
url.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net"] }
http-body-util = "0.1"
trybuild = "1"
