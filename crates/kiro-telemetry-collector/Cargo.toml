[package]
name = "kiro-telemetry-collector"
version = "0.0.0-dev"
edition = "2024"
publish = false
description = "Manages a local OpenTelemetry Collector binary for kiro-cli"

[lints]
workspace = true

[dependencies]
dirs.workspace = true
fs4.workspace = true
hex.workspace = true
libc.workspace = true
reqwest = { workspace = true, default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }

[dev-dependencies]
serde_yaml.workspace = true
tempfile.workspace = true
tokio = { workspace = true }
