[package]
name = "kiro-telemetry-observer"
version = "0.0.0-dev"
edition = "2024"
publish = false
description = "Telemetry observer actor and extension trait for kiro-cli harnesses (V2 / ACP / V3)."

[lints]
workspace = true

[dependencies]
agent.workspace = true
async-trait.workspace = true
futures.workspace = true
kiro-telemetry.workspace = true
kiro-telemetry-host.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tracing.workspace = true

[dev-dependencies]
chrono.workspace = true
kiro-telemetry-legacy.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
uuid = { workspace = true, features = ["v4"] }
