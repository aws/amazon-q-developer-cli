[package]
name = "kiro-taskei-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "MCP stdio server backed by Amazon Taskei (SigV4 + STS). Phase 1b: signs HTTP with SigV4 and emits a structured taskei_audit log per call; rmcp server lands in 1d."

[[bin]]
name = "kiro-taskei-mcp"
path = "src/main.rs"

[lib]
name = "kiro_taskei_mcp"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sigv4 = "1.4"
aws-smithy-runtime-api.workspace = true
clap = { workspace = true, features = ["env"] }
http = "1"
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
url.workspace = true
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
hyper = { workspace = true, features = ["server", "http1"] }
hyper-util = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net"] }
http-body-util = "0.1"
