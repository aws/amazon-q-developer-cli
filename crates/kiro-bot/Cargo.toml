[package]
name = "kiro-bot"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Bot runtime for Kiro CLI — manages ACP-backed agent instances with pluggable frontends (Slack, cron, CLI)"

[[bin]]
name = "kiro-bot"
path = "src/main.rs"

[dependencies]
# Workspace deps
agent-client-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
chrono.workspace = true
clap.workspace = true
dirs.workspace = true
futures.workspace = true
http.workspace = true
regex.workspace = true
reqwest.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite.workspace = true
tokio-util = { workspace = true, features = ["compat"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustls.workspace = true

# New deps (not yet in workspace)
axum = "0.7"
cedar-policy = "4.0"
cron = "0.16"
jsonschema = { version = "0.44", default-features = false }
rpassword = "7"
slack-morphism = { version = "2.24.1", features = ["hyper"] }
subtle = "2.6"
uuid.workspace = true

[dev-dependencies]
aws-sdk-dynamodb = { workspace = true, features = ["test-util"] }
aws-smithy-mocks.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
