name = "kiro-help"
# The git worktree the container entrypoint clones at the embedded source-sha.
# Without this the agent is rooted in the bot's own config dir, which
# agents/kiro-help.json denies reads on ($KIRO_HOME/bots).
working_directory = "/var/lib/kiro-cli"

[rate_limit]
max_prompts = 10
window_secs = 60

[frontend]
type = "slack"
bot_name = "KiroHelp"
# Substituted by docker/entrypoint.sh from the BOT_MEMBER_ID env var the CDK
# stack injects per stage. Keep it a placeholder: the entrypoint hard-fails if
# this literal is missing, and a baked-in id breaks @-mention detection.
bot_member_id = "${BOT_MEMBER_ID}"
conversation_history = 10

[agent]
command = "kiro-cli acp"
model = ""
# Phase 6: pin to the bot-only kiro-help agent (chat-cli/src/agents/kiro-help.json),
# distinct from the in-CLI kiro_help built-in. Differs in tool list and prompt.
default_mode = "kiro-help"
approval_policy = "ask"
max_workers = 5
max_active_work_items = 64
idle_timeout_secs = 300
mcp_wait_ms = 2000

[authorization]
cedar_policy_file = "policies/agents.cedar"

[[response_policies]]
conversation = "dm:*"
trigger = "always"
reply = "inline"

[[response_policies]]
conversation = "*"
trigger = "directed_only"
reply = "thread"
